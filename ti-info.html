<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"><script src="dh-phone.js"></script><link rel="stylesheet" href="dh-mobile.css">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B3A6B">
<title>My Workspace — IT Info &amp; Newsletter / Info de TI y Boletín</title>
<style>
  :root{--navy:#1B3A6B;--gold:#C8922A;--lt:#D6E4F7;--ink:#1E2735;--gray:#6B6B6B;--red:#C0392B;--green:#2E7D32}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F6;color:var(--ink)}
  header{background:var(--navy);border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff}
  header h1{font-size:18px} header a{color:var(--lt);font-size:13px;text-decoration:none}
  main{max-width:820px;margin:0 auto;padding:16px 14px 70px}
  .card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 0 #dfe5ee,0 10px 26px -22px rgba(18,40,74,.5);margin-bottom:12px}
  .post h2{font-size:17px;color:var(--navy);margin:4px 0 8px}
  .post .body{font-size:15px;line-height:1.55;overflow-wrap:anywhere}
  .post .body a{color:var(--navy);font-weight:600}
  .meta{font-size:12.5px;color:var(--gray);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
  .t-boletin{background:#e8eef8;color:var(--navy)} .t-aviso{background:#fff1d6;color:#8a5a00} .t-guia{background:#e3f4e5;color:var(--green)} .draft{background:#eceff3;color:#6b7482}
  .pin{border-left:6px solid var(--gold)}
  label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:10px 0 3px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid #cfd6e2;border-radius:10px;min-height:44px;background:#fff}
  textarea{min-height:160px;resize:vertical}
  .chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;margin-top:10px}.chk input{width:22px;min-height:22px}
  .btn{border:0;background:var(--navy);color:#fff;border-radius:10px;min-height:44px;padding:0 18px;font:700 15px 'Segoe UI',Arial,sans-serif;cursor:pointer}
  .btn.alt{background:#fff;color:var(--navy);border:1px solid #cfd6e2} .btn.warn{background:var(--red)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .empty{color:var(--gray);padding:18px 2px;font-size:15px}
  .okm{color:var(--green);font-size:14px;margin-top:8px}.errm{color:var(--red);font-size:14px;margin-top:8px}
  .hide{display:none!important}
  .intro{font-size:14.5px;line-height:1.5;color:#46505f}
</style>
<meta name="dh-i18n" content="on">
<script src="dh-chrome.js" defer></script>
</head>
<body>
<header><h1>💻 IT Info &amp; Newsletter / Info de TI y Boletín</h1><a href="index.html">← Home / Inicio</a></header>
<main>
  <p class="intro" id="intro"></p>
  <div class="card hide" id="ed"></div>
  <div class="row hide" id="newrow" style="margin:0 0 12px"><button class="btn" id="newbtn" type="button"></button></div>
  <div id="list"></div>
</main>
<script src="dh-session.js"></script>
<script>
const $=id=>document.getElementById(id);
const tr=s=>(window.DH&&DH.i18n)?DH.i18n.pick(s):s;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LA='America/Los_Angeles';
const TIPO={boletin:'Monthly newsletter / Boletín mensual',aviso:'Alert / Alerta',guia:'Guide / Guía'};
let D={admin:false,items:[]};
function fmt(iso){return new Intl.DateTimeFormat('en-US',{timeZone:LA,month:'short',day:'numeric',year:'numeric'}).format(new Date(iso));}
function rich(t){ // escape, then turn https links and line breaks into HTML
  let h=esc(t).replace(/(https:\/\/[^\s<]+)/g,u=>'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>');
  return h.replace(/\n/g,'<br>');
}
function render(){
  $('intro').textContent=tr('Cybersecurity updates, scams to watch for and IT guides from our IT team. Need help now? Use IT tickets. / Novedades de ciberseguridad, estafas a las que hay que estar atento y guías del equipo de TI. ¿Necesitas ayuda ahora? Usa Tickets de TI.');
  $('newrow').classList.toggle('hide',!D.admin); $('newbtn').textContent=tr('+ New post / + Nueva publicación');
  $('list').innerHTML=D.items.length?D.items.map(x=>`<div class="card post${x.fijada?' pin':''}"><div class="meta"><span class="pill t-${esc(x.tipo)}">${esc(tr(TIPO[x.tipo]||x.tipo))}</span>${x.fijada?'<span>📌 '+esc(tr('Pinned / Fijado'))+'</span>':''}${x.publicada?'':'<span class="pill draft">'+esc(tr('Draft / Borrador'))+'</span>'}<span>${esc(fmt(x.creado))}</span></div><h2>${esc(x.titulo)}</h2><div class="body">${rich(x.cuerpo)}</div>${D.admin?`<div class="row"><button class="btn alt" type="button" data-e="${x.id}">${esc(tr('Edit / Editar'))}</button><button class="btn alt" type="button" data-d="${x.id}">${esc(tr('Delete / Borrar'))}</button></div>`:''}</div>`).join(''):'<p class="empty">'+esc(tr('Nothing posted yet. / Aún no hay publicaciones.'))+'</p>';
}
function editor(x){
  x=x||{tipo:'boletin',publicada:true,fijada:false,titulo:'',cuerpo:''}; const ed=$('ed'); ed.classList.remove('hide'); ed.dataset.id=x.id||'';
  ed.innerHTML=`<label for="e-t">${esc(tr('Title / Título'))}</label><input id="e-t" maxlength="160" value="${esc(x.titulo)}">
  <label for="e-k">${esc(tr('Type / Tipo'))}</label><select id="e-k">${Object.keys(TIPO).map(k=>`<option value="${k}"${k===x.tipo?' selected':''}>${esc(tr(TIPO[k]))}</option>`).join('')}</select>
  <label for="e-b">${esc(tr('Text (links starting with https:// become clickable) / Texto (los enlaces que empiezan con https:// se vuelven clicables)'))}</label><textarea id="e-b" maxlength="12000">${esc(x.cuerpo)}</textarea>
  <label class="chk"><input type="checkbox" id="e-p"${x.publicada?' checked':''}>${esc(tr('Published (visible to everyone) / Publicado (visible para todos)'))}</label>
  <label class="chk"><input type="checkbox" id="e-f"${x.fijada?' checked':''}>${esc(tr('Pin at the top / Fijar arriba'))}</label>
  <div class="row"><button class="btn" id="e-s" type="button">${esc(tr('Save / Guardar'))}</button><button class="btn alt" id="e-c" type="button">${esc(tr('Cancel / Cancelar'))}</button></div><p id="e-m" role="status"></p>`;
  $('e-c').onclick=()=>ed.classList.add('hide');
  $('e-s').onclick=async()=>{const m=$('e-m'); const t=$('e-t').value.trim(), b=$('e-b').value.trim();
    if(!t||!b){m.className='errm';m.textContent=tr('Title and text are required. / Título y texto son obligatorios.');return;}
    $('e-s').disabled=true;
    try{ await DH.rpc('ti_info_guardar',{p_id:ed.dataset.id||null,p_titulo:t,p_cuerpo:b,p_tipo:$('e-k').value,p_fijada:$('e-f').checked,p_publicada:$('e-p').checked}); ed.classList.add('hide'); await load(); }
    catch(e){ m.className='errm'; m.textContent=tr('Could not save. / No se pudo guardar.'); $('e-s').disabled=false; } };
  window.scrollTo({top:0,behavior:'smooth'});
}
$('newbtn').onclick=()=>editor();
$('list').addEventListener('click',async e=>{
  const be=e.target.closest('button[data-e]'), bd=e.target.closest('button[data-d]');
  if(be){ editor(D.items.find(x=>x.id===be.dataset.e)); }
  if(bd&&confirm(tr('Delete this post? / ¿Borrar esta publicación?'))){ try{ await DH.rpc('ti_info_borrar',{p_id:bd.dataset.d}); await load(); }catch(x){} }
});
async function load(){ try{ D=await DH.rpc('ti_info_listar'); }catch(e){ D={admin:false,items:[]}; } render(); }
(async()=>{ if(!DH.token()){location.href='index.html';return;} await load(); })();
</script>
</body>
</html>
