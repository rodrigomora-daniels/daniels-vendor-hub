<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"><script src="dh-phone.js"></script><link rel="stylesheet" href="dh-mobile.css">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B3A6B">
<title>My Workspace — Receiving &amp; Next Day Delivery</title>
<style>
  :root{--navy:#1B3A6B;--gold:#C8922A;--lt:#D6E4F7;--ink:#1E2735;--gray:#6B6B6B;--red:#C0392B;--green:#2E7D32;--blue:#1769c2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F6;color:var(--ink)}
  header{background:var(--navy);border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff}
  header h1{font-size:18px} header a{color:var(--lt);font-size:13px;text-decoration:none}
  main{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .tabs,.seg{display:flex;background:#fff;border-radius:10px;padding:3px;box-shadow:0 1px 0 #dfe5ee}
  .tabs button,.seg button{border:0;background:none;font:600 14px 'Segoe UI',Arial,sans-serif;color:var(--navy);padding:0 16px;min-height:40px;border-radius:8px;cursor:pointer}
  .tabs button.on,.seg button.on{background:var(--navy);color:#fff}
  .sp{flex:1}
  .btn{border:0;background:var(--navy);color:#fff;border-radius:10px;min-height:44px;padding:0 18px;font:700 15px 'Segoe UI',Arial,sans-serif;cursor:pointer}
  .btn.alt{background:#fff;color:var(--navy);border:1px solid #cfd6e2}
  .btn[disabled]{opacity:.5}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .note{font-size:13px;color:var(--gray);margin:0 2px 10px}
  .card{background:#fff;border-radius:10px;box-shadow:0 1px 0 #dfe5ee,0 10px 26px -22px rgba(18,40,74,.5);overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{position:sticky;top:0;background:#F4F6FA;text-align:left;font-size:12.5px;color:var(--navy);padding:9px 10px;border-bottom:1px solid #dfe5ee;white-space:nowrap}
  main{padding-bottom:90px}
  td{padding:9px 10px;border-bottom:1px solid #eef1f6;vertical-align:top}
  th.sh{cursor:pointer;user-select:none}th.sh:hover{background:#E8EEF8}th.sh i{font-style:normal;font-size:10px;margin-left:4px;color:#8a97ab}th.sh.on i{color:var(--navy)}
  tr.row{cursor:pointer} tr.row:hover td{background:#f8fafd}
  tr.row.sel td{background:#E8F1FF}
  td.ck,th.ck{width:34px;padding-left:12px;padding-right:0}td.ck input,th.ck input{width:20px;height:20px;cursor:pointer}
  .flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #eef1f6;background:#FAFBFD}
  .flt select,.flt input[type=search]{height:36px;border:1px solid #c9d3e0;border-radius:8px;padding:0 10px;font:inherit;font-size:13.5px;background:#fff;max-width:100%}
  .flt .cnt{font-size:13px;color:#5B6B82}.flt .sp{flex:1}
  #selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0B2D5C;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,.25)}
  #selbar.on{display:flex}#selbar b{font-size:15px;margin-right:auto}
  #selbar button{min-height:40px;border-radius:10px;border:0;padding:0 14px;font:700 13.5px inherit;font-family:inherit;cursor:pointer;background:#fff;color:#0B2D5C}
  #selbar button.go{background:#1E8E5A;color:#fff}#selbar button.x{background:transparent;color:#fff;border:1.5px solid #fff}
  .pill{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .s-pending,.s-new{background:#dfe7ff;color:#2b3d99}.s-received_complete,.s-delivered{background:#e3f4e5;color:var(--green)}
  .s-received_incomplete,.s-in_progress{background:#fff1d6;color:#8a5a00}
  .t-will_call{background:#e3f4e5;color:var(--green)}.t-cita{background:#d9ecff;color:#0e4f94}
  .ap{display:inline-block;border-radius:4px;padding:3px 8px;color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
  .ap.past{background:#c93a3a}.ap.today{background:#2e9e4a}.ap.next{background:#1769c2}
  .pod{border:1px solid #dfe5ee;border-radius:10px;margin:0 0 14px;max-height:40vh;overflow:auto;background:#FAFBFD}
  .pod h4{margin:0;padding:9px 12px;font:700 14px 'Segoe UI',Arial,sans-serif;color:var(--navy);background:#F4F6FA;position:sticky;top:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pod h4 small{font-weight:600;color:var(--gray)}
  .pod table{font-size:13px}.pod td,.pod th{padding:6px 10px}.pod th{position:static}
  .pod h4.rh{background:#EAF4EA;color:#2E5E2E}
  .pod .n{text-align:right;white-space:nowrap}.pod .kt{font-size:11px;font-weight:700;color:#8a5a00;background:#fff1d6;border-radius:4px;padding:1px 5px;margin-left:6px}
  .pod .nd{padding:10px 12px;font-size:13px;color:#5B6B82}
  .empty{color:var(--gray);padding:22px 14px;font-size:14px}
  /* calendar */
  .cal-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #eef1f6}
  .cal-h h2{font:700 16px 'Segoe UI',Arial,sans-serif;color:var(--navy);flex:1;text-align:center}
  .cal-h button{border:1px solid #cfd6e2;background:#fff;border-radius:8px;min-height:38px;min-width:42px;font:700 15px 'Segoe UI',Arial,sans-serif;color:var(--navy);cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .dow{font-size:12px;font-weight:700;color:var(--gray);text-align:center;padding:6px 0;background:#F4F6FA}
  .day{min-height:104px;border-top:1px solid #eef1f6;border-left:1px solid #eef1f6;padding:4px;cursor:pointer;overflow:hidden}
  .day:nth-child(7n+1){border-left:0}
  .day.out{background:#fafbfd;color:#a5adba}
  .day.today{background:#fff8e6}
  .day .n{font-size:12px;font-weight:700;margin-bottom:3px}
  .ev{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:2px 5px;margin-bottom:3px;font:600 11.5px 'Segoe UI',Arial,sans-serif;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev.past{background:#c93a3a}.ev.today{background:#2e9e4a}.ev.next{background:#1769c2}.ev.done{background:#7b8494}
  .more{font-size:11.5px;color:var(--navy);font-weight:700}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(15,25,45,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
  .md{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:16px 16px 18px}
  .md h3{font-size:17px;color:var(--navy);margin-bottom:10px}
  .f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .f .w{grid-column:1/-1}
  label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid #cfd6e2;border-radius:10px;min-height:44px;background:#fff}
  textarea{min-height:76px;resize:vertical}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .acts .btn.del{background:#fff;color:var(--red);border:1px solid var(--red);margin-left:auto}
  .acts .btn.del.ask{background:var(--red);color:#fff}
  .err{background:#fdecea;color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.45}
.xc{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:60;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:#12284A;color:#fff;font:700 14px 'Segoe UI',Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}.xc:focus-visible{outline:2px solid #C8922A;outline-offset:2px}
  .hide,.ov.hide{display:none!important}
  .small{font-size:12px;color:var(--gray);margin-top:8px}
  @media(max-width:700px){.f{grid-template-columns:1fr}.day{min-height:70px}.ev{font-size:10.5px}.hm{display:none}}
</style>
<meta name="dh-i18n" content="on">
<script src="dh-chrome.js" defer></script>
</head>
<body>
<header><h1>🚚 Receiving &amp; Next Day Delivery / Recepción y Entrega al Día Siguiente</h1><a href="index.html">← Home / Inicio</a></header>
<main>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button id="tb-rec" class="on" onclick="setTab('rec')">Receiving Schedule / Recepción</button>
      <button id="tb-ndd" onclick="setTab('ndd')">Next Day Delivery Log / Entregas</button>
    </div>
    <div class="seg">
      <button id="vw-list" class="on" onclick="setView('list')">List / Lista</button>
      <button id="vw-cal" onclick="setView('cal')">Calendar / Calendario</button>
      <button id="vw-log" onclick="setView('log')">Activity / Bitácora</button>
    </div>
    <span class="sp"></span>
    <button class="btn alt" id="bt-sel" onclick="toggleSel()">☑ Select / Seleccionar</button>
    <button class="btn alt" onclick="openReport()">⬇ Report / Reporte</button>
    <button class="btn" onclick="openForm(null)">+ Add / Agregar</button>
  </div>
  <p class="note">Records are kept for 12 months and then deleted automatically. / Los registros se guardan 12 meses y luego se borran solos.</p>
  <div class="card" id="box"></div>
</main>
<div id="selbar" role="region" aria-label="Bulk actions"></div>
<div class="ov hide" id="ov"><button type="button" class="xc" onclick="closeForm()" aria-label="Close / Cerrar">✕ Close / Cerrar</button><div class="md" id="md" role="dialog" aria-modal="true"></div></div>
<script src="dh-session.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tr=s=>(window.DH&&DH.i18n)?DH.i18n.pick(s):s;
const LA='America/Los_Angeles';
const ST={
  rec:{pending:'Pending / Pendiente',received_complete:'Received Complete / Recibido completo',received_incomplete:'Received Incomplete / Recibido incompleto'},
  ndd:{new:'New / Nuevo',in_progress:'In progress / En proceso',delivered:'Delivered / Entregado'}};
const TY={cita:'Receiving Appointment / Cita de recepción',will_call:'Will Call'};
let HOPEN=null, ACC=null, TAB='rec', VIEW='list', DATA={rec:[],ndd:[]}, CUR=null, ASK=false;
let SELMODE=false, SEL=new Set(), FLT={st:'',when:'',q:''}, SRT={rec:{k:'',d:1},ndd:{k:'',d:1}};
let CM=(function(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:LA}).format(new Date()).split('-');return {y:+p[0],m:+p[1]-1};})();

/* ---- time helpers (everything is shown in Los Angeles time) ---- */
const dayKey=iso=>new Intl.DateTimeFormat('en-CA',{timeZone:LA}).format(new Date(iso));
const todayKey=()=>dayKey(new Date());
function fmtDT(iso){return new Intl.DateTimeFormat('en-US',{timeZone:LA,month:'2-digit',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(iso)).replace(',','');}
function fmtT(iso){return new Intl.DateTimeFormat('en-US',{timeZone:LA,hour:'numeric',minute:'2-digit'}).format(new Date(iso));}
function fmtD(k){const [y,m,d]=k.split('-');return m+'/'+d+'/'+y;}
function toInput(iso){const p={};new Intl.DateTimeFormat('en-US',{timeZone:LA,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(iso)).forEach(x=>p[x.type]=x.value);return p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute;}
function fromInput(s){const g=new Date(s+':00Z');const p={};new Intl.DateTimeFormat('en-US',{timeZone:LA,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(g).forEach(x=>p[x.type]=x.value);
  const wall=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);return new Date(g.getTime()-(wall-g.getTime())).toISOString();}
function apClass(iso,done){const k=dayKey(iso),t=todayKey();return done?'done':(k<t?'past':(k===t?'today':'next'));}

/* ---- load ---- */
async function init(){
  if(!DH.token()){location.href='index.html';return;}
  try{ACC=await DH.rpc('logistica_mi_acceso');}catch(e){$('box').innerHTML='<div class="empty">'+esc(tr('Could not load. / No se pudo cargar.'))+'</div>';return;}
  if(!ACC||(!ACC.rec&&!ACC.ndd)){document.querySelector('.bar').classList.add('hide');$('box').innerHTML='<div class="empty">'+esc(tr('You do not have access to this section. Ask your manager. / No tienes acceso a esta sección. Pregunta a tu gerente.'))+'</div>';return;}
  const hm=(location.hash||'').match(/^#(rec|ndd)(?::([0-9a-f-]{36}))?$/); HOPEN=hm&&hm[2]||null;
  TAB=(hm&&hm[1]==='ndd'&&ACC.ndd)||(hm&&hm[1]==='rec'&&ACC.rec)?hm[1]:(ACC.rec?'rec':'ndd');
  $('tb-rec').classList.toggle('hide',!ACC.rec);$('tb-ndd').classList.toggle('hide',!ACC.ndd);
  paintBar(); await load();
}
async function load(){
  if(VIEW==='log'){LOG=[];}
  try{
    const [a,b]=await Promise.all([ACC.rec?DH.rpc('recepciones_listar'):[],ACC.ndd?DH.rpc('ndd_listar'):[]]);
    DATA.rec=a||[]; DATA.ndd=b||[];
  }catch(e){$('box').innerHTML='<div class="empty">'+esc(tr('Could not load the records. / No se pudieron cargar los registros.'))+'</div>';return;}
  if(VIEW==='log'){loadLog();return;}
  render();
  if(HOPEN){const id=HOPEN;HOPEN=null;if(DATA[TAB].some(x=>x.id===id))openForm(id);}
}
function paintBar(){ if(typeof paintBar2==='function')paintBar2();
  $('tb-rec').classList.toggle('on',TAB==='rec');$('tb-ndd').classList.toggle('on',TAB==='ndd');
  $('vw-list').classList.toggle('on',VIEW==='list');$('vw-cal').classList.toggle('on',VIEW==='cal');$('vw-log').classList.toggle('on',VIEW==='log');
}
function setTab(t){TAB=t;FLT={st:'',when:'',q:''};endSel();paintBar();if(VIEW==='log')loadLog();else render();}
function setView(v){VIEW=v;if(v!=='list')endSel();paintBar();if(v==='log'){loadLog();}else render();}
window.addEventListener('dh-lang',()=>{if(!$('ov').classList.contains('hide'))return;render();});

/* ---- render ---- */
const dateOf=r=>TAB==='rec'?dayKey(r.cita):r.fecha_ndd;
const isDone=r=>r.estado==='received_complete'||r.estado==='delivered';
function pill(r){return `<span class="pill s-${r.estado}">${esc(tr(ST[TAB][r.estado]||r.estado))}</span>`;}
function render(){
  const rows=DATA[TAB];
  $('box').innerHTML=VIEW==='list'?listHtml(rows):(VIEW==='cal'?calHtml(rows):logHtml());
}
let LOG=[];
const FL={vendor:'Vendor',tipo:'Type',cita:'Appointment',po:'PO #',piezas:'Pieces',contenedor:'Container',contenedor_num:'Container #',driver_id:'Driver ID',estado:'Status',notas:'Notes',factura:'Invoice',cliente:'Customer',fecha_ndd:'Date of NDD',direccion:'Address'};
function fv(k,v){if(v==null||v==='')return '—';if(k==='cita')return fmtDT(v);if(k==='estado')return tr(ST[TAB][v]||v);if(k==='tipo')return tr(TY[v]||v);return String(v);}
function logTxt(l){
  const a={created:'created / creó',updated:'updated / actualizó',deleted:'deleted / borró'}[l.accion];
  let t=tr(a);
  if(l.cambios)t+=': '+Object.keys(l.cambios).map(k=>(FL[k]||k)+' '+fv(k,l.cambios[k][0])+' → '+fv(k,l.cambios[k][1])).join('; ');
  return t;
}
function dstr(d){return new Intl.DateTimeFormat('en-CA',{timeZone:LA}).format(d);}
async function loadLog(){
  $('box').innerHTML='<div class="empty">…</div>';
  try{const r=await DH.rpc('logistica_bitacora',{p_modulo:TAB,p_desde:dstr(new Date(Date.now()-365*864e5)),p_hasta:dstr(new Date())});LOG=(r&&r.rows)||[];}
  catch(e){$('box').innerHTML='<div class="empty">'+esc(tr('Could not load. / No se pudo cargar.'))+'</div>';return;}
  render();
}
function logHtml(){
  if(!LOG.length)return '<div class="empty">'+esc(tr('No activity yet. / Aún no hay actividad.'))+'</div>';
  return `<table><thead><tr><th>${esc(tr('When / Cuándo'))}</th><th>${esc(tr('Who / Quién'))}</th><th>${esc(tr('Record / Registro'))}</th><th>${esc(tr('What happened / Qué pasó'))}</th></tr></thead><tbody>`+
    LOG.map(l=>`<tr><td style="white-space:nowrap">${esc(fmtDT(l.cuando))}</td><td data-no-i18n>${esc(l.quien||'')}</td><td data-no-i18n>${esc(l.registro||'')}</td><td data-no-i18n>${esc(logTxt(l))}</td></tr>`).join('')+'</tbody></table>';
}
/* ---- reports (CSV) ---- */
function openReport(){
  const t=dstr(new Date(Date.now()+90*864e5)), f=dstr(new Date(Date.now()-30*864e5));
  $('md').innerHTML=`<h3>${esc(tr('Download report / Descargar reporte'))} — ${esc(tr(TAB==='rec'?'Receiving / Recepción':'Next Day Delivery / Entregas'))}</h3>
   <div class="f"><div><label for="r-from">${esc(tr('From / Desde'))}</label><input type="date" id="r-from" value="${f}"></div><div><label for="r-to">${esc(tr('To / Hasta'))}</label><input type="date" id="r-to" value="${t}"></div></div>
   <div class="acts" style="margin-top:8px"><button class="btn alt" onclick="presetUp(30)">${esc(tr('Upcoming 30 / Próximos 30'))}</button><button class="btn alt" onclick="presetUp(90)">${esc(tr('Upcoming 90 / Próximos 90'))}</button><button class="btn alt" onclick="preset(7)">7 ${esc(tr('days / días'))}</button><button class="btn alt" onclick="preset(30)">30 ${esc(tr('days / días'))}</button><button class="btn alt" onclick="preset(90)">90 ${esc(tr('days / días'))}</button><button class="btn alt" onclick="preset(180)">180 ${esc(tr('days / días'))}</button></div>
   <div class="err hide" id="ferr" role="alert"></div>
   <div class="acts"><button class="btn" onclick="dl('rows')">${esc(tr('Records (CSV) / Registros (CSV)'))}</button><button class="btn" onclick="dl('log')">${esc(tr('Activity log (CSV) / Bitácora (CSV)'))}</button><button class="btn alt" onclick="closeForm()">${esc(tr('Close / Cerrar'))}</button></div>
   ${SUPER()?`<div class="acts" style="margin-top:6px"><label class="btn alt" style="display:inline-flex;align-items:center;margin:0;cursor:pointer">${esc(tr('Import CSV from Lists / Importar CSV de Lists'))}<input type="file" accept=".csv,text/csv" hidden onchange="importCSV(this.files[0])"></label></div><div class="small" id="imp-msg"></div>`:''}
   <div class="small">${esc(tr('Records are kept 12 months, so reports can cover up to the last year. / Los registros se guardan 12 meses, así que los reportes cubren hasta el último año.'))}</div>`;
  $('ov').classList.remove('hide');
}
let ISSUP=false;
const SUPER=()=>{try{return ISSUP||((DH.emp&&DH.emp())||{}).nivel_admin==='super_admin';}catch(e){return false;}};
try{DH.rpc('es_super_admin').then(r=>{ISSUP=(r===true);}).catch(()=>{});}catch(e){}
function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"')q=true; else if(ch===','){r.push(c);c='';} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')rows.push(r);r=[];} else c+=ch;}
  if(c!==''||r.length){r.push(c);rows.push(r);} return rows;}
function usDT(s){const m=String(s||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})\s*(AM|PM))?/i);if(!m)return null;
  let h=m[4]?+m[4]:0;const ap=(m[6]||'').toUpperCase();if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;
  const p=n=>String(n).padStart(2,'0');return {d:m[3]+'-'+p(m[1])+'-'+p(m[2]),t:p(h)+':'+m[5]};}
function person(s){s=String(s||'').trim();if(!s)return '';if(s.includes('@'))s=s.split('@')[0].replace(/[._]+/g,' ');return s.replace(/\s+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).slice(0,80);}
function mapRows(mod,text){
  const rows=parseCSV(text); if(rows.length<2)return [];
  const H=rows[0].map(h=>h.replace(/%23/g,'#').trim().toLowerCase()), ix=n=>H.indexOf(n);
  const cut=Date.now()-365*864e5, out=[];
  for(const r of rows.slice(1)){
    const g=n=>{const i=ix(n);return i<0?'':(r[i]||'').trim();};
    const cr=usDT(g('created')); if(!cr)continue; const creada=fromInput(cr.d+'T'+cr.t); if(new Date(creada).getTime()<cut)continue;
    if(mod==='rec'){
      const ap=usDT(g('receiving appointment')); if(!ap||!g('vendor id'))continue;
      const st=g('status').toLowerCase();

function visible(all){

  return all.filter(r=>{
    if(FLT.st&&r.estado!==FLT.st)return false;
    const k=dateOf(r);
    if(FLT.when==='past'&&!(k<t))return false; if(FLT.when==='old7'&&!(k<o))return false;
    if(FLT.when==='today'&&k!==t)return false; if(FLT.when==='future'&&!(k>t))return false;
    if(q&&!((TAB==='rec'?[r.vendor,r.po,r.driver_id,r.contenedor_num,r.notas]:[r.factura,r.cliente,r.direccion,r.notas]).join(' ').toLowerCase().includes(q)))return false;
    return true;}).sort((a,b)=>{
    const S=SRT[TAB];
    if(S.k){
      const va=a[S.k], vb=b[S.k], ea=va==null||va==='', eb=vb==null||vb==='';
      if(ea!==eb)return ea?1:-1;             // blanks always last
      const c=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb),undefined,{numeric:true,sensitivity:'base'});
      return c*S.d;
    }
    const sa=TAB==='rec'?String(a.cita||''):String(a.fecha_ndd||''), sb=TAB==='rec'?String(b.cita||''):String(b.fecha_ndd||'');

  });

    f=`<div class="f">
      <div class="w"><label for="f-vendor">Vendor / Proveedor *</label><input id="f-vendor" maxlength="80" value="${esc(r.vendor||'')}"></div>
      <div><label for="f-tipo">${esc(tr('Type / Tipo'))}</label><select id="f-tipo">${opts(TY,r.tipo||'cita')}</select></div>
      <div><label for="f-cita">${esc(tr('Appointment (LA time) / Cita (hora de LA)'))} *</label><input type="datetime-local" id="f-cita" value="${dv}"></div>
      <div><label for="f-po">PO #</label><input id="f-po" maxlength="200" value="${esc(r.po||'')}"></div>
      <div><label for="f-piezas">${esc(tr('Pieces / Piezas'))}</label><input type="number" min="0" max="100000" id="f-piezas" value="${r.piezas==null?'':r.piezas}"></div>
      <div><label for="f-cont">${esc(tr('Container / Contenedor'))}</label><select id="f-cont"><option value="false"${r.contenedor?'':' selected'}>${esc(tr('No'))}</option><option value="true"${r.contenedor?' selected':''}>${esc(tr('Yes / Sí'))}</option></select></div>
      <div><label for="f-contn">${esc(tr('Container # / No. de contenedor'))}</label><input id="f-contn" maxlength="40" value="${esc(r.contenedor_num||'')}"></div>
      <div><label for="f-driver">${esc(tr('Driver ID / ID del chofer'))}</label><input id="f-driver" maxlength="60" value="${esc(r.driver_id||'')}"></div>
      <div><label for="f-estado">${esc(tr('Status / Estado'))}</label><select id="f-estado">${opts(ST.rec,r.estado||'pending')}</select></div>
      <div class="w"><label for="f-notas">${esc(tr('Notes / Notas'))}</label><textarea id="f-notas" maxlength="500">${esc(r.notas||'')}</textarea></div></div>`;
  }else{
    f=`<div class="f">
      <div><label for="f-fac">${esc(tr('Invoice / Factura'))} *</label><input id="f-fac" maxlength="40" value="${esc(r.factura||'')}"></div>
      <div><label for="f-cli">${esc(tr('Customer name / Cliente'))} *</label><input id="f-cli" maxlength="120" value="${esc(r.cliente||'')}"></div>
      <div><label for="f-fecha">${esc(tr('Date of NDD / Fecha de entrega'))} *</label><input type="date" id="f-fecha" value="${r.fecha_ndd||dayK||todayKey()}"></div>
      <div><label for="f-estado">${esc(tr('Status / Estado'))}</label><select id="f-estado">${opts(ST.ndd,r.estado||'new')}</select></div>
      <div class="w"><label for="f-dir">${esc(tr('City of delivery (address) / Dirección de entrega'))}</label><input id="f-dir" maxlength="250" value="${esc(r.direccion||'')}"></div>
      <div class="w"><label for="f-notas">${esc(tr('Notes / Notas'))}</label><textarea id="f-notas" maxlength="600">${esc(r.notas||'')}</textarea></div></div>`;
  }
  const title=tt?(CUR?'Edit receiving / Editar recepción':'New receiving / Nueva recepción'):(CUR?'Edit delivery / Editar entrega':'New next day delivery / Nueva entrega al día siguiente');
  const hasPo=tt&&CUR&&/\d{5}/.test(CUR.po||'');
  $('md').innerHTML=`<h3>${esc(tr(title))}</h3>${hasPo?`<div class="pod" id="pod"><div class="nd">${esc(tr('Loading PO detail… / Cargando detalle de la PO…'))}</div></div>`:''}${f}<div class="err hide" id="ferr" role="alert"></div>
    <div class="acts"><button class="btn" id="fsave" onclick="save()">${esc(tr('Save / Guardar'))}</button><button class="btn alt" onclick="closeForm()">${esc(tr('Cancel / Cancelar'))}</button>${CUR&&CUR.puede_borrar?`<button class="btn del" id="fdel" onclick="del()">${esc(tr('Delete / Borrar'))}</button>`:''}</div>
    ${CUR?`<div class="small" data-no-i18n>${esc(CUR.creado_por||'')} · ${esc(tr('Deletes in / Se borra en'))} ${CUR.dias_restantes} ${esc(tr('days / días'))}</div>`:''}`;
  $('ov').classList.remove('hide'); if(hasPo)loadPod(CUR.id); setTimeout(()=>{const x=$('md').querySelector('input');if(x)x.focus();},30);
}
function closeForm(){$('ov').classList.add('hide');CUR=null;}
$('ov').addEventListener('pointerdown',e=>{if(e.target===$('ov'))closeForm();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').classList.contains('hide'))closeForm();});
function ferr(t){const e=$('ferr');e.textContent=t;e.classList.toggle('hide',!t);}
async function save(){
  let d;
  if(TAB==='rec'){
    d={vendor:$('f-vendor').value.trim(),tipo:$('f-tipo').value,cita:$('f-cita').value?fromInput($('f-cita').value):'',po:$('f-po').value,piezas:$('f-piezas').value,contenedor:$('f-cont').value==='true',contenedor_num:$('f-contn').value,driver_id:$('f-driver').value,estado:$('f-estado').value,notas:$('f-notas').value};
    if(!d.vendor||!d.cita){ferr(tr('Vendor and appointment are required. / Proveedor y cita son obligatorios.'));return;}
  }else{
    d={factura:$('f-fac').value.trim(),cliente:$('f-cli').value.trim(),fecha_ndd:$('f-fecha').value,estado:$('f-estado').value,direccion:$('f-dir').value,notas:$('f-notas').value};
    if(!d.factura||!d.cliente||!d.fecha_ndd){ferr(tr('Invoice, customer and date are required. / Factura, cliente y fecha son obligatorios.'));return;}
  }
  const b=$('fsave'); b.disabled=true; ferr('');
  try{
    const args={p_datos:d}; if(CUR)args.p_id=CUR.id;
    const r=await DH.rpc(TAB==='rec'?'recepcion_guardar':'ndd_guardar',args);
    if(r&&r.ok){closeForm();await load();return;}
    ferr(tr(r&&r.error==='invalid'?'Some values are not valid. Check and try again. / Algunos valores no son válidos. Revísalos e intenta de nuevo.':'Could not save. / No se pudo guardar.'));
  }catch(e){ferr(tr('Could not save. Check your connection. / No se pudo guardar. Revisa tu conexión.'));}
  b.disabled=false;
}
async function del(){
  const b=$('fdel');
  if(!ASK){ASK=true;b.classList.add('ask');b.textContent=tr('Tap again to delete / Toca otra vez para borrar');return;}
  try{const r=await DH.rpc(TAB==='rec'?'recepcion_borrar':'ndd_borrar',{p_id:CUR.id});if(r&&r.ok){closeForm();await load();return;}ferr(tr('Could not delete. / No se pudo borrar.'));}
  catch(e){ferr(tr('Could not delete. / No se pudo borrar.'));}
}
init();
</script>
</body>
</html>
