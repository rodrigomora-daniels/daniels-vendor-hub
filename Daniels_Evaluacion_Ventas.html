async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': options.method === 'POST' ? 'return=representation' : undefined,
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Supabase error ${res.status}: ${errText}`);
  }
  return res.status === 204 ? null : res.json();
}

/* ════════════════════════════════════════════════════════════
   INIT — same real pattern as Tier1: ?emp= param, es_admin check
   ════════════════════════════════════════════════════════════ */
async function init() {
  const params = new URLSearchParams(window.location.search);
  const empId = params.get('emp');
  const content = document.getElementById('app-content');

  if (!empId) {
    content.innerHTML = `<div class="card"><div class="no-cycle">No employee context found. Please return to the hub and try again. / No se encontró contexto de empleado. Regresa al hub e intenta de nuevo.</div></div>`;
    return;
  }

  try {
    const rows = await sbFetch(`empleados?id=eq.${empId}&select=id,nombre_completo,employee_id,tienda,es_admin,rol`);
    if (!rows || rows.length === 0) {
      content.innerHTML = `<div class="card"><div class="no-cycle">Employee not found. / Empleado no encontrado.</div></div>`;
      return;
    }
    loggedInEmployee = rows[0];
    isAdminPreview = !!loggedInEmployee.es_admin;
  } catch (err) {
    console.error('Could not load employee:', err);
    content.innerHTML = `<div class="card"><div class="no-cycle">Connection error loading your profile. / Error de conexión al cargar tu perfil.</div></div>`;
    return;
  }

  try {
    const cycles = await sbFetch(`evaluacion_ciclos?activo=eq.true&select=id,nombre,tipo,fecha_inicio,fecha_cierre&order=fecha_inicio.desc&limit=1`);
    activeCycle = (cycles && cycles.length) ? cycles[0] : null;
  } catch (err) {
    console.warn('Could not load evaluation cycle (table may not exist yet):', err);
    activeCycle = null;
  }

  if (!activeCycle) {
    content.innerHTML = `
      <div class="card">
        <div class="no-cycle">
          There is no active evaluation cycle right now. Check back when your manager opens the next cycle. / No hay un ciclo de evaluación activo en este momento. Vuelve a revisar cuando tu gerente abra el siguiente ciclo.
        </div>
      </div>`;
    document.getElementById('cycle-label').textContent = 'No active cycle / Sin ciclo activo';
    return;
  }

  document.getElementById('cycle-label').textContent = `${activeCycle.nombre} — ${loggedInEmployee.nombre_completo}`;

  renderModePicker();
}

  content.innerHTML = `<div class="card"><p style="text-align:center;color:var(--mgray);padding:20px 0;">Loading... / Cargando...</p></div>`;
  let managers = [];
  try {
    managers = await sbFetch('rpc/feedback_managers_elegibles', { method: 'POST', body: JSON.stringify({ p_empleado_id: loggedInEmployee.id }) });
  } catch (err) {
    content.innerHTML = `<div class="card"><div class="no-cycle">Could not load managers. / No se pudo cargar la lista.</div></div>`;
    return;
  }
  const rows = (managers || []).map(m => m.ya_respondido
    ? `<div class="bars-option" style="opacity:.55;cursor:default;"><div class="num">✅</div><div class="txt"><strong>${m.nombre}</strong> — Sent / Enviado</div></div>`
    : `<div class="bars-option" onclick="selectFeedbackManager('${m.manager_id}','${(m.nombre || '').replace(/'/g, "\\'")}')"><div class="num">👤</div><div class="txt"><strong>${m.nombre}</strong> <span style="color:var(--mgray);font-size:11px;">(${m.tienda || ''})</span></div></div>`
  ).join('');
  content.innerHTML = `
    <div class="card">
      <h2>Anonymous Feedback / Comentarios Anónimos</h2>
      <div class="desc">Pick your manager. Your name is never saved with your answers, and managers cannot see them. / Elige a tu gerente. Tu nombre nunca se guarda con tus respuestas y los gerentes no pueden verlas.</div>
      ${rows || '<p style="color:var(--mgray);font-size:13px;">No managers available. / No hay gerentes disponibles.</p>'}
      <button class="btn" style="margin-top:14px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderModePicker()">← Back / Regresar</button>
    </div>`;
}

function selectFeedbackManager(id, nombre) {
  feedbackManager = { id, nombre };
  feedbackAnswers = {};
  const content = document.getElementById('app-content');
  const qs = MANAGER_FEEDBACK_QUESTIONS.map((q, i) => `
    <div style="margin-bottom:18px;">
      <div style="font-size:14px;font-weight:600;color:var(--navy);margin-bottom:8px;">${i + 1}. ${q.q}</div>
      ${FEEDBACK_SCALE.map(o => `<div class="bars-option" id="fb-${q.key}-${o.v}" onclick="pickFeedback('${q.key}',${o.v})" style="padding:8px 12px;margin-bottom:6px;"><div class="txt">${o.t}</div></div>`).join('')}
    </div>`).join('');
  content.innerHTML = `
    <div class="card">
      <h2>${nombre}</h2>
      <div class="desc">Anonymous. Answer honestly. / Anónimo. Responde con honestidad.</div>
      ${qs}
      <div class="error-msg" id="fb-error">Please answer every question. / Por favor responde todas las preguntas.</div>
      <button class="btn btn-primary" id="fb-submit" onclick="submitManagerFeedback()">Send anonymously / Enviar de forma anónima</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="startManagerFeedback()">← Back / Regresar</button>
    </div>`;
}

function pickFeedback(key, v) {
  feedbackAnswers[key] = v;
  FEEDBACK_SCALE.forEach(o => {
    const el = document.getElementById(`fb-${key}-${o.v}`);
    if (el) el.classList.toggle('selected', o.v === v);
  });
}

async function submitManagerFeedback() {
  const errEl = document.getElementById('fb-error');
  if (MANAGER_FEEDBACK_QUESTIONS.some(q => feedbackAnswers[q.key] === undefined)) {
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';
  const btn = document.getElementById('fb-submit');
  btn.disabled = true; btn.textContent = 'Sending... / Enviando...';
  try {
    const rows = await sbFetch('rpc/enviar_feedback_anonimo', { method: 'POST', body: JSON.stringify({ p_empleado_id: loggedInEmployee.id, p_manager_id: feedbackManager.id, p_respuestas: feedbackAnswers }) });
    const r = rows && rows[0];
    if (!r || !r.success) { alert((r && r.message) || 'Could not send.'); btn.disabled = false; btn.textContent = 'Send anonymously / Enviar de forma anónima'; return; }
    document.getElementById('app-content').innerHTML = `
      <div class="card"><div class="success-screen"><div class="icon">✅</div>
      <h2>Thank you / Gracias</h2>
      <p>Your feedback was sent anonymously. / Tus comentarios se enviaron de forma anónima.</p>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="startManagerFeedback()">Continue / Continuar</button></div></div>`;
  } catch (err) {
    alert('Error: ' + err.message);
    btn.disabled = false; btn.textContent = 'Send anonymously / Enviar de forma anónima';
  }
}

async function startSelfAssessment() {
  evalMode = 'self';
  currentDimIdx = 0;
  responses = {};
  const content = document.getElementById('app-content');

  let existing = [];
  try {
    existing = await sbFetch(`evaluaciones?ciclo_id=eq.${activeCycle.id}&evaluado_id=eq.${loggedInEmployee.id}&evaluador_id=eq.${loggedInEmployee.id}&tipo_evaluador=eq.self&select=id,estado`);

          <p>You've already completed your self-assessment for ${activeCycle.nombre}. / Ya completaste tu autoevaluación para ${activeCycle.nombre}.</p>

/* ════════════════════════════════════════════════════════════
   SUPERVISOR MODE — search real registered employees by name
   (same empleados table that drives certifications/badges), pick
   one, enter their quota result, then BARS in third person.
   Always saves for real — no preview/skip-save behavior here,
   this is real management work product.
   ════════════════════════════════════════════════════════════ */
let allEmployeesForSearch = null;

async function startSupervisorSearch() {
  evalMode = 'supervisor';
  selectedEvaluado = null;
  currentDimIdx = 0;
  responses = {};
  quotaData = { metrics: [], pct_promedio: null };

  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="card"><p style="text-align:center;color:var(--mgray);padding:20px 0;">Loading team roster... / Cargando lista de empleados...</p></div>`;

  if (!allEmployeesForSearch) {
    try {
      allEmployeesForSearch = await sbFetch(`empleados?select=id,nombre_completo,employee_id,tienda,departamento&order=nombre_completo.asc`);
    } catch (err) {
      content.innerHTML = `<div class="card"><div class="no-cycle">Could not load the employee roster. / No se pudo cargar la lista de empleados.</div></div>`;
      return;
    }
  }
  renderSupervisorSearchScreen('');
}

function renderSupervisorSearchScreen(query) {
  const content = document.getElementById('app-content');
  const safeQ = (query || '').replace(/"/g, '&quot;');
  // The shell (with the input) is drawn ONCE. Typing only refreshes #sup-results,
  // so the input never loses focus between keystrokes.
  content.innerHTML = `
    <div class="card">
      <h2>Who are you evaluating? / ¿A quién vas a evaluar?</h2>
      <div class="desc">Your store's team appears first. Search by name to find anyone. / Tu equipo de tienda aparece primero. Busca por nombre para encontrar a cualquier persona.</div>
      <input type="text" id="sup-search" class="field-input" placeholder="Type a name... / Escribe un nombre..." value="${safeQ}" oninput="renderSupervisorResults(this.value)" style="width:100%;padding:12px 14px;border:2px solid #e8e4dc;border-radius:10px;font-size:14px;margin-bottom:14px;" autocomplete="off">
      <div id="sup-results"></div>
      <button class="btn" style="margin-top:14px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderModePicker()">← Back / Regresar</button>
    </div>`;
  renderSupervisorResults(query || '');
  const inp = document.getElementById('sup-search');
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function renderSupervisorResults(query) {
  const box = document.getElementById('sup-results');
  if (!box) return;
  const q = (query || '').trim().toLowerCase();
  const myStore = loggedInEmployee.tienda;

  // Soft filter: same store first, then everyone else grouped by store — never blocks anyone
  const pool = (allEmployeesForSearch || [])
    .filter(e => e.id !== loggedInEmployee.id)
    .filter(e => !q || (e.nombre_completo || '').toLowerCase().includes(q));

  const sameStore = pool.filter(e => myStore && e.tienda === myStore);
  const otherStore = pool.filter(e => !myStore || e.tienda !== myStore);

  function empRow(e) {
    const storeTag = e.tienda && e.tienda !== myStore
      ? ` <span style="color:var(--mgray);font-size:11px;font-weight:400;">(${e.tienda})</span>` : '';
    return `<div class="bars-option" onclick="selectEvaluado('${e.id}')">
      <div class="num">👤</div>
      <div class="txt"><strong>${e.nombre_completo}</strong>${storeTag}</div>
    </div>`;
  }

  let html = '';
  if (!pool.length) {
    html = `<p style="color:var(--mgray);font-size:13px;padding:10px 0;">No matches found. / No se encontraron coincidencias.</p>`;
  } else {
    if (sameStore.length) {
      html += `<div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;">📍 ${myStore}</div>`;
      html += sameStore.map(empRow).join('');
    }
    if (otherStore.length) {
      html += `<div style="font-size:11px;font-weight:700;color:var(--mgray);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.5px;">${sameStore.length ? '🏢 Other Locations / Otras Tiendas' : '🏢 Everyone / Todos'}</div>`;
      html += otherStore.map(empRow).join('');
    }
  }
  box.innerHTML = `<div style="max-height:420px;overflow-y:auto;">${html}</div>`;
}

async function selectEvaluado(empId) {
  selectedEvaluado = (allEmployeesForSearch || []).find(e => e.id === empId);
  if (!selectedEvaluado) return;

  // Check for an existing supervisor evaluation of this person, this cycle, by this evaluator
  let existing = [];
  try {
    existing = await sbFetch(`evaluaciones?ciclo_id=eq.${activeCycle.id}&evaluado_id=eq.${empId}&evaluador_id=eq.${loggedInEmployee.id}&tipo_evaluador=eq.supervisor&select=id,estado`);
  } catch (err) {
    console.warn('Could not check existing evaluation:', err);
  }
  if (existing && existing.length && existing[0].estado !== 'pendiente') {
    document.getElementById('app-content').innerHTML = `
      <div class="card">
        <div class="success-screen">
          <div class="icon">✅</div>
          <h2>Already Evaluated / Ya Evaluado</h2>
          <p>You've already submitted an evaluation for ${selectedEvaluado.nombre_completo} this cycle. / Ya enviaste una evaluación de ${selectedEvaluado.nombre_completo} este ciclo.</p>
        </div>
      </div>`;
    return;
  }

  previousEval = null;
  try {
    const prev = await sbFetch(`evaluaciones?evaluado_id=eq.${empId}&tipo_evaluador=eq.supervisor&estado=eq.completada&ciclo_id=neq.${activeCycle.id}&select=score_final,score_conductual,pct_promedio_cuota,feedback_narrativo,completada_at&order=completada_at.desc&limit=1`);
    if (prev && prev.length) previousEval = prev[0];
  } catch (err) { console.warn('Could not load previous evaluation:', err); }

  await loadMetricTemplate();
  renderQuotaScreen();
}

/* ════════ METRICS (configurable per manager) ════════ */
let metricRows = [];
let metricTemplateLoaded = false;
let previousEval = null;

async function loadMetricTemplate() {
  if (metricTemplateLoaded && metricRows.length) { metricRows = metricRows.map(r => ({ ...r, real: '' })); return; }
  let tpl = [];
  try {
    tpl = await sbFetch('rpc/metricas_plantilla_get', { method: 'POST', body: JSON.stringify({ p_evaluador_id: loggedInEmployee.id }) });
  } catch (err) { console.warn('Could not load metric template:', err); }
  metricRows = (tpl && tpl.length)
    ? tpl.map(t => ({ nombre: t.nombre, unidad: t.unidad || '', meta: '', real: '' }))
    : [{ nombre: 'Sales', unidad: '$', meta: '', real: '' }];
  metricTemplateLoaded = true;
}

function metricPct(r) {
  const meta = parseFloat(r.meta), real = parseFloat(r.real);
  if (!(meta > 0) || isNaN(real) || real < 0) return null;
  return Math.round((real / meta) * 1000) / 10;
}

function metricsAverage() {
  const pcts = metricRows.map(metricPct).filter(v => v !== null).map(v => Math.min(v, 150));
  return pcts.length ? Math.round((pcts.reduce((a, b) => a + b, 0) / pcts.length) * 10) / 10 : null;
}

function updateMetric(i, field, value) {
  metricRows[i][field] = value;
  const pct = metricPct(metricRows[i]);
  const el = document.getElementById('metric-pct-' + i);
  if (el) el.textContent = pct === null ? '—' : pct + '%';
  const avg = metricsAverage();
  const avgEl = document.getElementById('metric-avg');
  if (avgEl) avgEl.textContent = avg === null ? '—' : avg + '%';
}

function addMetricRow() { metricRows.push({ nombre: '', unidad: '', meta: '', real: '' }); renderQuotaScreen(); }
function removeMetricRow(i) { metricRows.splice(i, 1); if (!metricRows.length) metricRows.push({ nombre: '', unidad: '', meta: '', real: '' }); renderQuotaScreen(); }

function renderQuotaScreen() {
  const content = document.getElementById('app-content');
  const fld = 'padding:9px 10px;border:2px solid #e8e4dc;border-radius:8px;font-size:13px;width:100%;';
  const rowsHtml = metricRows.map((r, i) => `
    <div style="display:grid;grid-template-columns:1.6fr .7fr 1fr 1fr .8fr auto;gap:6px;align-items:center;margin-bottom:8px;">
      <input type="text" placeholder="Metric / Métrica" value="${(r.nombre || '').replace(/"/g, '&quot;')}" oninput="updateMetric(${i},'nombre',this.value)" style="${fld}">
      <input type="text" placeholder="Unit" value="${(r.unidad || '').replace(/"/g, '&quot;')}" oninput="updateMetric(${i},'unidad',this.value)" style="${fld}">
      <input type="number" min="0" step="any" placeholder="Goal / Meta" value="${r.meta}" oninput="updateMetric(${i},'meta',this.value)" style="${fld}">
      <input type="number" min="0" step="any" placeholder="Actual / Real" value="${r.real}" oninput="updateMetric(${i},'real',this.value)" style="${fld}">
      <strong id="metric-pct-${i}" style="color:var(--navy);font-size:13px;text-align:center;">${metricPct(r) === null ? '—' : metricPct(r) + '%'}</strong>
      <button class="btn" onclick="removeMetricRow(${i})" style="padding:4px 9px;background:transparent;color:var(--mgray);font-size:16px;" title="Remove">✕</button>
    </div>`).join('');

  const prevHtml = previousEval ? `
    <div style="background:#f4f1ea;border-left:4px solid var(--gold);padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:16px;">
      <strong>Previous evaluation / Evaluación anterior</strong> (${(previousEval.completada_at || '').slice(0, 10)})<br>
      Final score / Puntaje final: <strong>${previousEval.score_final ?? '—'}</strong>
      · Quota / Cuota: <strong>${previousEval.pct_promedio_cuota ?? '—'}%</strong>
      ${previousEval.feedback_narrativo ? `<br><em>"${previousEval.feedback_narrativo.replace(/</g, '&lt;')}"</em>` : ''}
    </div>` : '';

  content.innerHTML = `
    <div class="card">
      <h2>Performance Metrics / Métricas de Desempeño</h2>
      <div class="desc">Evaluating: <strong>${selectedEvaluado.nombre_completo}</strong> — ${activeCycle.nombre}<br>Enter this person's goals and actual results for the cycle. Add or remove metrics as needed. / Captura las metas y resultados reales de esta persona en el ciclo. Agrega o quita métricas según necesites.</div>
      ${prevHtml}
      <div style="display:grid;grid-template-columns:1.6fr .7fr 1fr 1fr .8fr auto;gap:6px;font-size:11px;font-weight:700;color:var(--mgray);margin-bottom:6px;">
        <span>METRIC</span><span>UNIT</span><span>GOAL</span><span>ACTUAL</span><span style="text-align:center;">% MET</span><span></span>
      </div>
      ${rowsHtml}
      <button class="btn" onclick="addMetricRow()" style="background:transparent;color:var(--navy);font-weight:600;text-decoration:underline;margin-bottom:10px;">+ Add metric / Agregar métrica</button>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #f0ece2;font-size:14px;">
        <span>Average attainment / Cumplimiento promedio</span><strong id="metric-avg" style="color:var(--navy);">${metricsAverage() === null ? '—' : metricsAverage() + '%'}</strong>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mgray);margin:8px 0 14px;"><input type="checkbox" id="metric-save-tpl" checked> Remember these metric names for my next evaluations / Recordar estos nombres para mis próximas evaluaciones</label>
      <div class="error-msg" id="quota-error">Add at least one metric with a goal greater than 0 and an actual value. / Agrega al menos una métrica con meta mayor a 0 y un valor real.</div>
      <button class="btn btn-primary" onclick="confirmQuota()">Continue / Continuar</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderSupervisorSearchScreen('')">← Back / Regresar</button>
    </div>`;
}

async function confirmQuota() {
  const valid = metricRows.filter(r => (r.nombre || '').trim() && metricPct(r) !== null);
  if (!valid.length) { document.getElementById('quota-error').classList.add('show'); return; }
  quotaData = { metrics: valid.map(r => ({ nombre: r.nombre.trim(), unidad: (r.unidad || '').trim(), meta: parseFloat(r.meta), real: parseFloat(r.real) })), pct_promedio: metricsAverage() };
  const saveTpl = document.getElementById('metric-save-tpl');
  if (saveTpl && saveTpl.checked && !isAdminPreview) {
    try {
      await sbFetch('rpc/metricas_plantilla_set', { method: 'POST', body: JSON.stringify({ p_evaluador_id: loggedInEmployee.id, p_items: quotaData.metrics.map((m, i) => ({ nombre: m.nombre, unidad: m.unidad, orden: i })) }) });
    } catch (err) { console.warn('Could not save metric template:', err); }
  }
  currentDimIdx = 0;
  responses = {};
  renderQuestionScreen();
}

/* ════════════════════════════════════════════════════════════
   RENDER — one dimension at a time, forced-choice BARS.
   Uses DIMENSIONS (1st person) for self, SUPERVISOR_DIMENSIONS
   (3rd person) for supervisor mode.
   ════════════════════════════════════════════════════════════ */
function currentDimSet() {
  return evalMode === 'supervisor' ? SUPERVISOR_DIMENSIONS : VALUES_QUESTIONS;
}

function renderQuestionScreen() {
  const content = document.getElementById('app-content');
  const dims = currentDimSet();
  const dim = dims[currentDimIdx];
  const pct = Math.round((currentDimIdx / dims.length) * 100);

  // Preview mode applies to BOTH self and supervisor flows for admins —
  // lets a Super Admin walk the entire module (including "evaluating"
  // a real person) without ever writing to that person's real record.
  const adminBanner = isAdminPreview
    ? `<div class="badge-admin">🔍 Admin Preview Mode — this run will NOT be saved to any employee's record. / Modo Vista Admin — esta sesión NO se guardará en el registro de ningún empleado.</div>`
    : '';

  const evaluandoBanner = evalMode === 'supervisor'
    ? `<div class="badge-admin" style="background:var(--ltblue);border-left-color:var(--navy);">Evaluating / Evaluando: <strong>${selectedEvaluado.nombre_completo}</strong></div>`
    : '';

  const optsHtml = evalMode === 'supervisor'
    ? dim.opts.map((opt, i) => {
        const selected = responses[dim.key] === (i + 1) ? 'selected' : '';
        return `
          <div class="bars-option ${selected}" onclick="selectOption('${dim.key}', ${i + 1})">
            <div class="num">${i + 1}</div>
            <div class="txt">${opt}</div>
          </div>`;
      }).join('')
    : dim.opts.map((opt, i) => {
        const selected = responses[dim.key] === i ? 'selected' : '';
        return `
          <div class="bars-option ${selected}" onclick="selectOption('${dim.key}', ${i})">
            <div class="num">${String.fromCharCode(65 + i)}</div>
            <div class="txt">${opt}</div>
          </div>`;
      }).join('');

  content.innerHTML = `
    ${adminBanner}
    ${evaluandoBanner}
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Question ${currentDimIdx + 1} of ${dims.length} / Pregunta ${currentDimIdx + 1} de ${dims.length}</div>
    <div class="card">
      <div class="dim-title"><span class="dim-num">${currentDimIdx + 1}</span>${dim.title}</div>
      <div class="dim-q">${dim.q}</div>
      ${optsHtml}
      <div class="error-msg" id="dim-error">Please select an option before continuing. / Por favor selecciona una opción antes de continuar.</div>
      <button class="btn btn-primary" id="btn-next" style="margin-top:18px" onclick="nextDimension()">
        ${currentDimIdx === dims.length - 1 ? 'Review & Submit / Revisar y Enviar' : 'Next / Siguiente →'}
      </button>
    </div>`;
}

function selectOption(key, value) {
  responses[key] = value;
  renderQuestionScreen();
}

function nextDimension() {
  const dims = currentDimSet();
  const dim = dims[currentDimIdx];
  if (responses[dim.key] === undefined) {
    document.getElementById('dim-error').classList.add('show');
    return;
  }
  if (currentDimIdx < dims.length - 1) {
    currentDimIdx++;
    renderQuestionScreen();
  } else {
    renderReviewScreen();
  }
}

/* ════════════════════════════════════════════════════════════
   REVIEW & SUBMIT
   ════════════════════════════════════════════════════════════ */
function renderReviewScreen() {
  const content = document.getElementById('app-content');
  const dims = currentDimSet();
  const rows = dims.map(dim => {
    const raw = responses[dim.key];
    const display = evalMode === 'supervisor' ? raw + '/5' : String.fromCharCode(65 + raw);
    return `
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13px;">
      <span style="color:var(--dkgray)">${dim.title}</span>
      <strong style="color:var(--navy)">${display}</strong>
    </div>`;
  }).join('');

  const quotaRow = evalMode === 'supervisor'
    ? `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13px;">
        <span style="color:var(--dkgray)">Quota Performance / Desempeño de Cuota</span>
        <strong style="color:var(--navy)">${quotaData.pct_promedio}% avg (${quotaData.metrics.length} metric${quotaData.metrics.length === 1 ? '' : 's'})</strong>
      </div>`
    : '';

  const evaluandoLine = evalMode === 'supervisor'
    ? `<div class="desc">Evaluating: <strong>${selectedEvaluado.nombre_completo}</strong></div>`
    : '';

  const submitLabel = evalMode === 'supervisor' ? 'Submit Evaluation / Enviar Evaluación' : 'Submit Self-Assessment / Enviar Autoevaluación';

  content.innerHTML = `
    <div class="card">
      <h2>Review Your Answers / Revisa Tus Respuestas</h2>
      ${evaluandoLine}
      <div class="desc">Once submitted, you won't be able to change these answers. / Una vez enviado, no podrás cambiar estas respuestas.</div>
      ${quotaRow}
      ${rows}
      ${evalMode === 'supervisor' ? `<label style="display:block;font-size:13px;font-weight:600;color:var(--navy);margin:16px 0 6px;">Comments for this person (optional) / Comentarios para esta persona (opcional)</label>
      <textarea id="eval-narrative" rows="3" maxlength="1000" placeholder="What is going well? What should improve by next cycle? / ¿Qué va bien? ¿Qué debe mejorar para el próximo ciclo?" style="width:100%;padding:10px 12px;border:2px solid #e8e4dc;border-radius:8px;font-size:13px;font-family:inherit;"></textarea>` : ''}
      <div class="error-msg" id="submit-error"></div>
      <button class="btn btn-primary" id="btn-submit" style="margin-top:20px" onclick="submitEvaluation()">${submitLabel}</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="currentDimIdx=currentDimSet().length-1;renderQuestionScreen();">← Back to edit / Regresar a editar</button>
    </div>`;
}

async function submitEvaluation() {
  const btn = document.getElementById('btn-submit');
  const errEl = document.getElementById('submit-error');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting... / Enviando...';

  // Preview-mode skip-save now applies to BOTH self and supervisor flows —
  // a Super Admin can fully test evaluating a real person without it
  // ever hitting that person's actual record.
  if (isAdminPreview) {
    setTimeout(() => {
      document.getElementById('app-content').innerHTML = `
        <div class="card">
          <div class="success-screen">
            <div class="icon">🔍</div>
            <h2>Admin Preview Complete / Vista Admin Completada</h2>
            <p>Nothing was saved — this was a preview run only. / Nada se guardó — esta fue solo una corrida de vista previa.</p>
          </div>
        </div>`;
    }, 500);
    return;
  }

  const dims = currentDimSet();
  const isSupervisor = evalMode === 'supervisor';

  try {
    const evalPayload = {
      ciclo_id: activeCycle.id,
      evaluado_id: isSupervisor ? selectedEvaluado.id : loggedInEmployee.id,
      evaluador_id: loggedInEmployee.id,
      tipo_evaluador: isSupervisor ? 'supervisor' : 'self',
      track: 'sales',
      estado: 'completada',
      completada_at: new Date().toISOString()
    };
    if (isSupervisor) {
      const scores = dims.map(d => responses[d.key]);
      const conductual = Math.round(((scores.reduce((a, b) => a + b, 0) / scores.length) - 1) / 4 * 100);
      const cuota = Math.round(Math.min(quotaData.pct_promedio, 100));
      evalPayload.pct_promedio_cuota = quotaData.pct_promedio;
      evalPayload.score_conductual = conductual;
      evalPayload.score_cuota = cuota;
      evalPayload.score_final = Math.round(0.5 * cuota + 0.5 * conductual);
      const narr = (document.getElementById('eval-narrative') || {}).value;
      if (narr && narr.trim()) evalPayload.feedback_narrativo = narr.trim();
    } else {
      // Self score = % of forced-choice questions answered with the
      // higher-performance option (B). Same formula as the original design.
      // Self score = average of chosen option index / (options - 1), scaled to 100.
      // e.g. picking the top option (index 3 of 4) on everything = 100.
      const dimsList = currentDimSet();
      const maxIdx = dimsList[0].opts.length - 1;
      const sum = dimsList.reduce((s, d) => s + (responses[d.key] || 0), 0);
      const selfScore = Math.round((sum / (dimsList.length * maxIdx)) * 100);
      evalPayload.score_conductual = selfScore;
      evalPayload.score_final = selfScore;
    }

    const evalRows = await sbFetch('evaluaciones', { method: 'POST', body: JSON.stringify(evalPayload) });
    const evaluacionId = evalRows[0].id;

    const respuestaRows = dims.map(dim => ({
      evaluacion_id: evaluacionId,
      dimension: dim.key,
      pregunta_key: dim.key,
      pregunta_texto: dim.q,
      // Supervisor mode: 1-5 BARS score. Self mode: multiple-choice index
      // (0-3), both numeric so they fit the same column.
      respuesta_score: responses[dim.key]
    }));
    await sbFetch('evaluacion_respuestas', { method: 'POST', body: JSON.stringify(respuestaRows) });
    if (isSupervisor) {
      await sbFetch('rpc/metricas_guardar', { method: 'POST', body: JSON.stringify({ p_evaluacion_id: evaluacionId, p_evaluador_id: loggedInEmployee.id, p_items: quotaData.metrics }) });
    }

    const successMsg = isSupervisor
      ? `<h2>Evaluation Submitted! / ¡Evaluación Enviada!</h2><p>Your evaluation of ${selectedEvaluado.nombre_completo} for ${activeCycle.nombre} has been saved. / Tu evaluación de ${selectedEvaluado.nombre_completo} para ${activeCycle.nombre} se guardó.</p>${(previousEval && previousEval.score_final != null && evalPayload.score_final != null) ? `<p style="margin-top:10px;">Change vs previous cycle / Cambio vs ciclo anterior: <strong>${evalPayload.score_final - previousEval.score_final >= 0 ? '+' : ''}${Math.round(evalPayload.score_final - previousEval.score_final)}</strong> pts (${Math.round(previousEval.score_final)} → ${evalPayload.score_final})</p>` : ''}`
      : `<h2>Self-Assessment Submitted! / ¡Autoevaluación Enviada!</h2><p>Thank you, ${loggedInEmployee.nombre_completo}. Your supervisor will review your evaluation and follow up with feedback during ${activeCycle.nombre}. / Gracias, ${loggedInEmployee.nombre_completo}. Tu supervisor revisará tu evaluación durante ${activeCycle.nombre}.</p>`;

    document.getElementById('app-content').innerHTML = `
      <div class="card">
        <div class="success-screen">
          <div class="icon">✅</div>
          ${successMsg}
          ${isSupervisor ? `<button class="btn btn-primary" style="margin-top:20px;max-width:280px;" onclick="startSupervisorSearch()">Evaluate Someone Else / Evaluar a Alguien Más</button>` : ''}
        </div>
      </div>`;

  } catch (err) {
    console.error('Submit failed:', err);
    errEl.textContent = 'Something went wrong submitting your evaluation. Please try again. / Algo salió mal al enviar tu evaluación. Intenta de nuevo.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = isSupervisor ? 'Submit Evaluation / Enviar Evaluación' : 'Submit Self-Assessment / Enviar Autoevaluación';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
