async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': options.method === 'POST' ? 'return=representation' : undefined,
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Supabase error ${res.status}: ${errText}`);
  }
  return res.status === 204 ? null : res.json();
}

/* ════════════════════════════════════════════════════════════
   INIT — same real pattern as Tier1: ?emp= param, es_admin check
   ════════════════════════════════════════════════════════════ */
async function init() {
  const params = new URLSearchParams(window.location.search);
  const empId = params.get('emp');
  const content = document.getElementById('app-content');

  if (!empId) {
    content.innerHTML = `<div class="card"><div class="no-cycle">No employee context found. Please return to the hub and try again. / No se encontró contexto de empleado. Regresa al hub e intenta de nuevo.</div></div>`;
    return;
  }

  try {
    const rows = await sbFetch(`empleados?id=eq.${empId}&select=id,nombre_completo,employee_id,tienda,es_admin`);
    if (!rows || rows.length === 0) {
      content.innerHTML = `<div class="card"><div class="no-cycle">Employee not found. / Empleado no encontrado.</div></div>`;
      return;
    }
    loggedInEmployee = rows[0];
    isAdminPreview = !!loggedInEmployee.es_admin;
  } catch (err) {
    console.error('Could not load employee:', err);
    content.innerHTML = `<div class="card"><div class="no-cycle">Connection error loading your profile. / Error de conexión al cargar tu perfil.</div></div>`;
    return;
  }

  try {
    const cycles = await sbFetch(`evaluacion_ciclos?activo=eq.true&select=id,nombre,tipo,fecha_inicio,fecha_cierre&order=fecha_inicio.desc&limit=1`);
    activeCycle = (cycles && cycles.length) ? cycles[0] : null;
  } catch (err) {
    console.warn('Could not load evaluation cycle (table may not exist yet):', err);
    activeCycle = null;
  }

  if (!activeCycle) {
    content.innerHTML = `
      <div class="card">
        <div class="no-cycle">
          There is no active evaluation cycle right now. Check back when your manager opens the next cycle. / No hay un ciclo de evaluación activo en este momento. Vuelve a revisar cuando tu gerente abra el siguiente ciclo.
        </div>
      </div>`;
    document.getElementById('cycle-label').textContent = 'No active cycle / Sin ciclo activo';
    return;
  }

  document.getElementById('cycle-label').textContent = `${activeCycle.nombre} — ${loggedInEmployee.nombre_completo}`;

  renderModePicker();
}

  const content = document.getElementById('app-content');
  const canSupervise = !!loggedInEmployee.es_admin;

  content.innerHTML = `

      <h2>What would you like to do? / ¿Qué te gustaría hacer?</h2>
      <div class="desc">${activeCycle.nombre}</div>
      <div class="bars-option" onclick="startSelfAssessment()" style="margin-top:8px;">
        <div class="num">📝</div>
        <div class="txt"><strong>My Self-Assessment / Mi Autoevaluación</strong><br>Complete your own self-assessment for this cycle. / Completa tu propia autoevaluación de este ciclo.</div>
      </div>
      ${canSupervise ? `
      <div class="bars-option" onclick="startSupervisorSearch()">
        <div class="num">👥</div>
        <div class="txt"><strong>Evaluate a Team Member / Evaluar a un Miembro del Equipo</strong><br>Search for and evaluate someone on your team. / Busca y evalúa a alguien de tu equipo.</div>
      </div>` : ''}

}

  currentDimIdx = 0;
  responses = {};
  const content = document.getElementById('app-content');

  let existing = [];
  try {
    existing = await sbFetch(`evaluaciones?ciclo_id=eq.${activeCycle.id}&evaluado_id=eq.${loggedInEmployee.id}&evaluador_id=eq.${loggedInEmployee.id}&tipo_evaluador=eq.self&select=id,estado`);
  } catch (err) {
    console.warn('Could not check existing evaluation:', err);
  }

  if (existing && existing.length && existing[0].estado !== 'pendiente' && !isAdminPreview) {
    content.innerHTML = `
      <div class="card">
        <div class="success-screen">
          <div class="icon">✅</div>
          <h2>Self-Assessment Already Submitted / Autoevaluación Ya Enviada</h2>
          <p>You've already completed your self-assessment for ${activeCycle.nombre}. / Ya completaste tu autoevaluación para ${activeCycle.nombre}.</p>
        </div>
      </div>`;
    return;
  }
  renderQuestionScreen();
}

/* ════════════════════════════════════════════════════════════
   SUPERVISOR MODE — search real registered employees by name
   (same empleados table that drives certifications/badges), pick
   one, enter their quota result, then BARS in third person.
   Always saves for real — no preview/skip-save behavior here,
   this is real management work product.
   ════════════════════════════════════════════════════════════ */
let allEmployeesForSearch = null;

async function startSupervisorSearch() {
  evalMode = 'supervisor';
  selectedEvaluado = null;
  currentDimIdx = 0;
  responses = {};
  quotaData = { periodos_meta: null, periodos_total: null };

  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="card"><p style="text-align:center;color:var(--mgray);padding:20px 0;">Loading team roster... / Cargando lista de empleados...</p></div>`;

  if (!allEmployeesForSearch) {
    try {
      allEmployeesForSearch = await sbFetch(`empleados?select=id,nombre_completo,employee_id,tienda,departamento&order=nombre_completo.asc`);
    } catch (err) {
      content.innerHTML = `<div class="card"><div class="no-cycle">Could not load the employee roster. / No se pudo cargar la lista de empleados.</div></div>`;
      return;
    }
  }
  renderSupervisorSearchScreen('');
}

function renderSupervisorSearchScreen(query) {
  const content = document.getElementById('app-content');
  const q = (query || '').trim().toLowerCase();
  const myStore = loggedInEmployee.tienda;

  // Soft filter: same store first, then others — never blocks anyone
  const pool = (allEmployeesForSearch || [])
    .filter(e => e.id !== loggedInEmployee.id)
    .filter(e => !q || (e.nombre_completo || '').toLowerCase().includes(q));

  const sameStore = pool.filter(e => myStore && e.tienda === myStore);
  const otherStore = pool.filter(e => !myStore || e.tienda !== myStore);

  function empRow(e) {
    const storeTag = e.tienda && e.tienda !== myStore
      ? ` <span style="color:var(--mgray);font-size:11px;font-weight:400;">(${e.tienda})</span>` : '';
    return `<div class="bars-option" onclick="selectEvaluado('${e.id}')">
      <div class="num">👤</div>
      <div class="txt"><strong>${e.nombre_completo}</strong>${storeTag}</div>
    </div>`;
  }

  let resultsHtml = '';
  if (!pool.length) {
    resultsHtml = `<p style="color:var(--mgray);font-size:13px;padding:10px 0;">${q ? 'No matches found. / No se encontraron coincidencias.' : 'Start typing a name above. / Empieza a escribir un nombre arriba.'}</p>`;
  } else {
    if (sameStore.length) {
      resultsHtml += myStore ? `<div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;">📍 ${myStore}</div>` : '';
      resultsHtml += sameStore.slice(0, 10).map(empRow).join('');
    }
    if (otherStore.length && (!sameStore.length || q)) {
      resultsHtml += `<div style="font-size:11px;font-weight:700;color:var(--mgray);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.5px;">🏢 Other Locations / Otras Tiendas</div>`;
      resultsHtml += otherStore.slice(0, 8).map(empRow).join('');
    }
  }

  content.innerHTML = `
    <div class="card">
      <h2>Who are you evaluating? / ¿A quién vas a evaluar?</h2>
      <div class="desc">Your store's team appears first. Search by name to find anyone. / Tu equipo de tienda aparece primero. Busca por nombre para encontrar a cualquier persona.</div>
      <input type="text" class="field-input" placeholder="Type a name... / Escribe un nombre..." value="${query || ''}" oninput="renderSupervisorSearchScreen(this.value)" style="width:100%;padding:12px 14px;border:2px solid #e8e4dc;border-radius:10px;font-size:14px;margin-bottom:14px;" autofocus>
      ${resultsHtml}
      <button class="btn" style="margin-top:14px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderModePicker()">← Back / Regresar</button>
    </div>`;
}

async function selectEvaluado(empId) {
  selectedEvaluado = (allEmployeesForSearch || []).find(e => e.id === empId);
  if (!selectedEvaluado) return;

  // Check for an existing supervisor evaluation of this person, this cycle, by this evaluator
  let existing = [];
  try {
    existing = await sbFetch(`evaluaciones?ciclo_id=eq.${activeCycle.id}&evaluado_id=eq.${empId}&evaluador_id=eq.${loggedInEmployee.id}&tipo_evaluador=eq.supervisor&select=id,estado`);
  } catch (err) {
    console.warn('Could not check existing evaluation:', err);
  }
  if (existing && existing.length && existing[0].estado !== 'pendiente') {
    document.getElementById('app-content').innerHTML = `
      <div class="card">
        <div class="success-screen">
          <div class="icon">✅</div>
          <h2>Already Evaluated / Ya Evaluado</h2>
          <p>You've already submitted an evaluation for ${selectedEvaluado.nombre_completo} this cycle. / Ya enviaste una evaluación de ${selectedEvaluado.nombre_completo} este ciclo.</p>
        </div>
      </div>`;
    return;
  }

  renderQuotaScreen();
}

function renderQuotaScreen() {
  const content = document.getElementById('app-content');
  content.innerHTML = `
    <div class="card">
      <h2>Quota Performance / Desempeño de Cuota</h2>
      <div class="desc">Evaluating: <strong>${selectedEvaluado.nombre_completo}</strong> — ${activeCycle.nombre}<br>How many periods (months) in this cycle did they meet their sales quota? / ¿En cuántos periodos (meses) de este ciclo cumplieron su cuota de ventas?</div>
      <label class="field-label" style="display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--navy);">Periods quota was MET / Periodos con cuota CUMPLIDA</label>
      <input type="number" min="0" class="field-input" id="quota-met" placeholder="e.g. 4 / ej. 4" style="width:100%;padding:12px 14px;border:2px solid #e8e4dc;border-radius:10px;font-size:14px;margin-bottom:14px;">
      <label class="field-label" style="display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--navy);">Total periods in this cycle / Total de periodos en este ciclo</label>
      <input type="number" min="1" class="field-input" id="quota-total" placeholder="e.g. 6 / ej. 6" style="width:100%;padding:12px 14px;border:2px solid #e8e4dc;border-radius:10px;font-size:14px;margin-bottom:14px;">
      <div class="error-msg" id="quota-error">Please fill in both fields. / Por favor llena ambos campos.</div>
      <button class="btn btn-primary" onclick="confirmQuota()">Continue / Continuar</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderSupervisorSearchScreen('')">← Back / Regresar</button>
    </div>`;
}

function confirmQuota() {
  const met = parseInt(document.getElementById('quota-met').value, 10);
  const total = parseInt(document.getElementById('quota-total').value, 10);
  if (isNaN(met) || isNaN(total) || total < 1 || met < 0 || met > total) {
    document.getElementById('quota-error').classList.add('show');
    return;
  }
  quotaData = { periodos_meta: met, periodos_total: total };
  currentDimIdx = 0;
  responses = {};
  renderQuestionScreen();
}

/* ════════════════════════════════════════════════════════════
   RENDER — one dimension at a time, forced-choice BARS.
   Uses DIMENSIONS (1st person) for self, SUPERVISOR_DIMENSIONS
   (3rd person) for supervisor mode.
   ════════════════════════════════════════════════════════════ */
function currentDimSet() {
  return evalMode === 'supervisor' ? SUPERVISOR_DIMENSIONS : DIMENSIONS;
}

function renderQuestionScreen() {
  const content = document.getElementById('app-content');
  const dims = currentDimSet();
  const dim = dims[currentDimIdx];
  const pct = Math.round((currentDimIdx / dims.length) * 100);

  // Preview banner only applies to self-assessment — supervisor evaluations
  // of a real team member always save, there's no "preview" version of that.
  const adminBanner = (isAdminPreview && evalMode === 'self')
    ? `<div class="badge-admin">🔍 Admin Preview Mode — this run will NOT be saved to any employee's record. / Modo Vista Admin — esta sesión NO se guardará en el registro de ningún empleado.</div>`
    : '';

  const evaluandoBanner = evalMode === 'supervisor'
    ? `<div class="badge-admin" style="background:var(--ltblue);border-left-color:var(--navy);">Evaluating / Evaluando: <strong>${selectedEvaluado.nombre_completo}</strong></div>`
    : '';

  const optsHtml = dim.opts.map((opt, i) => {
    const selected = responses[dim.key] === (i + 1) ? 'selected' : '';
    return `
      <div class="bars-option ${selected}" onclick="selectOption('${dim.key}', ${i + 1})">
        <div class="num">${i + 1}</div>
        <div class="txt">${opt}</div>
      </div>`;
  }).join('');

  content.innerHTML = `
    ${adminBanner}
    ${evaluandoBanner}
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Dimension ${currentDimIdx + 1} of ${dims.length} / Dimensión ${currentDimIdx + 1} de ${dims.length}</div>
    <div class="card">
      <div class="dim-title"><span class="dim-num">${currentDimIdx + 1}</span>${dim.title}</div>
      <div class="dim-q">${dim.q}</div>
      ${optsHtml}
      <div class="error-msg" id="dim-error">Please select an option before continuing. / Por favor selecciona una opción antes de continuar.</div>
      <button class="btn btn-primary" id="btn-next" style="margin-top:18px" onclick="nextDimension()">
        ${currentDimIdx === dims.length - 1 ? 'Review & Submit / Revisar y Enviar' : 'Next / Siguiente →'}
      </button>
    </div>`;
}

function selectOption(key, value) {
  responses[key] = value;
  renderQuestionScreen();
}

function nextDimension() {
  const dims = currentDimSet();
  const dim = dims[currentDimIdx];
  if (!responses[dim.key]) {
    document.getElementById('dim-error').classList.add('show');
    return;
  }
  if (currentDimIdx < dims.length - 1) {
    currentDimIdx++;
    renderQuestionScreen();
  } else {
    renderReviewScreen();
  }
}

/* ════════════════════════════════════════════════════════════
   REVIEW & SUBMIT
   ════════════════════════════════════════════════════════════ */
function renderReviewScreen() {
  const content = document.getElementById('app-content');
  const dims = currentDimSet();
  const rows = dims.map(dim => `
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13px;">
      <span style="color:var(--dkgray)">${dim.title}</span>
      <strong style="color:var(--navy)">${responses[dim.key]}/5</strong>
    </div>`).join('');

  const quotaRow = evalMode === 'supervisor'
    ? `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13px;">
        <span style="color:var(--dkgray)">Quota Performance / Desempeño de Cuota</span>
        <strong style="color:var(--navy)">${quotaData.periodos_meta}/${quotaData.periodos_total} periods met</strong>
      </div>`
    : '';

  const evaluandoLine = evalMode === 'supervisor'
    ? `<div class="desc">Evaluating: <strong>${selectedEvaluado.nombre_completo}</strong></div>`
    : '';

  const submitLabel = evalMode === 'supervisor' ? 'Submit Evaluation / Enviar Evaluación' : 'Submit Self-Assessment / Enviar Autoevaluación';

  content.innerHTML = `
    <div class="card">
      <h2>Review Your Answers / Revisa Tus Respuestas</h2>
      ${evaluandoLine}
      <div class="desc">Once submitted, you won't be able to change these answers. / Una vez enviado, no podrás cambiar estas respuestas.</div>
      ${quotaRow}
      ${rows}
      <div class="error-msg" id="submit-error"></div>
      <button class="btn btn-primary" id="btn-submit" style="margin-top:20px" onclick="submitEvaluation()">${submitLabel}</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="currentDimIdx=currentDimSet().length-1;renderQuestionScreen();">← Back to edit / Regresar a editar</button>
    </div>`;
}

async function submitEvaluation() {
  const btn = document.getElementById('btn-submit');
  const errEl = document.getElementById('submit-error');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting... / Enviando...';

  // Preview-mode skip-save applies ONLY to self-assessment. Supervisor
  // evaluations of a real team member always persist for real.
  if (isAdminPreview && evalMode === 'self') {
    setTimeout(() => {
      document.getElementById('app-content').innerHTML = `
        <div class="card">
          <div class="success-screen">
            <div class="icon">🔍</div>
            <h2>Admin Preview Complete / Vista Admin Completada</h2>
            <p>Nothing was saved — this was a preview run only. / Nada se guardó — esta fue solo una corrida de vista previa.</p>
          </div>
        </div>`;
    }, 500);
    return;
  }

  const dims = currentDimSet();
  const isSupervisor = evalMode === 'supervisor';

  try {
    const evalPayload = {
      ciclo_id: activeCycle.id,
      evaluado_id: isSupervisor ? selectedEvaluado.id : loggedInEmployee.id,
      evaluador_id: loggedInEmployee.id,
      tipo_evaluador: isSupervisor ? 'supervisor' : 'self',
      track: 'sales',
      estado: 'completada',
      completada_at: new Date().toISOString()
    };
    if (isSupervisor) {
      evalPayload.periodos_meta = quotaData.periodos_meta;
      evalPayload.periodos_total = quotaData.periodos_total;
      evalPayload.pct_promedio_cuota = Math.round((quotaData.periodos_meta / quotaData.periodos_total) * 100);
    }

    const evalRows = await sbFetch('evaluaciones', { method: 'POST', body: JSON.stringify(evalPayload) });
    const evaluacionId = evalRows[0].id;

    const respuestaRows = dims.map(dim => ({
      evaluacion_id: evaluacionId,
      dimension: dim.key,
      pregunta_key: dim.key,
      pregunta_texto: dim.q,
      respuesta_score: responses[dim.key]
    }));
    await sbFetch('evaluacion_respuestas', { method: 'POST', body: JSON.stringify(respuestaRows) });

    const successMsg = isSupervisor
      ? `<h2>Evaluation Submitted! / ¡Evaluación Enviada!</h2><p>Your evaluation of ${selectedEvaluado.nombre_completo} for ${activeCycle.nombre} has been saved. / Tu evaluación de ${selectedEvaluado.nombre_completo} para ${activeCycle.nombre} se guardó.</p>`
      : `<h2>Self-Assessment Submitted! / ¡Autoevaluación Enviada!</h2><p>Thank you, ${loggedInEmployee.nombre_completo}. Your supervisor will review your evaluation and follow up with feedback during ${activeCycle.nombre}. / Gracias, ${loggedInEmployee.nombre_completo}. Tu supervisor revisará tu evaluación durante ${activeCycle.nombre}.</p>`;

    document.getElementById('app-content').innerHTML = `
      <div class="card">
        <div class="success-screen">
          <div class="icon">✅</div>
          ${successMsg}
          ${isSupervisor ? `<button class="btn btn-primary" style="margin-top:20px;max-width:280px;" onclick="startSupervisorSearch()">Evaluate Someone Else / Evaluar a Alguien Más</button>` : ''}
        </div>
      </div>`;

  } catch (err) {
    console.error('Submit failed:', err);
    errEl.textContent = 'Something went wrong submitting your evaluation. Please try again. / Algo salió mal al enviar tu evaluación. Intenta de nuevo.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = isSupervisor ? 'Submit Evaluation / Enviar Evaluación' : 'Submit Self-Assessment / Enviar Autoevaluación';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
