async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': options.method === 'POST' ? 'return=representation' : undefined,
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Supabase error ${res.status}: ${errText}`);
  }
  return res.status === 204 ? null : res.json();
}

/* ════════════════════════════════════════════════════════════
   INIT — same real pattern as Tier1: ?emp= param, es_admin check
   ════════════════════════════════════════════════════════════ */
async function init() {
  const params = new URLSearchParams(window.location.search);
  const empId = params.get('emp');
  const content = document.getElementById('app-content');

  if (!empId) {
    content.innerHTML = `<div class="card"><div class="no-cycle">No employee context found. Please return to the hub and try again. / No se encontró contexto de empleado. Regresa al hub e intenta de nuevo.</div></div>`;
    return;
  }

  try {
    const rows = await sbFetch(`empleados?id=eq.${empId}&select=id,nombre_completo,employee_id,tienda,es_admin,rol`);
    if (!rows || rows.length === 0) {
      content.innerHTML = `<div class="card"><div class="no-cycle">Employee not found. / Empleado no encontrado.</div></div>`;
      return;
    }
    loggedInEmployee = rows[0];
    isAdminPreview = false; // admins/managers are real evaluators; everything saves
  } catch (err) {
    console.error('Could not load employee:', err);
    content.innerHTML = `<div class="card"><div class="no-cycle">Connection error loading your profile. / Error de conexión al cargar tu perfil.</div></div>`;
    return;
  }

  try {
    const cycles = await sbFetch(`evaluacion_ciclos?activo=eq.true&select=id,nombre,tipo,fecha_inicio,fecha_cierre&order=fecha_inicio.desc&limit=1`);
    activeCycle = (cycles && cycles.length) ? cycles[0] : null;
  } catch (err) {
    console.warn('Could not load evaluation cycle (table may not exist yet):', err);
    activeCycle = null;
  }

  if (!activeCycle) {
    content.innerHTML = `
      <div class="card">
        <div class="no-cycle">
          There is no active evaluation cycle right now. Check back when your manager opens the next cycle. / No hay un ciclo de evaluación activo en este momento. Vuelve a revisar cuando tu gerente abra el siguiente ciclo.
        </div>
      </div>`;
    document.getElementById('cycle-label').textContent = 'No active cycle / Sin ciclo activo';
    return;
  }

  document.getElementById('cycle-label').textContent = `${activeCycle.nombre} — ${loggedInEmployee.nombre_completo}`;

  renderModePicker();
}

  let prog = null;
  try { prog = await sbFetch('rpc/evaluacion_mi_progreso', { method: 'POST', body: JSON.stringify({ p_empleado_id: loggedInEmployee.id }) }); } catch (err) { console.warn('progress', err); }
  content.innerHTML = renderMyProgress(prog) + `
    <div class="card">
      <h2>What would you like to do? / ¿Qué te gustaría hacer?</h2>

      </div>

      <div class="bars-option" onclick="startManagerFeedback()">

      </div>` : ''}

      <div class="bars-option" onclick="startTeamDashboard()">

        <div class="txt"><strong>My Team Dashboard / Panel de Mi Equipo</strong><br>Progress, results and your team's KPIs. / Avance, resultados y los KPIs de tu equipo.</div>
      </div>
      <div class="bars-option" onclick="startSupervisorSearch()">
        <div class="num">👥</div>
        <div class="txt"><strong>Evaluate My Team / Evaluar a Mi Equipo</strong><br>Evaluate the people who report to you. / Evalúa a las personas que te reportan.</div>

let TD = { prog: null, kpis: null, custom: [], tab: 'progress' };
const TD_ROLE = { vendedor: 'Sellers / Vendedores', manager: 'Managers / Gerentes', director: 'Directors / Directores', staff: 'Staff / Personal' };
const tdEsc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function tdBand(f) { if (f === null || f === undefined) return null; f = Number(f); return f >= 90 ? ['Excellent', '#27AE60'] : f >= 80 ? ['Good', '#27AE60'] : f >= 70 ? ['Meets (approved)', '#B8860B'] : f >= 60 ? ['Needs improvement', '#C0392B'] : ['Critical', '#C0392B']; }
function tdStatus(p) {
  if (!p.en_ciclo) return ['Not in cycle', '#777'];
  if (p.no_elegible) return ['N/A – not eligible', '#777'];
  if (!p.esperadas) return ['No evaluator', '#777'];
  if (p.hechas >= p.esperadas) return ['Completed', '#27AE60'];
  if (p.hechas > 0) return ['In progress', '#B8860B'];
  return p.registrado ? ['Not started', '#C0392B'] : ['Awaiting sign-up', '#777'];
}
async function startTeamDashboard(tab) {
  TD.tab = tab || TD.tab || 'progress';
  const content = document.getElementById('app-content');
  content.innerHTML = '<div class="card"><h2>My Team Dashboard / Panel de Mi Equipo</h2><div class="desc">Loading…</div></div>';
  try {
    TD.prog = await sbFetch('rpc/evaluacion_mi_equipo', { method: 'POST', body: JSON.stringify({ p_empleado_id: loggedInEmployee.id }) });
    TD.kpis = await sbFetch('rpc/evaluacion_kpis_equipo_get', { method: 'POST', body: JSON.stringify({ p_manager_id: loggedInEmployee.id }) });
    TD.custom = ((TD.kpis && TD.kpis.propios) || []).map(k => ({ rol: k.rol_evaluado, nombre: k.nombre, unidad: k.unidad || '', meta: k.meta_default ?? '' }));
  } catch (err) { content.innerHTML = `<div class="card"><h2>My Team Dashboard</h2><div class="desc">Could not load: ${tdEsc(err.message)}</div><button class="btn" onclick="renderModePicker()">← Back</button></div>`; return; }
  renderTeamDashboard();
}
function tdSetTab(t) { TD.tab = t; renderTeamDashboard(); }
function renderTeamDashboard() {
  const content = document.getElementById('app-content');
  const P = TD.prog;
  if (!P || P.error) { content.innerHTML = '<div class="card"><h2>My Team Dashboard</h2><div class="desc">You have no team members assigned.</div><button class="btn" onclick="renderModePicker()">← Back</button></div>'; return; }
  const tabBtn = (k, l) => `<button class="btn" onclick="tdSetTab('${k}')" style="padding:7px 14px;${TD.tab === k ? 'background:var(--navy);color:#fff;' : 'background:#eee;color:var(--navy);'}">${l}</button>`;
  content.innerHTML = `<div class="card">
    <h2>My Team Dashboard / Panel de Mi Equipo</h2>
    <div class="desc">${tdEsc(P.ciclo)}</div>
    <div style="display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap">${tabBtn('progress', 'Progress / Avance')}${tabBtn('kpis', 'Team KPIs / KPIs del equipo')}</div>
    <div id="td-body">${TD.tab === 'progress' ? tdProgressHtml() : tdKpisHtml()}</div>
    <button class="btn" style="margin-top:14px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderModePicker()">← Back / Regresar</button>
  </div>`;
}
function tdProgressHtml() {
  const P = TD.prog, d = P.dias_restantes, over = d < 0, col = over ? '#C0392B' : d <= 7 ? '#B8860B' : '#27AE60';
  const fmt = x => new Date(x + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const act = P.personas.filter(p => p.en_ciclo && !p.no_elegible);
  const cnt = k => act.filter(p => tdStatus(p)[0] === k).length;
  const card = (t, v, c) => `<div style="flex:1;min-width:90px;background:#f7f7f7;border-radius:8px;padding:8px 10px"><div style="font-size:10px;color:#777;text-transform:uppercase">${t}</div><div style="font-size:20px;font-weight:800;color:${c || 'inherit'}">${v}</div></div>`;
  const rows = P.personas.map(p => { const st = tdStatus(p), b = p.hechas ? tdBand(p.final) : null, pct = p.esperadas ? Math.round(p.hechas / p.esperadas * 100) : 0;
    return `<tr style="border-top:1px solid #eee"><td style="padding:7px 6px"><strong>${tdEsc(p.nombre)}</strong><div style="font-size:11px;color:#777">${tdEsc(p.puesto)}</div></td>
      <td style="min-width:90px"><div style="background:#eee;border-radius:6px;height:7px;overflow:hidden"><div style="width:${pct}%;height:7px;background:#27AE60"></div></div><div style="font-size:11px;color:#777">${p.hechas}/${p.esperadas}</div></td>
      <td style="color:${st[1]};font-weight:700;font-size:12px">${st[0]}</td>
      <td>${p.hechas && p.final != null ? '<strong>' + Number(p.final).toFixed(0) + '</strong>' : '—'}</td>
      <td style="font-size:12px;color:${b ? b[1] : '#777'};font-weight:700">${b ? b[0] + (st[0] !== 'Completed' ? ' (provisional)' : '') : ''}</td></tr>`; }).join('');
  return `<div style="border-left:5px solid ${col};background:#fff;padding:8px 12px;margin-bottom:10px"><strong>${fmt(P.inicio)} → ${fmt(P.cierre)}</strong> · <span style="color:${col};font-weight:700">${over ? 'Overdue by ' + (-d) + ' day(s)' : d + ' day(s) left / ' + d + ' día(s) restantes'}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${card('Completed', cnt('Completed'), '#27AE60')}${card('In progress', cnt('In progress'), '#B8860B')}${card('Not started', cnt('Not started'), '#C0392B')}${card('Awaiting sign-up', cnt('Awaiting sign-up'))}</div>
    <div style="overflow-x:auto"><table style="width:100%;font-size:13px;border-collapse:collapse"><thead><tr style="text-align:left;font-size:11px;color:#777"><th>Person</th><th>Progress</th><th>Status</th><th>Final</th><th>Result</th></tr></thead><tbody>${rows || '<tr><td colspan="5">No team members.</td></tr>'}</tbody></table></div>
    <div style="font-size:11px;color:#777;margin-top:8px">Final = weighted score from KPIs, behavior and (when applicable) leadership/peers. Provisional until all expected evaluations are done. 70+ = approved. / Final = calificación ponderada; provisional hasta completar todas las evaluaciones. 70+ = aprobado.</div>`;
}
function tdKpisHtml() {
  const K = TD.kpis || { roles: [], empresa: [] };

  return `<div style="font-size:13px;margin-bottom:12px">🔒 Company KPIs are set by DHC (industry benchmarks) and cannot be changed. You can add up to <strong>${K.max_por_rol || 3} KPIs of your own per role</strong> for your team; they are averaged with the company KPIs when you evaluate. Weights and behavior questions stay company-wide so scores remain comparable.<br><span style="color:#777">Los KPIs de la empresa no se pueden cambiar. Puedes agregar hasta ${K.max_por_rol || 3} KPIs propios por rol; se promedian con los de la empresa. Los pesos y las preguntas de conducta son iguales para todos.</span></div>` +
    K.roles.map(role => {

        ${comp.length ? comp.map(k => `<div style="font-size:13px;padding:3px 0">🔒 ${tdEsc(k.nombre)} <span style="color:#777">${k.unidad ? '(' + tdEsc(k.unidad) + ')' : ''}${k.meta_default != null ? ' · goal ' + k.meta_default : ''}</span></div>`).join('') : '<div style="font-size:12px;color:#777">No company KPIs for this role.</div>'}
        <div style="margin-top:8px;font-size:12px;font-weight:700;color:#555">Your KPIs / Tus KPIs</div>

function tdAddKpi(role) { TD.custom.push({ rol: role, nombre: '', unidad: '', meta: '' }); renderTeamDashboard(); }
function tdRemoveKpi(i) { TD.custom.splice(i, 1); renderTeamDashboard(); }
async function tdSaveKpis() {
  const msg = document.getElementById('td-msg');
  const items = TD.custom.filter(c => c.nombre.trim()).map(c => ({ rol_evaluado: c.rol, nombre: c.nombre.trim(), unidad: c.unidad.trim(), meta_default: c.meta === '' ? null : c.meta }));
  try {
    const r = await sbFetch('rpc/evaluacion_kpis_equipo_set', { method: 'POST', body: JSON.stringify({ p_manager_id: loggedInEmployee.id, p_items: items }) });
    if (r && r.success) { TD.custom = items.map(c => ({ rol: c.rol_evaluado, nombre: c.nombre, unidad: c.unidad || '', meta: c.meta_default ?? '' })); msg.style.color = '#27AE60'; msg.textContent = '✓ Saved. They will appear when you evaluate your team. / Guardado.'; }

}

function renderMyProgress(p) {
  if (!p || !p.ciclo || !p.tareas) return '';
  const T = p.tareas, req = T.filter(t => t.estado === 'hecho' || t.estado === 'pendiente');
  const done = req.filter(t => t.estado === 'hecho').length, pend = req.filter(t => t.estado === 'pendiente');
  const blocked = T.filter(t => t.estado === 'no_registrado').length;
  const d = p.dias_restantes, over = d < 0, col = over ? '#C0392B' : d <= 7 ? '#B8860B' : '#27AE60';
  const fmt = x => new Date(x + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const pct = req.length ? Math.round(done / req.length * 100) : 100;
  const label = { self: 'Self-assessment / Autoevaluación', supervisor: 'Team member / Equipo', par: 'Fellow manager / Gerente colega', feedback: 'Anonymous feedback to manager / Comentarios a tu jefe' };
  const list = pend.length ? pend.map(t => `<li>${label[t.tipo]}: <strong>${t.tipo === 'self' ? 'yours' : t.nombre}</strong></li>`).join('') : '';
  return `<div class="card" style="border-left:5px solid ${col}">
    <h2>My Progress / Mi Progreso</h2>
    <div class="desc">${p.ciclo} · ${fmt(p.inicio)} → ${fmt(p.cierre)}</div>
    <div style="font-size:14px;font-weight:700;color:${col};margin:6px 0">${over ? 'Overdue by ' + (-d) + ' day(s) / Vencido hace ' + (-d) + ' día(s)' : 'Due ' + fmt(p.cierre) + ' — ' + d + ' day(s) left / ' + d + ' día(s) restantes'}</div>
    <div style="background:#eee;border-radius:8px;height:10px;overflow:hidden"><div style="width:${pct}%;height:10px;background:#27AE60"></div></div>
    <div style="font-size:13px;margin-top:6px">${done} of ${req.length} completed / ${done} de ${req.length} completadas</div>
    ${pend.length ? `<ul style="font-size:13px;margin:8px 0 0 18px;line-height:1.6">${list}</ul>` : '<div style="font-size:13px;margin-top:6px">✅ You are all caught up. / Estás al corriente.</div>'}
    ${blocked ? `<div style="font-size:12px;color:#777;margin-top:8px">${blocked} person(s) have not registered yet; you can evaluate them once they sign up. / ${blocked} persona(s) aún no se registran; podrás evaluarlas cuando lo hagan.</div>` : ''}
  </div>`;
}

async function loadEvalConfig() {
  if (evalConfig) return evalConfig;
  try { evalConfig = await sbFetch('rpc/evaluacion_config_get', { method: 'POST', body: '{}' }); } catch (err) { console.warn('config', err); evalConfig = { pesos: [], kpis: [] }; }
  return evalConfig;
}
function evalWeights(role) {
  const w = { kpi: 50, conducta: 50 };
  ((evalConfig && evalConfig.pesos) || []).filter(p => p.rol_evaluado === role).forEach(p => { w[p.componente] = Number(p.peso); });
  return w;
}

function selectFeedbackManager(id, nombre) {
  feedbackManager = { id, nombre };
  feedbackAnswers = {};
  const content = document.getElementById('app-content');
  const qs = MANAGER_FEEDBACK_QUESTIONS.map((q, i) => `
    <div style="margin-bottom:22px;">
      <div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:2px;">${i + 1}. ${q.title}</div>
      <div style="font-size:12px;color:var(--mgray);margin-bottom:8px;">${q.q}</div>
      ${q.opts.map((t, k) => `<div class="bars-option" id="fb-${q.key}-${k + 1}" onclick="pickFeedback('${q.key}',${k + 1})" style="padding:9px 12px;margin-bottom:6px;"><div class="num">${k + 1}</div><div class="txt">${t}</div></div>`).join('')}
    </div>`).join('');
  content.innerHTML = `
    <div class="card">
      <h2>${nombre}</h2>
      <div class="desc">Anonymous. Pick the statement that best describes what you have actually seen — 1 is the lowest, 5 the highest. Describe behavior, not personality. / Anónimo. Elige la frase que mejor describe lo que has visto realmente — 1 es lo más bajo, 5 lo más alto. Describe conductas, no personalidad.</div>
      ${qs}
      <div class="error-msg" id="fb-error">Please answer every question. / Por favor responde todas las preguntas.</div>
      <button class="btn btn-primary" id="fb-submit" onclick="submitManagerFeedback()">Send anonymously / Enviar de forma anónima</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="startManagerFeedback()">← Back / Regresar</button>
    </div>`;
}

function pickFeedback(key, v) {
  feedbackAnswers[key] = v;
  for (let k = 1; k <= 5; k++) {
    const el = document.getElementById(`fb-${key}-${k}`);
    if (el) el.classList.toggle('selected', k === v);
  }
}

async function submitManagerFeedback() {
  const errEl = document.getElementById('fb-error');
  if (MANAGER_FEEDBACK_QUESTIONS.some(q => feedbackAnswers[q.key] === undefined)) {
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';
  const btn = document.getElementById('fb-submit');
  btn.disabled = true; btn.textContent = 'Sending... / Enviando...';
  try {
    const rows = await sbFetch('rpc/enviar_feedback_anonimo', { method: 'POST', body: JSON.stringify({ p_empleado_id: loggedInEmployee.id, p_manager_id: feedbackManager.id, p_respuestas: feedbackAnswers }) });
    const r = rows && rows[0];
    if (!r || !r.success) { alert((r && r.message) || 'Could not send.'); btn.disabled = false; btn.textContent = 'Send anonymously / Enviar de forma anónima'; return; }
    document.getElementById('app-content').innerHTML = `
      <div class="card"><div class="success-screen"><div class="icon">✅</div>
      <h2>Thank you / Gracias</h2>
      <p>Your feedback was sent anonymously. / Tus comentarios se enviaron de forma anónima.</p>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="startManagerFeedback()">Continue / Continuar</button></div></div>`;
  } catch (err) {
    alert('Error: ' + err.message);
    btn.disabled = false; btn.textContent = 'Send anonymously / Enviar de forma anónima';
  }
}

/* ════════════════════════════════════════════════════════════
   SUPERVISOR MODE — search real registered employees by name
   (same empleados table that drives certifications/badges), pick
   one, enter their quota result, then BARS in third person.
   Always saves for real — no preview/skip-save behavior here,
   this is real management work product.
   ════════════════════════════════════════════════════════════ */
let allEmployeesForSearch = null;

async function startSupervisorSearch() {
  evalMode = 'supervisor';
  selectedEvaluado = null;
  currentDimIdx = 0;
  responses = {};
  quotaData = { metrics: [], pct_promedio: null };

  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="card"><p style="text-align:center;color:var(--mgray);padding:20px 0;">Loading team roster... / Cargando lista de empleados...</p></div>`;

  if (!allEmployeesForSearch) {
    try {
      const list = await sbFetch('rpc/evaluacion_mis_evaluados', { method: 'POST', body: JSON.stringify({ p_evaluador_id: loggedInEmployee.id }) });
      allEmployeesForSearch = (list || []).map(r => ({ id: r.empleado_id, roster_id: r.roster_id, nombre_completo: r.nombre, puesto: r.puesto, tienda: r.ubicacion, rol_eval: r.rol_eval, registrado: r.registrado, en_ciclo: r.en_ciclo, cubre: r.cubre }))
        .sort((a, b) => a.nombre_completo.localeCompare(b.nombre_completo));
    } catch (err) {
      content.innerHTML = `<div class="card"><div class="no-cycle">Could not load the employee roster. / No se pudo cargar la lista de empleados.</div></div>`;
      return;
    }
  }
  await refreshNoElegibles();
  renderSupervisorSearchScreen('');
}

function renderSupervisorSearchScreen(query) {
  const content = document.getElementById('app-content');
  const safeQ = (query || '').replace(/"/g, '&quot;');
  // The shell (with the input) is drawn ONCE. Typing only refreshes #sup-results,
  // so the input never loses focus between keystrokes.
  content.innerHTML = `
    <div class="card">
      <h2>Who are you evaluating? / ¿A quién vas a evaluar?</h2>
      <div class="desc">These are the people who report to you. / Estas son las personas que te reportan.</div>
      <input type="text" id="sup-search" class="field-input" placeholder="Type a name... / Escribe un nombre..." value="${safeQ}" oninput="renderSupervisorResults(this.value)" style="width:100%;padding:12px 14px;border:2px solid #e8e4dc;border-radius:10px;font-size:14px;margin-bottom:14px;" autocomplete="off">
      <div id="sup-results"></div>
      <button class="btn" style="margin-top:14px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderModePicker()">← Back / Regresar</button>
    </div>`;
  renderSupervisorResults(query || '');
  const inp = document.getElementById('sup-search');
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function renderSupervisorResults(query) {
  const box = document.getElementById('sup-results');
  if (!box) return;
  const q = (query || '').trim().toLowerCase();
  const pool = (allEmployeesForSearch || []).filter(e => !q || (e.nombre_completo || '').toLowerCase().includes(q));
  function empRow(e) {
    const meta = [e.puesto, e.tienda].filter(Boolean).join(' · ');
    const cover = e.cubre ? ` <span style="color:var(--mgray);font-size:11px;">(reports to ${e.cubre} — not registered yet / aún sin registro)</span>` : '';
    if (!e.registrado) return `<div class="bars-option" style="opacity:.5;cursor:default;"><div class="num">⏳</div><div class="txt"><strong>${e.nombre_completo}</strong> <span style="color:var(--mgray);font-size:11px;">${meta}</span><br><span style="font-size:11px;color:var(--mgray);">Not registered yet — can be evaluated after they sign up. / Aún no se registra.</span>${cover}</div></div>`;
    if (!e.en_ciclo) return `<div class="bars-option" style="opacity:.5;cursor:default;"><div class="num">➖</div><div class="txt"><strong>${e.nombre_completo}</strong> <span style="color:var(--mgray);font-size:11px;">${meta}</span><br><span style="font-size:11px;color:var(--mgray);">Not in this cycle. / No entra a este ciclo.</span></div></div>`;
    const neTag = noElegibles[e.id] ? ' <span style="color:var(--red);font-size:11px;font-weight:700;">N/A — not eligible</span>' : '';
    return `<div class="bars-option" onclick="selectEvaluado('${e.id}')"><div class="num">👤</div><div class="txt"><strong>${e.nombre_completo}</strong> <span style="color:var(--mgray);font-size:11px;">${meta}</span>${neTag}${cover}</div></div>`;
  }
  box.innerHTML = `<div style="max-height:420px;overflow-y:auto;">${pool.length ? pool.map(empRow).join('') : '<p style="color:var(--mgray);font-size:13px;padding:10px 0;">No matches found. / No se encontraron coincidencias.</p>'}</div>`;
}

async function selectEvaluado(empId) {
  selectedEvaluado = (allEmployeesForSearch || []).find(e => e.id === empId);
  if (!selectedEvaluado) return;

  // Check for an existing supervisor evaluation of this person, this cycle, by this evaluator
  let existing = [];
  try {
    existing = await sbFetch(`evaluaciones?ciclo_id=eq.${activeCycle.id}&evaluado_id=eq.${empId}&evaluador_id=eq.${loggedInEmployee.id}&tipo_evaluador=eq.supervisor&select=id,estado`);
  } catch (err) {
    console.warn('Could not check existing evaluation:', err);
  }
  if (existing && existing.length && existing[0].estado !== 'pendiente') {
    document.getElementById('app-content').innerHTML = `
      <div class="card">
        <div class="success-screen">
          <div class="icon">✅</div>
          <h2>Already Evaluated / Ya Evaluado</h2>
          <p>You've already submitted an evaluation for ${selectedEvaluado.nombre_completo} this cycle. / Ya enviaste una evaluación de ${selectedEvaluado.nombre_completo} este ciclo.</p>
        </div>
      </div>`;
    return;
  }

  previousEval = null;
  try {
    const prev = await sbFetch(`evaluaciones?evaluado_id=eq.${empId}&tipo_evaluador=eq.supervisor&estado=eq.completada&ciclo_id=neq.${activeCycle.id}&select=score_final,score_conductual,pct_promedio_cuota,feedback_narrativo,completada_at&order=completada_at.desc&limit=1`);
    if (prev && prev.length) previousEval = prev[0];
  } catch (err) { console.warn('Could not load previous evaluation:', err); }

  await refreshNoElegibles();
  renderEligibilityScreen();
}

/* ════════ ELIGIBILITY — the evaluator confirms the person completed the period ════════ */
let noElegibles = {};
const NOELEG_REASONS = [
  { k: 'ingreso_reciente', t: 'Joined during this period (has not completed the minimum time) / Ingresó durante este periodo (no completó el tiempo mínimo)' },
  { k: 'licencia', t: 'Was on leave for a large part of the period / Estuvo de licencia gran parte del periodo' },
  { k: 'cambio_rol', t: 'Changed role or store during the period / Cambió de puesto o tienda durante el periodo' },
  { k: 'otra_politica', t: 'Other company policy / Otra política de la empresa' }
];
async function refreshNoElegibles() {
  noElegibles = {};
  try {
    const rows = await sbFetch('rpc/evaluacion_no_elegibles_get', { method: 'POST', body: '{}' });
    (rows || []).forEach(r => { noElegibles[r.evaluado_id] = r.motivo; });
  } catch (err) { console.warn('eligibility', err); }
}
let pendingReason = null;
function renderEligibilityScreen() {
  const e = selectedEvaluado;
  const cur = noElegibles[e.id];
  pendingReason = null;
  const reasonLabel = k => (NOELEG_REASONS.find(r => r.k === k) || {}).t || k;
  document.getElementById('app-content').innerHTML = cur ? `
    <div class="card">
      <h2>${e.nombre_completo}</h2>
      <div class="badge-admin" style="background:#fdecea;border-left-color:var(--red);">Marked NOT eligible this period / Marcado como NO elegible este periodo<br><span style="font-weight:400;">${reasonLabel(cur)}</span></div>
      <button class="btn btn-primary" onclick="setEligibility(true)">Mark as eligible and evaluate / Marcar como elegible y evaluar</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderSupervisorSearchScreen('')">← Back / Regresar</button>
    </div>` : `
    <div class="card">
      <h2>${e.nombre_completo}</h2>
      <div class="desc">Did this person complete the evaluation period (${activeCycle.nombre}) and report to you for enough time to be evaluated fairly? / ¿Esta persona completó el periodo de evaluación (${activeCycle.nombre}) y estuvo bajo tu supervisión el tiempo suficiente para evaluarla de forma justa?</div>
      <button class="btn btn-primary" onclick="proceedToMetrics()">Yes — evaluate / Sí — evaluar</button>
      <div style="font-size:13px;font-weight:700;color:var(--navy);margin:20px 0 8px;">No — not eligible this period. Reason: / No — no elegible este periodo. Motivo:</div>
      ${NOELEG_REASONS.map(r => `<div class="bars-option" id="ne-${r.k}" onclick="pickNoElegReason('${r.k}')"><div class="txt">${r.t}</div></div>`).join('')}
      <div class="error-msg" id="ne-error">Pick a reason. / Elige un motivo.</div>
      <button class="btn" style="margin-top:6px;background:#8a8a8a;color:#fff;" onclick="setEligibility(false)">Mark as not eligible / Marcar como no elegible</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderSupervisorSearchScreen('')">← Back / Regresar</button>
    </div>`;
}
function pickNoElegReason(k) {
  pendingReason = k;
  NOELEG_REASONS.forEach(r => { const el = document.getElementById('ne-' + r.k); if (el) el.classList.toggle('selected', r.k === k); });
}
async function setEligibility(elegible) {
  if (!elegible && !pendingReason) { document.getElementById('ne-error').classList.add('show'); return; }
  try {
    const rows = await sbFetch('rpc/evaluacion_elegibilidad_set', { method: 'POST', body: JSON.stringify({ p_evaluador_id: loggedInEmployee.id, p_evaluado_id: selectedEvaluado.id, p_elegible: elegible, p_motivo: elegible ? null : pendingReason }) });
    const r = rows && rows[0];
    if (!r || !r.success) { alert((r && r.message) || 'Could not save.'); return; }
  } catch (err) { alert('Error: ' + err.message); return; }
  if (elegible) { delete noElegibles[selectedEvaluado.id]; await proceedToMetrics(); }
  else {
    noElegibles[selectedEvaluado.id] = pendingReason;
    document.getElementById('app-content').innerHTML = `<div class="card"><div class="success-screen"><div class="icon">✅</div><h2>Saved / Guardado</h2><p>${selectedEvaluado.nombre_completo} will not be evaluated this period. / ${selectedEvaluado.nombre_completo} no será evaluado este periodo.</p><button class="btn btn-primary" style="margin-top:20px;max-width:280px;" onclick="renderSupervisorSearchScreen('')">Evaluate Someone Else / Evaluar a Alguien Más</button></div></div>`;
  }
}
async function proceedToMetrics() {
  try {
    await loadMetricTemplate();
    renderQuotaScreen();
  } catch (err) {
    console.error('proceedToMetrics failed:', err);
    document.getElementById('app-content').innerHTML = `<div class="card"><h2>Something went wrong / Algo salió mal</h2><div class="desc">${(err && err.message) || err}</div><button class="btn btn-primary" onclick="proceedToMetrics()">Try again / Reintentar</button><button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderSupervisorSearchScreen('')">← Back / Regresar</button></div>`;
  }
}

/* ════════ PEER EVALUATION (manager ↔ manager, closed 1-5) ════════ */
async function startPeerEval() {
  evalMode = 'peer';
  selectedEvaluado = null;
  currentDimIdx = 0;
  responses = {};
  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="card"><p style="text-align:center;color:var(--mgray);padding:20px 0;">Loading... / Cargando...</p></div>`;
  let peers = [], done = [];
  try {
    const pr = await sbFetch('rpc/evaluacion_mis_pares', { method: 'POST', body: JSON.stringify({ p_empleado_id: loggedInEmployee.id }) });
    peers = (pr || []).map(x => ({ id: x.empleado_id, nombre_completo: x.nombre, tienda: x.ubicacion }));
    done = (pr || []).filter(x => x.ya_evaluado).map(x => ({ evaluado_id: x.empleado_id }));
  } catch (err) {
    content.innerHTML = `<div class="card"><div class="no-cycle">Could not load managers. / No se pudo cargar la lista.</div></div>`;
    return;
  }
  const doneIds = new Set((done || []).map(d => d.evaluado_id));
  window.__peers = peers || [];
  const rows = window.__peers.map(m => doneIds.has(m.id)
    ? `<div class="bars-option" style="opacity:.55;cursor:default;"><div class="num">✅</div><div class="txt"><strong>${m.nombre_completo}</strong> — Done / Listo</div></div>`
    : `<div class="bars-option" onclick="selectPeer('${m.id}')"><div class="num">👤</div><div class="txt"><strong>${m.nombre_completo}</strong> <span style="color:var(--mgray);font-size:11px;">(${m.tienda || ''})</span></div></div>`).join('');
  content.innerHTML = `
    <div class="card">
      <h2>Fellow Manager Evaluation / Evaluación de Gerente Colega</h2>
      <div class="desc">Rate how this manager collaborates with the other stores. Closed 1-5 questions about behavior. / Califica cómo colabora este gerente con las demás tiendas. Preguntas cerradas 1-5 sobre conductas.</div>
      ${rows || '<p style="color:var(--mgray);font-size:13px;">No other managers available. / No hay otros gerentes disponibles.</p>'}
      <button class="btn" style="margin-top:14px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderModePicker()">← Back / Regresar</button>
    </div>`;
}
function selectPeer(id) {
  selectedEvaluado = (window.__peers || []).find(m => m.id === id);
  if (!selectedEvaluado) return;
  evalMode = 'peer';
  currentDimIdx = 0;
  responses = {};
  renderQuestionScreen();
}

/* ════════ METRICS (KPIs set by the company per role) ════════ */
let metricRows = [];
let metricTemplateLoaded = false;
let metricsLocked = false;
let previousEval = null;

async function loadMetricTemplate() {
  // KPIs are set by the company per role (Cockpit → Evaluation Setup). The evaluator only enters results.
  const cfg = await loadEvalConfig();
  const role = evalRoleOf(selectedEvaluado);
  const hq = (cfg.kpis || []).filter(k => k.rol_evaluado === role);
  try {
    const tk = await sbFetch('rpc/evaluacion_kpis_equipo_get', { method: 'POST', body: JSON.stringify({ p_manager_id: loggedInEmployee.id }) });
    ((tk && tk.propios) || []).filter(k => k.rol_evaluado === role).forEach(k => hq.push({ nombre: k.nombre, unidad: k.unidad, meta_default: k.meta_default }));
  } catch (err) { console.warn('team kpis', err); }
  if (hq.length) {
    metricsLocked = true;
    metricRows = hq.map(k => ({ nombre: k.nombre, unidad: k.unidad || '', meta: (k.meta_default ?? ''), metaLocked: k.meta_default !== null && k.meta_default !== undefined, real: '' }));
    return;
  }
  metricsLocked = false;
  if (metricTemplateLoaded && metricRows.length) { metricRows = metricRows.map(r => ({ ...r, real: '' })); return; }
  let tpl = [];
  try {
    tpl = await sbFetch('rpc/metricas_plantilla_get', { method: 'POST', body: JSON.stringify({ p_evaluador_id: loggedInEmployee.id }) });
  } catch (err) { console.warn('Could not load metric template:', err); }
  metricRows = (tpl && tpl.length)
    ? tpl.map(t => ({ nombre: t.nombre, unidad: t.unidad || '', meta: '', real: '' }))
    : [{ nombre: 'Sales', unidad: '$', meta: '', real: '' }];
  metricTemplateLoaded = true;
}

function metricPct(r) {
  const meta = parseFloat(r.meta), real = parseFloat(r.real);
  if (!(meta > 0) || isNaN(real) || real < 0) return null;
  return Math.round((real / meta) * 1000) / 10;
}

function metricsAverage() {
  const pcts = metricRows.map(metricPct).filter(v => v !== null).map(v => Math.min(v, 150));
  return pcts.length ? Math.round((pcts.reduce((a, b) => a + b, 0) / pcts.length) * 10) / 10 : null;
}

function updateMetric(i, field, value) {
  metricRows[i][field] = value;
  const pct = metricPct(metricRows[i]);
  const el = document.getElementById('metric-pct-' + i);
  if (el) el.textContent = pct === null ? '—' : pct + '%';
  const avg = metricsAverage();
  const avgEl = document.getElementById('metric-avg');
  if (avgEl) avgEl.textContent = avg === null ? '—' : avg + '%';
}

function addMetricRow() { metricRows.push({ nombre: '', unidad: '', meta: '', real: '' }); renderQuotaScreen(); }
function removeMetricRow(i) { metricRows.splice(i, 1); if (!metricRows.length) metricRows.push({ nombre: '', unidad: '', meta: '', real: '' }); renderQuotaScreen(); }

function renderQuotaScreen() {
  const content = document.getElementById('app-content');
  const fld = 'padding:9px 10px;border:2px solid #e8e4dc;border-radius:8px;font-size:13px;width:100%;';
  const rowsHtml = metricRows.map((r, i) => `
    <div style="display:grid;grid-template-columns:1.6fr .7fr 1fr 1fr .8fr auto;gap:6px;align-items:center;margin-bottom:8px;">
      <input type="text" placeholder="Metric / Métrica" value="${(r.nombre || '').replace(/"/g, '&quot;')}" oninput="updateMetric(${i},'nombre',this.value)" style="${fld}" ${metricsLocked ? 'readonly tabindex="-1" title="Set by the company"' : ''}>
      <input type="text" placeholder="Unit" value="${(r.unidad || '').replace(/"/g, '&quot;')}" oninput="updateMetric(${i},'unidad',this.value)" style="${fld}" ${metricsLocked ? 'readonly tabindex="-1"' : ''}>
      <input type="number" min="0" step="any" placeholder="Goal / Meta" value="${r.meta}" oninput="updateMetric(${i},'meta',this.value)" style="${fld}" ${r.metaLocked ? 'readonly title="Set by the company"' : ''}>
      <input type="number" min="0" step="any" placeholder="Actual / Real" value="${r.real}" oninput="updateMetric(${i},'real',this.value)" style="${fld}">
      <strong id="metric-pct-${i}" style="color:var(--navy);font-size:13px;text-align:center;">${metricPct(r) === null ? '—' : metricPct(r) + '%'}</strong>
      ${metricsLocked ? '<span></span>' : `<button class="btn" onclick="removeMetricRow(${i})" style="padding:4px 9px;background:transparent;color:var(--mgray);font-size:16px;" title="Remove">✕</button>`}
    </div>`).join('');

  const prevHtml = previousEval ? `
    <div style="background:#f4f1ea;border-left:4px solid var(--gold);padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:16px;">
      <strong>Previous evaluation / Evaluación anterior</strong> (${(previousEval.completada_at || '').slice(0, 10)})<br>
      Final score / Puntaje final: <strong>${previousEval.score_final ?? '—'}</strong>
      · Quota / Cuota: <strong>${previousEval.pct_promedio_cuota ?? '—'}%</strong>
    </div>` : '';

  content.innerHTML = `
    <div class="card">
      <h2>Performance Metrics / Métricas de Desempeño</h2>
      <div class="desc">Evaluating: <strong>${selectedEvaluado.nombre_completo}</strong> — ${activeCycle.nombre}<br>${metricsLocked ? 'These KPIs are set by the company for this role. Enter the goal (if blank) and the actual result. / Estos KPIs los define la empresa para este rol. Captura la meta (si está vacía) y el resultado real.' : "Enter this person's goals and actual results for the cycle. / Captura las metas y resultados reales de esta persona en el ciclo."}</div>
      ${prevHtml}
      <div style="display:grid;grid-template-columns:1.6fr .7fr 1fr 1fr .8fr auto;gap:6px;font-size:11px;font-weight:700;color:var(--mgray);margin-bottom:6px;">
        <span>METRIC</span><span>UNIT</span><span>GOAL</span><span>ACTUAL</span><span style="text-align:center;">% MET</span><span></span>
      </div>
      ${rowsHtml}
      ${metricsLocked ? '' : `<button class="btn" onclick="addMetricRow()" style="background:transparent;color:var(--navy);font-weight:600;text-decoration:underline;margin-bottom:10px;">+ Add metric / Agregar métrica</button>`}
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #f0ece2;font-size:14px;">
        <span>Average attainment / Cumplimiento promedio</span><strong id="metric-avg" style="color:var(--navy);">${metricsAverage() === null ? '—' : metricsAverage() + '%'}</strong>
      </div>
      ${metricsLocked ? '' : `<label style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mgray);margin:8px 0 14px;"><input type="checkbox" id="metric-save-tpl" checked> Remember these metric names for my next evaluations / Recordar estos nombres para mis próximas evaluaciones</label>`}
      <div class="error-msg" id="quota-error">Add at least one metric with a goal greater than 0 and an actual value. / Agrega al menos una métrica con meta mayor a 0 y un valor real.</div>
      <button class="btn btn-primary" onclick="confirmQuota()">Continue / Continuar</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="renderSupervisorSearchScreen('')">← Back / Regresar</button>
    </div>`;
}

async function confirmQuota() {
  const valid = metricRows.filter(r => (r.nombre || '').trim() && metricPct(r) !== null);
  if (metricsLocked && valid.length < metricRows.length) { document.getElementById('quota-error').textContent = 'Fill in every KPI (goal and actual). / Llena todos los KPIs (meta y real).'; document.getElementById('quota-error').classList.add('show'); return; }
  if (!valid.length) { document.getElementById('quota-error').classList.add('show'); return; }
  quotaData = { metrics: valid.map(r => ({ nombre: r.nombre.trim(), unidad: (r.unidad || '').trim(), meta: parseFloat(r.meta), real: parseFloat(r.real) })), pct_promedio: metricsAverage() };
  const saveTpl = document.getElementById('metric-save-tpl');
  if (saveTpl && saveTpl.checked && !isAdminPreview) {
    try {
      await sbFetch('rpc/metricas_plantilla_set', { method: 'POST', body: JSON.stringify({ p_evaluador_id: loggedInEmployee.id, p_items: quotaData.metrics.map((m, i) => ({ nombre: m.nombre, unidad: m.unidad, orden: i })) }) });
    } catch (err) { console.warn('Could not save metric template:', err); }
  }
  currentDimIdx = 0;
  responses = {};
  renderQuestionScreen();
}

/* ════════════════════════════════════════════════════════════
   RENDER — one dimension at a time, forced-choice BARS.
   Uses DIMENSIONS (1st person) for self, SUPERVISOR_DIMENSIONS
   (3rd person) for supervisor mode.
   ════════════════════════════════════════════════════════════ */
function isRatedMode() { return evalMode === 'supervisor' || evalMode === 'peer'; }
function currentDimSet() {
  if (evalMode === 'peer') return PEER_DIMENSIONS;
  if (evalMode === 'supervisor') { const rr = evalRoleOf(selectedEvaluado); return rr === 'vendedor' ? SUPERVISOR_DIMENSIONS : rr === 'staff' ? STAFF_DIMENSIONS : MANAGER_BOSS_DIMENSIONS; }
  return VALUES_QUESTIONS;
}

function renderQuestionScreen() {
  const content = document.getElementById('app-content');
  const dims = currentDimSet();
  const dim = dims[currentDimIdx];
  const pct = Math.round((currentDimIdx / dims.length) * 100);

  // Preview mode applies to BOTH self and supervisor flows for admins —
  // lets a Super Admin walk the entire module (including "evaluating"
  // a real person) without ever writing to that person's real record.
  const adminBanner = isAdminPreview
    ? `<div class="badge-admin">🔍 Admin Preview Mode — this run will NOT be saved to any employee's record. / Modo Vista Admin — esta sesión NO se guardará en el registro de ningún empleado.</div>`
    : '';

  const evaluandoBanner = isRatedMode()
    ? `<div class="badge-admin" style="background:var(--ltblue);border-left-color:var(--navy);">Evaluating / Evaluando: <strong>${selectedEvaluado.nombre_completo}</strong></div>`
    : '';

  const optsHtml = isRatedMode()
    ? dim.opts.map((opt, i) => {
        const selected = responses[dim.key] === (i + 1) ? 'selected' : '';
        return `
          <div class="bars-option ${selected}" onclick="selectOption('${dim.key}', ${i + 1})">
            <div class="num">${i + 1}</div>
            <div class="txt">${opt}</div>
          </div>`;
      }).join('')
    : dim.opts.map((opt, i) => {
        const selected = responses[dim.key] === i ? 'selected' : '';
        return `
          <div class="bars-option ${selected}" onclick="selectOption('${dim.key}', ${i})">
            <div class="num">${String.fromCharCode(65 + i)}</div>
            <div class="txt">${opt}</div>
          </div>`;
      }).join('');

  content.innerHTML = `
    ${adminBanner}
    ${evaluandoBanner}
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Question ${currentDimIdx + 1} of ${dims.length} / Pregunta ${currentDimIdx + 1} de ${dims.length}</div>
    <div class="card">
      <div class="dim-title"><span class="dim-num">${currentDimIdx + 1}</span>${dim.title}</div>
      <div class="dim-q">${dim.q}</div>
      ${optsHtml}
      <div class="error-msg" id="dim-error">Please select an option before continuing. / Por favor selecciona una opción antes de continuar.</div>
      <button class="btn btn-primary" id="btn-next" style="margin-top:18px" onclick="nextDimension()">
        ${currentDimIdx === dims.length - 1 ? 'Review & Submit / Revisar y Enviar' : 'Next / Siguiente →'}
      </button>
    </div>`;
}

function selectOption(key, value) {
  responses[key] = value;
  renderQuestionScreen();
}

function nextDimension() {
  const dims = currentDimSet();
  const dim = dims[currentDimIdx];
  if (responses[dim.key] === undefined) {
    document.getElementById('dim-error').classList.add('show');
    return;
  }
  if (currentDimIdx < dims.length - 1) {
    currentDimIdx++;
    renderQuestionScreen();
  } else {
    renderReviewScreen();
  }
}

/* ════════════════════════════════════════════════════════════
   REVIEW & SUBMIT
   ════════════════════════════════════════════════════════════ */
function renderReviewScreen() {
  const content = document.getElementById('app-content');
  const dims = currentDimSet();
  const rows = dims.map(dim => {
    const raw = responses[dim.key];
    const display = isRatedMode() ? raw + '/5' : String.fromCharCode(65 + raw);
    return `
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13px;">
      <span style="color:var(--dkgray)">${dim.title}</span>
      <strong style="color:var(--navy)">${display}</strong>
    </div>`;
  }).join('');

  const quotaRow = evalMode === 'supervisor'
    ? `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13px;">
        <span style="color:var(--dkgray)">Quota Performance / Desempeño de Cuota</span>
        <strong style="color:var(--navy)">${quotaData.pct_promedio}% avg (${quotaData.metrics.length} metric${quotaData.metrics.length === 1 ? '' : 's'})</strong>
      </div>`
    : '';

  const evaluandoLine = isRatedMode()
    ? `<div class="desc">Evaluating: <strong>${selectedEvaluado.nombre_completo}</strong></div>`
    : '';

  const submitLabel = isRatedMode() ? 'Submit Evaluation / Enviar Evaluación' : 'Submit Self-Assessment / Enviar Autoevaluación';

  content.innerHTML = `
    <div class="card">
      <h2>Review Your Answers / Revisa Tus Respuestas</h2>
      ${evaluandoLine}
      <div class="desc">Once submitted, you won't be able to change these answers. / Una vez enviado, no podrás cambiar estas respuestas.</div>
      ${quotaRow}
      ${rows}
      <div class="error-msg" id="submit-error"></div>
      <button class="btn btn-primary" id="btn-submit" style="margin-top:20px" onclick="submitEvaluation()">${submitLabel}</button>
      <button class="btn" style="margin-top:10px;background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;" onclick="currentDimIdx=currentDimSet().length-1;renderQuestionScreen();">← Back to edit / Regresar a editar</button>
    </div>`;
}

async function submitEvaluation() {
  const btn = document.getElementById('btn-submit');
  const errEl = document.getElementById('submit-error');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting... / Enviando...';

  // Preview-mode skip-save now applies to BOTH self and supervisor flows —
  // a Super Admin can fully test evaluating a real person without it
  // ever hitting that person's actual record.
  if (isAdminPreview) {
    setTimeout(() => {
      document.getElementById('app-content').innerHTML = `
        <div class="card">
          <div class="success-screen">
            <div class="icon">🔍</div>
            <h2>Admin Preview Complete / Vista Admin Completada</h2>
            <p>Nothing was saved — this was a preview run only. / Nada se guardó — esta fue solo una corrida de vista previa.</p>
          </div>
        </div>`;
    }, 500);
    return;
  }

  const dims = currentDimSet();
  const isSupervisor = evalMode === 'supervisor';
  const isPeer = evalMode === 'peer';
  const isRated = isSupervisor || isPeer;
  await loadEvalConfig();

  try {
    const evalPayload = {
      ciclo_id: activeCycle.id,
      evaluado_id: isRated ? selectedEvaluado.id : loggedInEmployee.id,
      evaluador_id: loggedInEmployee.id,
      tipo_evaluador: isSupervisor ? 'supervisor' : isPeer ? 'par' : 'self',
      track: 'sales',
      estado: 'completada',
      completada_at: new Date().toISOString()
    };
    if (isSupervisor) {
      const scores = dims.map(d => responses[d.key]);
      const conductual = Math.round(((scores.reduce((a, b) => a + b, 0) / scores.length) - 1) / 4 * 100);
      const cuota = Math.round(Math.min(quotaData.pct_promedio, 100));
      evalPayload.pct_promedio_cuota = quotaData.pct_promedio;
      evalPayload.score_conductual = conductual;
      evalPayload.score_cuota = cuota;
      const w = evalWeights(evalRoleOf(selectedEvaluado));
      const wsum = (w.kpi || 0) + (w.conducta || 0);
      evalPayload.score_final = wsum > 0 ? Math.round(((w.kpi || 0) * cuota + (w.conducta || 0) * conductual) / wsum) : Math.round(0.5 * cuota + 0.5 * conductual);
    } else if (isPeer) {
      const scores = dims.map(d => responses[d.key]);
      const peerScore = Math.round(((scores.reduce((a, b) => a + b, 0) / scores.length) - 1) / 4 * 100);
      evalPayload.score_conductual = peerScore;
      evalPayload.score_final = peerScore;
    } else {
      // Self score = % of forced-choice questions answered with the
      // higher-performance option (B). Same formula as the original design.
      // Self score = average of chosen option index / (options - 1), scaled to 100.
      // e.g. picking the top option (index 3 of 4) on everything = 100.
      const dimsList = currentDimSet();
      const maxIdx = dimsList[0].opts.length - 1;
      const sum = dimsList.reduce((s, d) => s + (responses[d.key] || 0), 0);
      const selfScore = Math.round((sum / (dimsList.length * maxIdx)) * 100);
      evalPayload.score_conductual = selfScore;
      evalPayload.score_final = selfScore;
    }

    const evalRows = await sbFetch('evaluaciones', { method: 'POST', body: JSON.stringify(evalPayload) });
    const evaluacionId = evalRows[0].id;

    const respuestaRows = dims.map(dim => ({
      evaluacion_id: evaluacionId,
      dimension: dim.key,
      pregunta_key: dim.key,
      pregunta_texto: dim.q,
      // Supervisor mode: 1-5 BARS score. Self mode: multiple-choice index
      // (0-3), both numeric so they fit the same column.
      respuesta_score: responses[dim.key]
    }));
    await sbFetch('evaluacion_respuestas', { method: 'POST', body: JSON.stringify(respuestaRows) });
    if (isSupervisor) {
      await sbFetch('rpc/metricas_guardar', { method: 'POST', body: JSON.stringify({ p_evaluacion_id: evaluacionId, p_evaluador_id: loggedInEmployee.id, p_items: quotaData.metrics }) });
    }

    const successMsg = isPeer
      ? `<h2>Evaluation Submitted! / ¡Evaluación Enviada!</h2><p>Your evaluation of ${selectedEvaluado.nombre_completo} has been saved. / Tu evaluación de ${selectedEvaluado.nombre_completo} se guardó.</p>`
      : isSupervisor
      ? `<h2>Evaluation Submitted! / ¡Evaluación Enviada!</h2><p>Your evaluation of ${selectedEvaluado.nombre_completo} for ${activeCycle.nombre} has been saved. / Tu evaluación de ${selectedEvaluado.nombre_completo} para ${activeCycle.nombre} se guardó.</p>${(previousEval && previousEval.score_final != null && evalPayload.score_final != null) ? `<p style="margin-top:10px;">Change vs previous cycle / Cambio vs ciclo anterior: <strong>${evalPayload.score_final - previousEval.score_final >= 0 ? '+' : ''}${Math.round(evalPayload.score_final - previousEval.score_final)}</strong> pts (${Math.round(previousEval.score_final)} → ${evalPayload.score_final})</p>` : ''}`
      : `<h2>Self-Assessment Submitted! / ¡Autoevaluación Enviada!</h2><p>Thank you, ${loggedInEmployee.nombre_completo}. Your supervisor will review your evaluation and follow up with feedback during ${activeCycle.nombre}. / Gracias, ${loggedInEmployee.nombre_completo}. Tu supervisor revisará tu evaluación durante ${activeCycle.nombre}.</p>`;

    document.getElementById('app-content').innerHTML = `
      <div class="card">
        <div class="success-screen">
          <div class="icon">✅</div>
          ${successMsg}
          ${isSupervisor ? `<button class="btn btn-primary" style="margin-top:20px;max-width:280px;" onclick="startSupervisorSearch()">Evaluate Someone Else / Evaluar a Alguien Más</button>` : isPeer ? `<button class="btn btn-primary" style="margin-top:20px;max-width:280px;" onclick="startPeerEval()">Evaluate Another Manager / Evaluar a Otro Gerente</button>` : ''}
        </div>
      </div>`;

  } catch (err) {
    console.error('Submit failed:', err);
    errEl.textContent = 'Something went wrong submitting your evaluation. Please try again. / Algo salió mal al enviar tu evaluación. Intenta de nuevo.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = isRated ? 'Submit Evaluation / Enviar Evaluación' : 'Submit Self-Assessment / Enviar Autoevaluación';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
