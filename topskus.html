<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"><script src="dh-phone.js"></script><link rel="stylesheet" href="dh-mobile.css">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B3A6B">
<title>My Workspace — Top 10 SKUs</title>
<style>
  :root{--navy:#1B3A6B;--gold:#C8922A;--ink:#1E2735;--gray:#6B6B6B;--red:#C0392B;--green:#2E7D32;--line:#dfe5ee}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F6;color:var(--ink)}
  header{background:var(--navy);border-bottom:3px solid var(--gold);padding:12px 20px;color:#fff}
  header h1{font:700 19px Georgia,'Times New Roman',serif}
  main{max-width:760px;margin:0 auto;padding:16px 14px 70px}
  .per{font-size:14px;color:var(--gray);margin-bottom:12px;line-height:1.5}
  .row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 0 var(--line)}
  .rk{flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font:700 16px Georgia,serif;display:flex;align-items:center;justify-content:center}
  .row:nth-child(-n+3) .rk{background:var(--gold)}
  .mid{flex:1;min-width:0}
  .d{font-weight:700;font-size:15px;line-height:1.3}
  .m{font-size:13px;color:var(--gray);margin-top:2px;word-break:break-all}
  .rt{text-align:right;flex:0 0 auto}
  .q{font:700 20px Georgia,serif;color:var(--navy)}
  .ql{font-size:12px;color:var(--gray)}
  .s{font-size:12px;font-weight:700;margin-top:3px}
  .s.g{color:var(--green)} .s.r{color:var(--red)}
  .empty,.err{background:#fff;border-radius:14px;padding:20px;color:var(--gray);font-size:15px;line-height:1.5}
  .err{background:#fdecea;color:var(--red)}
  .hide{display:none!important}
</style>
<meta name="dh-i18n" content="on">
<script src="dh-chrome.js" defer></script>
</head>
<body>
<header><h1>🏆 Top 10 SKUs</h1></header>
<main>
  <div id="per" class="per" data-no-i18n></div>
  <div id="err" class="err hide" role="alert"></div>
  <div id="list" data-no-i18n></div>
</main>
<script src="dh-session.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LANG=()=>{try{return localStorage.getItem('dh_lang')==='es'?'es':'en'}catch(e){return 'en'}};
const T=(en,es)=>LANG()==='es'?es:en;
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
async function load(){
  try{
    const r=await DH.rpc('top_skus',{});
    const it=r.items||[];
    if(r.desde){
      const same=r.desde===r.hasta;
      $('per').textContent=T('Sales period: ','Periodo de ventas: ')+(same?r.desde:r.desde+' – '+r.hasta)+(r.actualizado?' · '+T('updated ','actualizado ')+new Date(r.actualizado).toLocaleString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'');
    }
    if(!it.length){$('list').innerHTML='<div class="empty">'+esc(T('No sales data loaded yet.','Todavía no hay datos de ventas cargados.'))+'</div>';return}
    $('list').innerHTML=it.map((x,i)=>'<div class="row"><div class="rk">'+(i+1)+'</div><div class="mid"><div class="d">'+esc(x.descripcion||x.modelo)+'</div><div class="m">'+esc(x.modelo||'')+' · SKU '+esc(x.sku)+'</div></div><div class="rt"><div class="q">'+esc(x.vendidas)+'</div><div class="ql">'+esc(T('sold','vendidos'))+(r.detalle&&x.ventas!=null?' · '+money(x.ventas):'')+'</div><div class="s '+(x.disponible?'g':'r')+'">'+(x.disponible?'● '+esc(T('Available','Disponible')):'● '+esc(T('Not available','No disponible')))+'</div></div></div>').join('');
  }catch(e){const el=$('err');el.textContent=T('Could not load the report. Try again.','No se pudo cargar el reporte. Intenta de nuevo.');el.classList.remove('hide')}
}
(function(){ if(!DH.token()){location.href='index.html';return} load(); })();
</script>
</body>
</html>
