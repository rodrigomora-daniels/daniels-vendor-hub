<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"><script src="dh-phone.js"></script><link rel="stylesheet" href="dh-mobile.css">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B3A6B">
<title>My Workspace — Messages / Mensajes</title>
<style>
  :root{--navy:#1B3A6B;--rail:#12284A;--gold:#C8922A;--lt:#D6E4F7;--ink:#1E2735;--gray:#6B6B6B;--red:#C0392B}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F6;color:var(--ink);display:flex;flex-direction:column}
  header{background:var(--navy);border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff;flex:none}
  header h1{font-size:18px} header a{color:var(--lt);font-size:13px;text-decoration:none}
  .app{flex:1;min-height:0;display:flex;max-width:1180px;width:100%;margin:0 auto;background:#fff;box-shadow:0 0 0 1px #dfe5ee}
  .chans{width:270px;flex:none;background:var(--rail);overflow-y:auto;padding:10px 8px}
  .chan{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:0;border-left:3px solid transparent;border-radius:8px;background:none;color:#d6e4f7;font:600 14px/1.25 'Segoe UI',Arial,sans-serif;padding:8px 12px;cursor:pointer}
  .chan:hover{background:rgba(255,255,255,.07)}
  .chan.on{background:rgba(200,146,42,.18);color:#fff;border-left-color:var(--gold)}
  .chan:focus-visible,.send:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .chan .n{flex:1;min-width:0}
  .chan small{display:block;font:400 12px 'Segoe UI',Arial,sans-serif;color:#8fa6c8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chan .bdg{background:var(--gold);color:#fff;border-radius:11px;min-width:22px;padding:2px 7px;font:700 12px Arial,sans-serif;text-align:center}
  .thread{flex:1;min-width:0;display:flex;flex-direction:column;background:#F6F8FB}
  .th-head{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid #e3e8f0;flex:none}
  .th-head h2{font:700 18px 'Segoe UI',Arial,sans-serif;color:var(--navy)}
  .th-head small{color:var(--gray);font-size:13px;display:block}
  .back{display:none;border:0;background:none;font-size:22px;color:var(--navy);cursor:pointer;padding:4px 8px}
  .msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
  .day{align-self:center;font:600 12px 'Segoe UI',Arial,sans-serif;color:var(--gray);background:#e6ebf3;border-radius:10px;padding:3px 12px;margin:10px 0 4px}
  .m{max-width:min(620px,86%);display:flex;flex-direction:column;align-self:flex-start}
  .m.me{align-self:flex-end;align-items:flex-end}
  .m .who{font:600 12px 'Segoe UI',Arial,sans-serif;color:var(--gray);margin:6px 4px 2px}
  .m .b{background:#fff;border:1px solid #e1e6ee;border-radius:14px 14px 14px 4px;padding:9px 13px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .m.me .b{background:var(--navy);color:#fff;border-color:var(--navy);border-radius:14px 14px 4px 14px}
  .m .meta{font:12px 'Segoe UI',Arial,sans-serif;color:#8a94a3;margin:2px 4px;display:flex;gap:10px;align-items:center}
  .m .del{border:0;background:none;color:#8a94a3;font:600 12px 'Segoe UI',Arial,sans-serif;cursor:pointer;padding:2px 0}
  .m .del:hover,.m .del.ask{color:var(--red)}
  .m .rx{display:flex;gap:5px;flex-wrap:wrap;margin:4px 2px 0}
  .m.me .rx{justify-content:flex-end}
  .rxc{display:inline-flex;align-items:center;gap:5px;border:1px solid #d5dce8;background:#fff;border-radius:16px;padding:3px 10px;font-size:15px;min-height:32px;cursor:pointer}
  .rxc b{font:700 12px Arial,sans-serif;color:var(--navy)}
  .rxc.yo{background:#E4EDFB;border-color:var(--navy)}
  .m .rxadd{border:0;background:none;color:#8a94a3;font:600 13px 'Segoe UI',Arial,sans-serif;cursor:pointer;min-height:28px;padding:2px 4px}
  .m .rxadd:hover{color:var(--navy)}
  .m .pk{display:flex;gap:4px;background:#fff;border:1px solid #d5dce8;border-radius:22px;padding:4px 6px;margin:2px 0;box-shadow:0 6px 16px -8px rgba(18,40,74,.35)}
  .m .pk button{border:0;background:none;font-size:24px;min-width:44px;min-height:44px;border-radius:50%;cursor:pointer}
  .m .pk button:hover{background:#EEF3FB}
  .hbtn{border:1px solid #c5ccd8;background:#fff;color:var(--navy);border-radius:8px;padding:8px 12px;font:700 13px 'Segoe UI',Arial,sans-serif;min-height:40px;cursor:pointer;flex:none}
  .rbar{flex:none;display:flex;gap:10px;align-items:center;padding:8px 14px;background:#EEF3FB;border-top:1px solid #d5dce8;font-size:13px;color:#33404f}
  .rbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rbar button{border:0;background:#fff;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;flex:none}
  .tpl{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 14px 0;background:#fff;border-top:1px solid #e3e8f0}
  .tpl button{flex:none;border:1px solid #c5ccd8;background:#fff;border-radius:18px;padding:8px 14px;font:600 13px 'Segoe UI',Arial,sans-serif;min-height:40px;cursor:pointer;white-space:nowrap}
  .m .qt{background:#EEF1F6;border-left:3px solid var(--gold);border-radius:6px;padding:5px 9px;margin:0 0 3px;font-size:12.5px;color:#4a5566;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m .qt b{color:var(--navy)}
  .m .rp{border:0;background:none;color:#8a94a3;font:600 12px 'Segoe UI',Arial,sans-serif;cursor:pointer;min-height:28px;padding:2px 4px}
  .m .rp:hover{color:var(--navy)}
  .m .b.f1{border-left:6px solid #C0392B}.m .b.f2{border-left:6px solid #2E7D32}.m .b.f3{border-left:6px solid #C8922A}.m .b.f4{border-left:6px solid #3a3a3a}.m .b.f5{border-left:6px solid #2F6FB5}
  .m.hl .b{box-shadow:0 0 0 3px rgba(200,146,42,.55)}
  .dlg{position:fixed;inset:0;background:rgba(10,22,45,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:12px}
  .dlg.show{display:flex}
  .dp{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:12px;padding:20px}
  .dp h2{font:700 21px Georgia,serif;color:var(--navy);margin-bottom:4px}
  .dp .sub{color:var(--gray);font-size:14px;margin-bottom:10px}
  .dp .who2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
  .dp .who2 i{color:var(--gray);font-size:12px;font-style:normal}
  .dp select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #c5ccd8;border-radius:8px;min-height:46px;margin-top:10px}
  .dp .btn2{border:1px solid #c5ccd8;background:#fff;color:var(--navy);border-radius:8px;padding:9px 14px;font-weight:700;min-height:42px;cursor:pointer}
  .dp .btn2.d{color:var(--red)}
  .empty{margin:auto;text-align:center;color:var(--gray);max-width:300px;line-height:1.5}
  .comp{position:relative;flex:none;display:flex;gap:10px;align-items:flex-end;padding:12px 14px;background:#fff;border-top:1px solid #e3e8f0}
  .comp textarea{flex:1;min-height:46px;max-height:140px;resize:none;font:inherit;font-size:16px;padding:11px 14px;border:1px solid #cfd6e2;border-radius:12px;line-height:1.35}
  .send{border:0;background:var(--navy);color:#fff;border-radius:12px;min-height:46px;padding:0 20px;font:700 15px 'Segoe UI',Arial,sans-serif;cursor:pointer}
  .send[disabled]{opacity:.45;cursor:default}
  .note{padding:12px 16px;background:#fff8e6;color:#7a5b00;font-size:13px;text-align:center;flex:none;border-top:1px solid #f0e2b8}
  .err{padding:8px 16px;background:#fdecea;color:var(--red);font-size:13px;flex:none}
  #mpop{position:absolute;left:14px;right:14px;bottom:calc(100% - 2px);background:#fff;border:1px solid #cfd6e2;border-radius:12px;box-shadow:0 -8px 24px -10px rgba(18,40,74,.35);max-height:264px;overflow-y:auto;z-index:20}
  #mpop button{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:48px;border:0;background:none;padding:6px 14px;text-align:left;font:600 15px 'Segoe UI',Arial,sans-serif;color:var(--ink);cursor:pointer;border-bottom:1px solid #f0f2f6}
  #mpop button small{font:400 12px 'Segoe UI',Arial,sans-serif;color:var(--gray)}
  #mpop button.on,#mpop button:hover{background:#EEF3FB}
  .atb{border:1px solid #cfd6e2;background:#fff;color:var(--navy);border-radius:12px;min-width:46px;min-height:46px;font:700 18px 'Segoe UI',Arial,sans-serif;cursor:pointer;flex:none}
  .mt{color:#1B5FB3;font-weight:700}.m.me .mt{color:#F2CD7A}
  .m.mn .b{box-shadow:0 0 0 2px var(--gold)}
  .hide{display:none!important}
  @media (max-width:760px){
    .chans{width:100%} .thread{width:100%}
    .app.in-thread .chans{display:none} .app:not(.in-thread) .thread{display:none}
    .back{display:block}
  }
</style>
<meta name="dh-i18n" content="on">
<script src="dh-chrome.js" defer></script>
</head>
<body>
<header><h1>💬 Messages / Mensajes</h1><a href="index.html">← Home / Inicio</a></header>
<div class="app" id="app">
  <nav class="chans" id="chans" aria-label="Channels"></nav>
  <section class="thread" id="thread">
    <div class="th-head"><button class="back" onclick="back()" aria-label="Back">‹</button><div style="flex:1;min-width:0"><h2 id="t-name" data-no-i18n></h2><small id="t-desc" data-no-i18n></small></div><button class="hbtn hide" id="adm" onclick="openPub()">Who can post / Quién publica</button></div>
    <div class="err hide" id="err"></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="note hide" id="ro">This channel is read-only. / Este canal es solo de lectura.</div>
    <div class="rbar hide" id="rbar"></div>
    <div class="tpl hide" id="tpl"></div>
    <form class="comp" id="comp" onsubmit="return send(event)">
      <div id="mpop" class="hide" role="listbox" aria-label="Mention"></div>
      <button type="button" class="atb" id="atb" onclick="openAt()" aria-label="Mention someone / Mencionar a alguien">@</button>
      <textarea id="txt" rows="1" maxlength="1500" placeholder="Write a message… / Escribe un mensaje…" aria-label="Message"></textarea>
      <button class="send" id="sendb" type="submit">Send / Enviar</button>
    </form>
  </section>
</div>
<div class="dlg" id="dlg" onclick="if(event.target===this)closeDlg()" role="dialog" aria-modal="true"><div class="dp" id="dp"></div></div>
<script src="dh-session.js"></script>
<script src="push.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tr=s=>(window.DH&&DH.i18n)?DH.i18n.pick(s):s;
const LA='America/Los_Angeles';
let DIR=[], MEN=new Map(), PSEL=-1, PLIST=[], CH=[], CUR=null, LAST=null, SEEN=new Set(), POLL=null, BUSY=false, ASK=null, REPLY=null, CI={};
const L=()=>(DH.i18n&&DH.i18n.lang==='es')?'es-US':'en-US';
function dayKey(t){return new Date(t).toLocaleDateString('en-CA',{timeZone:LA});}
function dayLabel(t){const k=dayKey(t),now=new Date(),td=dayKey(now),yd=dayKey(new Date(now-864e5));
  return k===td?tr('Today / Hoy'):k===yd?tr('Yesterday / Ayer'):new Date(t).toLocaleDateString(L(),{weekday:'long',month:'long',day:'numeric',timeZone:LA});}
function tm(t){return new Date(t).toLocaleTimeString(L(),{hour:'numeric',minute:'2-digit',timeZone:LA});}
function showErr(t){const e=$('err');if(!t){e.classList.add('hide');return;}e.textContent=t;e.classList.remove('hide');}

async function init(){
  if(!DH.token()){location.href='index.html';return;}
  await loadChans(true);
  const want=location.hash.slice(1); const first=CH.find(c=>c.id===want)||(window.matchMedia('(max-width:760px)').matches?null:CH[0]);
  if(first)openChan(first.id);
  setInterval(()=>{if(!document.hidden)tick();},8000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
}
async function loadChans(first){
  try{CH=await DH.rpc('mensajes_canales');}catch(e){showErr(tr('Could not load channels. Try again. / No se pudieron cargar los canales. Intenta de nuevo.'));return;}
  renderChans();
  if(first&&!CH.length)$('msgs').innerHTML='<div class="empty">'+esc(tr('You are not in any channel yet. / Todavía no estás en ningún canal.'))+'</div>';
}
function renderChans(){
  $('chans').innerHTML=CH.map(c=>`<button class="chan ${c.id===CUR?'on':''}" onclick="openChan('${c.id}')"><span class="n" data-no-i18n>${esc(tr(c.nombre))}<small>${esc(tr(c.descripcion||''))}</small></span>${c.sin_leer&&c.id!==CUR?`<span class="bdg">${c.sin_leer>99?'99+':c.sin_leer}</span>`:''}</button>`).join('');
}
async function openChan(id){
  CUR=id; DIR=dirCache(id); MEN=new Map(); closePop(); LAST=null; SEEN=new Set(); ASK=null; REPLY=null; CI={}; $('msgs').innerHTML=''; $('msgs').removeAttribute('data-day'); $('msgs').removeAttribute('data-who'); showErr('');
  $('app').classList.add('in-thread'); history.replaceState(null,'','#'+id);
  const c=CH.find(x=>x.id===id); if(c){c.sin_leer=0;}
  renderChans(); loadDir(); await fetchMsgs(true);
}
function back(){$('app').classList.remove('in-thread');CUR=null;history.replaceState(null,'',location.pathname);renderChans();loadChans();}
async function fetchMsgs(full){
  if(!CUR||BUSY)return; BUSY=true; const id=CUR;
  try{
    const r=await DH.rpc('mensajes_listar',{p_canal:id,p_despues:full?null:LAST});
    if(id!==CUR)return;
    if(r.error){showErr(tr('You cannot open this channel. / No puedes abrir este canal.'));return;}
    showErr('');
    $('t-name').textContent=tr(r.canal.nombre); $('t-desc').textContent=tr(r.canal.descripcion||'');
    CI=r.canal; applyComposer();
    const box=$('msgs'), near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
    if(full){box.innerHTML='';box.removeAttribute('data-day');box.removeAttribute('data-who');SEEN=new Set();}
    const fresh=(r.items||[]).filter(m=>!SEEN.has(m.id)); fresh.forEach(m=>SEEN.add(m.id));
    if(r.items&&r.items.length)LAST=r.items[r.items.length-1].t;
    if(full&&!(r.items||[]).length)box.innerHTML='<div class="empty">'+esc(tr('No messages yet. Say hello. / Aún no hay mensajes. Saluda al equipo.'))+'</div>';
    if(fresh.length){const e=box.querySelector('.empty');if(e)e.remove();appendMsgs(fresh);}
    renderRx(r.reacciones||{});
    if(full||near)box.scrollTop=box.scrollHeight;
  }catch(e){ if(full)showErr(tr('Could not load messages. / No se pudieron cargar los mensajes.')); }
  finally{BUSY=false;}
}
function body(m){
  let h=esc(m.cuerpo);
  (m.menciones||[]).forEach(n=>{const e=esc('@'+n);h=h.split(e).join('<span class="mt">'+e+'</span>');});
  return h;
}
function appendMsgs(list){
  const box=$('msgs'); let lastDay=box.getAttribute('data-day')||'', lastWho=box.getAttribute('data-who')||'';
  list.forEach(m=>{
    const dk=dayKey(m.t);
    if(dk!==lastDay){box.insertAdjacentHTML('beforeend',`<div class="day" data-no-i18n>${esc(dayLabel(m.t))}</div>`);lastDay=dk;lastWho='';}
    const who=m.mio?'me':m.autor;
    box.insertAdjacentHTML('beforeend',`<div class="m ${m.mio?'me':''} ${m.mencionado?'mn':''}" id="m-${m.id}">${!m.mio?`<div class="who" data-no-i18n>${esc(m.autor)}</div>`:''}${m.responde?`<div class="qt" data-no-i18n onclick="jumpTo('${m.responde.id}')"><b>↩ ${esc(m.responde.autor)}</b> ${m.responde.borrado?esc(tr('(deleted) / (borrado)')):esc(m.responde.cuerpo)}</div>`:''}<div class="b ${CI.plantillas?flashCls(m.cuerpo):''}" data-no-i18n>${body(m)}</div><div class="rx" id="rx-${m.id}"></div><div class="meta"><span data-no-i18n>${tm(m.t)}</span><button class="rxadd" onclick="togPk('${m.id}')" aria-label="React">☺+</button>${CI.puede_responder?`<button class="rp" data-id="${m.id}" onclick="setReply(this.dataset.id)">${esc(tr('Reply / Responder'))}</button>`:''}${m.puede_borrar?`<button class="del" onclick="del('${m.id}',this)">Delete / Borrar</button>`:''}</div><div class="pk hide" id="pk-${m.id}">${EMO.map(e=>`<button onclick="react('${m.id}','${e}')" aria-label="${e}">${e}</button>`).join('')}</div></div>`);
    lastWho=who;
  });
  box.setAttribute('data-day',lastDay); box.setAttribute('data-who',lastWho);
}

const EMO=['👍','❤️','😂','😮','🙏','✅'];
function rxHTML(id,arr){return (arr||[]).map(r=>`<button class="rxc ${r.yo?'yo':''}" onclick="react('${id}','${r.e}')" aria-pressed="${!!r.yo}"><span>${r.e}</span><b>${r.n}</b></button>`).join('');}
function renderRx(map){document.querySelectorAll('#msgs .rx').forEach(el=>{const id=el.id.slice(3);el.innerHTML=rxHTML(id,map[id]);});}
function togPk(id){document.querySelectorAll('#msgs .pk').forEach(el=>{if(el.id!=='pk-'+id)el.classList.add('hide');});const e=$('pk-'+id);if(e)e.classList.toggle('hide');}
async function react(id,emo){
  const pk=$('pk-'+id);if(pk)pk.classList.add('hide');
  try{const r=await DH.rpc('mensaje_reaccionar',{p_id:id,p_emoji:emo});if(r&&r.ok){const el=$('rx-'+id);if(el)el.innerHTML=rxHTML(id,r.reacciones);}else showErr(tr('Could not react. / No se pudo reaccionar.'));}
  catch(e){showErr(tr('Could not react. / No se pudo reaccionar.'));}
}

const TPL=[['🔴','Out of stock / Agotado','🔴 Out of stock / Agotado: '],['🟢','New promo / Nueva promo','🟢 New promo / Nueva promo: '],['💲','Price change / Cambio de precio','💲 Price change / Cambio de precio: '],['⛔','Discontinued / Descontinuado','⛔ Discontinued / Descontinuado: '],['🚚','Delayed / Retraso','🚚 Delayed / Retraso: ']];
function flashCls(c){c=c||'';return c.startsWith('🔴')?'f1':c.startsWith('🟢')?'f2':c.startsWith('💲')?'f3':c.startsWith('⛔')?'f4':c.startsWith('🚚')?'f5':'';}
function applyComposer(){
  const w=!!CI.puede_escribir, canRep=!!CI.puede_responder, show=w||!!REPLY;
  $('comp').classList.toggle('hide',!show);
  const ro=$('ro');
  if(w||REPLY)ro.classList.add('hide');
  else{ro.textContent=tr(canRep?'Only the buying team posts here. Tap Reply under a message to answer. / Aquí solo publica el equipo de compras. Toca Responder bajo un mensaje para contestar.':'This channel is read-only. / Este canal es solo de lectura.');ro.classList.remove('hide');}
  const rb=$('rbar');
  if(REPLY){rb.classList.remove('hide');rb.innerHTML=`<span data-no-i18n>↩ ${esc(tr('Replying to / Respondiendo a'))} <b>${esc(REPLY.autor)}</b>: ${esc(REPLY.cuerpo)}</span><button onclick="clearReply()" aria-label="Cancel reply">✕</button>`;}
  else rb.classList.add('hide');
  const tp=$('tpl');
  if(CI.plantillas&&w&&!REPLY){tp.classList.remove('hide');tp.innerHTML=TPL.map((t,i)=>`<button type="button" onclick="useTpl(${i})" data-no-i18n>${t[0]} ${esc(tr(t[1]))}</button>`).join('');}
  else tp.classList.add('hide');
  $('adm').classList.toggle('hide',!CI.puede_admin);
  const d=$('t-desc'); d.textContent=tr(CI.descripcion||'')+(CI.retencion_dias?' · '+tr('Messages are deleted after '+CI.retencion_dias+' days. / Los mensajes se borran a los '+CI.retencion_dias+' días.'):'');
  $('txt').placeholder=REPLY?tr('Write your reply… / Escribe tu respuesta…'):tr('Write a message… / Escribe un mensaje…');
}
function useTpl(i){const t=$('txt');t.value=TPL[i][2];t.focus();t.setSelectionRange(t.value.length,t.value.length);}
function setReply(id){
  const el=$('m-'+id); if(!el)return;
  const au=el.classList.contains('me')?tr('yourself / ti mismo'):(el.querySelector('.who')||{}).textContent||'';
  REPLY={id,autor:au,cuerpo:(el.querySelector('.b')||{}).textContent.slice(0,80)};
  applyComposer(); $('txt').focus();
}
function clearReply(){REPLY=null;applyComposer();}
function jumpTo(id){const e=$('m-'+id);if(!e)return;e.scrollIntoView({block:'center',behavior:'smooth'});e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),1600);}
function closeDlg(){$('dlg').classList.remove('show');}
async function openPub(){
  let G;try{G=await DH.rpc('alertas_publicadores');}catch(e){return;}
  if(!G||G.error)return;
  $('dp').innerHTML=`<h2>${esc(tr('Who can post here / Quién puede publicar aquí'))}</h2><div class="sub">${esc(tr('Buyers and re-buyers. Everyone else can read, react and reply. / Buyers y re-buyers. Todos los demás pueden leer, reaccionar y responder.'))}</div>
  ${G.publicadores.map(g=>`<div class="who2"><span data-no-i18n>${esc(g.nombre)} <i>${esc(g.puesto||'')}${g.cuenta?'':' · '+esc(tr('no account yet / sin cuenta aún'))}</i></span><button class="btn2 d" data-r="${g.roster_id}" onclick="pubSet(this.dataset.r,false)">${esc(tr('Remove / Quitar'))}</button></div>`).join('')||`<div class="sub">${esc(tr('No one yet. / Nadie todavía.'))}</div>`}
  <select onchange="if(this.value)pubSet(this.value,true)"><option value="">${esc(tr('+ Add a person / + Agregar persona'))}</option>${G.personas.map(x=>`<option value="${x.id}">${esc(x.nombre)} — ${esc(x.puesto||'')}${x.cuenta?'':' ('+esc(tr('no account yet / sin cuenta aún'))+')'}</option>`).join('')}</select>
  <div style="margin-top:14px"><button class="btn2" onclick="closeDlg()">${esc(tr('Done / Listo'))}</button></div>`;
  $('dlg').classList.add('show');
}
async function pubSet(r,on){try{const x=await DH.rpc('alertas_publicador_set',{p_roster:r,p_on:on});if(x&&x.ok)openPub();}catch(e){}}
async function del(id,btn){
  if(ASK!==id){ASK=id;btn.classList.add('ask');btn.textContent=tr('Tap again to delete / Toca otra vez para borrar');setTimeout(()=>{if(ASK===id){ASK=null;btn.classList.remove('ask');btn.textContent=tr('Delete / Borrar');}},4000);return;}
  ASK=null;
  try{const r=await DH.rpc('mensaje_borrar',{p_id:id}); if(r&&r.ok){const e=$('m-'+id);if(e)e.remove();}else showErr(tr('Could not delete. / No se pudo borrar.'));}catch(e){showErr(tr('Could not delete. / No se pudo borrar.'));}
}
async function send(ev){
  if(ev)ev.preventDefault();
  const t=$('txt'), v=t.value.trim(); if(!v||!CUR)return false;
  const b=$('sendb'); b.disabled=true;
  try{
    const r=await DH.rpc('mensaje_enviar',{p_canal:CUR,p_cuerpo:v,p_responde_a:REPLY?REPLY.id:null,p_menciones:mentionIds(v)});
    if(r&&r.ok){t.value='';t.style.height='';MEN=new Map();closePop();REPLY=null;applyComposer();showErr('');await fetchMsgs(false);$('msgs').scrollTop=$('msgs').scrollHeight;}
    else showErr(r&&r.error==='slow_down'?tr('Slow down a little. / Más despacio.'):r&&r.error==='read_only'?tr('This channel is read-only. / Este canal es solo de lectura.'):tr('Could not send. / No se pudo enviar.'));
  }catch(e){showErr(tr('Could not send. Check your connection. / No se pudo enviar. Revisa tu conexión.'));}
  b.disabled=false; t.focus(); return false;
}

/* ---- @mentions ---- */
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function dirCache(c){try{const v=JSON.parse(localStorage.getItem('dh_dir_'+c)||'null');return Array.isArray(v)?v:[];}catch(e){return [];}}
let DIRLOAD=0;
async function loadDir(){
  if(!CUR)return; const c=CUR;
  try{
    const d=await DH.rpc('mensajes_directorio',{p_canal:c});
    if(c===CUR&&Array.isArray(d)){DIR=d;try{localStorage.setItem('dh_dir_'+c,JSON.stringify(d));}catch(e){}}
  }catch(e){}
  if(c===CUR&&!DIR.length)DIR=dirCache(c);
}
function mentionIds(v){const ids=[];MEN.forEach((id,name)=>{if(v.indexOf('@'+name)>=0)ids.push(id);});return ids;}
function closePop(){const p=$('mpop');if(p){p.classList.add('hide');p.innerHTML='';}PSEL=-1;PLIST=[];}
function popHTML(){return PLIST.map((p,i)=>`<button type="button" role="option" class="${i===PSEL?'on':''}" data-i="${i}" onmousedown="event.preventDefault()" onclick="pickMention(${i})" data-no-i18n>${esc(p.nombre)}<small>${esc([p.puesto,p.ubicacion].filter(Boolean).join(' · '))}</small></button>`).join('');}
function atQuery(){const t=$('txt'),pos=t.selectionStart,before=t.value.slice(0,pos);const m=before.match(/(?:^|\s)@([^\s@]*(?: [^\s@]*)?)$/);return m?{q:m[1],start:pos-m[1].length-1}:null;}
function updatePop(){
  const a=atQuery(); if(!a){closePop();return;}
  const p=$('mpop');
  if(!DIR.length){
    p.innerHTML='<button type="button" disabled data-no-i18n>'+esc(tr('Loading names… / Cargando nombres…'))+'</button>';p.classList.remove('hide');PLIST=[];
    if(!DIRLOAD){DIRLOAD=1;loadDir().then(()=>{DIRLOAD=0;updatePop();});}
    return;
  }
  const q=norm(a.q);
  PLIST=DIR.filter(x=>!q||norm(x.nombre).split(' ').some(w=>w.startsWith(q))||norm(x.nombre).startsWith(q)).slice(0,30);
  if(!PLIST.length){p.innerHTML='<button type="button" disabled data-no-i18n>'+esc(tr('No match. Only people with an account appear. / Sin coincidencias. Solo aparecen personas con cuenta.'))+'</button>';p.classList.remove('hide');PSEL=-1;return;}
  if(PSEL<0||PSEL>=PLIST.length)PSEL=0;
  p.innerHTML=popHTML();p.classList.remove('hide');
}
function pickMention(i){
  const p=PLIST[i]; if(!p)return; const a=atQuery(), t=$('txt'); if(!a)return;
  const after=t.value.slice(t.selectionStart), ins='@'+p.nombre+' ';
  t.value=t.value.slice(0,a.start)+ins+after; const pos=a.start+ins.length; t.setSelectionRange(pos,pos);
  MEN.set(p.nombre,p.id); closePop(); t.focus(); t.dispatchEvent(new Event('input'));
}
function openAt(){const t=$('txt'),pos=t.selectionStart,v=t.value,pre=(pos>0&&!/\s/.test(v[pos-1]))?' ':'';t.value=v.slice(0,pos)+pre+'@'+v.slice(pos);const np=pos+pre.length+1;t.setSelectionRange(np,np);t.focus();if(!DIR.length)loadDir().then(updatePop);else updatePop();}
$('txt').addEventListener('input',updatePop);
$('txt').addEventListener('keydown',e=>{
  const open=!$('mpop').classList.contains('hide');
  if(open&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();PSEL=(PSEL+(e.key==='ArrowDown'?1:-1)+PLIST.length)%PLIST.length;$('mpop').innerHTML=popHTML();const on=$('mpop').querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});}
  else if(open&&(e.key==='Enter'||e.key==='Tab')&&!e.isComposing){e.preventDefault();e.stopImmediatePropagation();pickMention(PSEL);}
  else if(open&&e.key==='Escape'){closePop();}
},true);
async function tick(){ await fetchMsgs(false); try{const n=await DH.rpc('mensajes_canales');CH=n;renderChans();}catch(e){} }
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}});
$('txt').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px';});
window.addEventListener('dh-lang',()=>{renderChans();if(CUR)fetchMsgs(true);});
init();
</script>
