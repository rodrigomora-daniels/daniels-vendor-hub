<svg xmlns="http://www.w3.org/2000/svg" width="260" height="290" viewBox="0 0 260 290"><defs><linearGradient id="shell" x2=".9" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#cddae9"/></linearGradient><radialGradient id="glow"><stop stop-color="#c3ffff"/><stop offset="1" stop-color="#00d9d9"/></radialGradient></defs><style>
.bob{animation:bob 3.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sh{transform-origin:130px 268px;animation:sh 3.4s ease-in-out infinite}@keyframes sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}
.antg{transform-origin:130px 51px;animation:ant 2.6s ease-in-out infinite}@keyframes ant{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.ball{transform-box:fill-box;transform-origin:center;animation:ball 1.8s ease-in-out infinite}@keyframes ball{0%,100%{transform:scale(1);opacity:.88}50%{transform:scale(1.2);opacity:1}}
.larm{transform-origin:86px 206px;animation:larm 3.4s ease-in-out infinite}@keyframes larm{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
.eyes{transform-origin:130px 112px;animation:blink 4.8s infinite}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bob,.sh,.antg,.ball,.larm,.eyes,.look,.warm,.mag,.d1,.d2,.d3{animation:none!important}}
.look{animation:ls 2.6s ease-in-out infinite}@keyframes ls{0%,100%{transform:translate(-8px,0)}50%{transform:translate(8px,0)}}
.mag{transform-origin:196px 160px;animation:mg 1.7s ease-in-out infinite}@keyframes mg{0%,100%{transform:rotate(-13deg) scale(1)}50%{transform:rotate(13deg) scale(1.08)}}
.warm{transform-origin:174px 205px;animation:wt 1.7s ease-in-out infinite}@keyframes wt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}</style><g class="sh"><ellipse cx="130" cy="268" rx="71" ry="9" fill="#193958" opacity=".12"/></g><g class="bob"><g class="antg"><path d="M130 51 L120 23" stroke="#22344e" stroke-width="12" stroke-linecap="round"/><g class="ball"><circle cx="118" cy="19" r="14" fill="url(#glow)"/></g></g><g class="larm"><path d="M86 206 Q60 205 51 231" stroke="#dbe5f1" stroke-width="25" stroke-linecap="round"/></g><g class="warm"><path d="M174 205 Q196 193 209 174" stroke="#dbe5f1" stroke-width="25" stroke-linecap="round"/></g><g class="larm"><circle cx="51" cy="233" r="14" fill="#22344e"/></g><g class="warm"><circle cx="210" cy="174" r="14" fill="#22344e"/></g><rect x="79" y="177" width="102" height="82" rx="42" fill="url(#shell)" stroke="#c4d1e0" stroke-width="2"/><ellipse cx="105" cy="259" rx="18" ry="15" fill="#22344e"/><ellipse cx="155" cy="259" rx="18" ry="15" fill="#22344e"/><text x="130" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="#0b2d5c">D</text><rect x="40" y="54" width="180" height="126" rx="58" fill="url(#shell)" stroke="#c4d1e0" stroke-width="2"/><rect x="58" y="72" width="144" height="91" rx="39" fill="#111f34"/><rect x="32" y="103" width="21" height="45" rx="10" fill="#183b58" stroke="#13d5d7" stroke-width="5"/><rect x="207" y="103" width="21" height="45" rx="10" fill="#183b58" stroke="#13d5d7" stroke-width="5"/><g class="look"><g class="eyes"><path d="M91 116 Q103 94 115 116 M145 116 Q157 94 169 116" fill="none" stroke="#9cfff7" stroke-width="9" stroke-linecap="round"/></g></g><g class="mag"><circle cx="185" cy="151" r="22" fill="none" stroke="#14cfd2" stroke-width="8"/><path d="M201 167 l20 20" stroke="#14cfd2" stroke-width="9" stroke-linecap="round"/></g></g></svg>