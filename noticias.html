<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>My Workspace — News / Noticias</title>
<style>
  :root{--navy:#1B3A6B;--gold:#C8922A;--lt:#D6E4F7;--gray:#6B6B6B;--red:#C0392B;--green:#2E7D32}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f0f2f5;color:#3c3c3c}
  header{background:var(--navy);border-bottom:4px solid var(--gold);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;color:#fff}
  header h1{font-size:18px} header a{color:var(--lt);font-size:13px;text-decoration:none}
  main{max-width:820px;margin:20px auto;padding:0 16px 60px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:9px 16px;border-radius:20px;border:1px solid #ccc;background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:#444}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .post{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
  .post img{width:100%;max-height:420px;object-fit:cover;display:block;cursor:pointer}
  .post .in{padding:16px 18px} .post h2{color:var(--navy);font-size:18px;margin-bottom:4px}
  .post .by{font-size:12px;color:var(--gray);margin-bottom:10px}
  .post .body{font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--lt);color:var(--navy);font-weight:700;margin-right:4px}
  .tag.pin{background:#fdf1d8;color:#7a5b00} .tag.off{background:#eee;color:#777} .tag.warn{background:#fff3cd;color:#7a5b00}
  .btn{padding:8px 14px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;display:inline-block}
  .btn.ghost{background:#fff;border:1px solid #ccc;color:#333} .btn.sm{padding:5px 10px;font-size:12px} .btn[disabled]{opacity:.5;cursor:wait}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
  label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:8px 0 3px}
  input,select,textarea{font:inherit;font-size:13px;padding:8px 10px;border:1px solid #ccc;border-radius:8px;width:100%}
  textarea{min-height:140px;resize:vertical} input[type=checkbox]{width:auto}
  .row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1;min-width:150px}
  .hide{display:none} .msg{padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px;background:#fdecea;color:var(--red)}
  .msg.ok{background:#e3f4e5;color:var(--green)}
  .empty{background:#fff;border-radius:12px;padding:24px;text-align:center;color:var(--gray)}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column}
  #lb.hide{display:none}
  #lb .bar{display:flex;justify-content:flex-end;padding:10px 16px} #lb .bar button{background:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
  #lb .stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center} #lb img{max-width:100%;height:auto;touch-action:pinch-zoom}
</style>
</head>
<body>
<header><h1>📰 News / Noticias</h1><a href="index.html">← Home / Inicio</a></header>
<main>
  <div id="msg" class="msg hide"></div>
  <div class="tabs" id="tabs"></div>
  <div id="pubbar" class="hide" style="margin-bottom:12px"><button class="btn" onclick="edit(null)">+ New post / Nueva noticia</button></div>
  <div id="edit" class="card hide"></div>
  <div id="list"></div>
  <div id="perm" class="card hide" style="margin-top:20px"></div>
</main>
<div id="lb" class="hide"><div class="bar"><button onclick="closeLb()">Close / Cerrar ✕</button></div><div class="stage"><img id="lbi" alt=""></div></div>
<script src="dh-session.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null, URLS={}, TAB='vigente';
const TABS=[['vigente','Latest / Recientes'],['programada','Scheduled / Programadas'],['vencida','Expired / Vencidas'],['oculta','Hidden / Ocultas']];
const ROLES=['vendedor','staff','manager','director'];
function err(t){const m=$('msg');m.textContent=t;m.className='msg';}
function ok(t){const m=$('msg');m.textContent=t;m.className='msg ok';setTimeout(()=>m.classList.add('hide'),4000);}
function fmt(d){if(!d)return '';const[y,m,dd]=d.split('-');return `${m}/${dd}/${y}`;}

async function init(){
  if(!DH.token()){location.href='index.html';return;}
  await load();
}
async function load(){
  try{D=await DH.rpc('noticias_listar');}catch(e){err('Could not load news. / No se pudieron cargar las noticias.');return;}
  try{URLS=await DH.files.sign((D.items||[]).map(i=>i.imagen_archivo_id));}catch(e){URLS={};}
  $('pubbar').classList.toggle('hide',!D.puede_publicar);
  render();
}
function render(){
  const counts={};(D.items||[]).forEach(i=>counts[i.estado]=(counts[i.estado]||0)+1);
  const tabs=TABS.filter(t=>t[0]==='vigente'||D.puede_publicar);
  $('tabs').innerHTML=tabs.length>1?tabs.map(t=>`<button class="tab ${t[0]===TAB?'on':''}" onclick="TAB='${t[0]}';render()">${t[1]}${counts[t[0]]?' ('+counts[t[0]]+')':''}</button>`).join(''):'';
  const items=(D.items||[]).filter(i=>i.estado===TAB);
  if(!items.length){$('list').innerHTML='<div class="empty">No news yet. / Todavía no hay noticias.</div>';return;}
  $('list').innerHTML=items.map(n=>{
    const u=n.imagen_archivo_id&&URLS[n.imagen_archivo_id];
    return `<div class="post">${u?`<img loading="lazy" src="${esc(u.url)}" alt="" onclick="zoom('${n.id}')">`:''}<div class="in">
      <div>${n.fijada?'<span class="tag pin">📌 Pinned</span>':''}${n.estado==='programada'?'<span class="tag warn">Scheduled</span>':''}${n.estado==='vencida'?'<span class="tag off">Expired</span>':''}${n.estado==='oculta'?'<span class="tag off">Hidden</span>':''}${n.roles?`<span class="tag">${esc(n.roles.join(', '))}</span>`:''}</div>
      <h2>${esc(n.titulo)}</h2><div class="by">${fmt(n.publicada_en)}${n.autor?' · '+esc(n.autor):''}${n.expira_en?' · until '+fmt(n.expira_en):''}</div>
      <div class="body">${esc(n.cuerpo)}</div>
      ${D.puede_publicar?`<div style="margin-top:12px"><button class="btn ghost sm" onclick="edit('${n.id}')">Edit</button></div>`:''}</div></div>`;
  }).join('');
}
function zoom(id){const n=D.items.find(x=>x.id===id),u=URLS[n.imagen_archivo_id];if(!u)return;$('lbi').src=u.url;$('lb').classList.remove('hide');document.body.style.overflow='hidden';}
function closeLb(){$('lb').classList.add('hide');$('lbi').src='';document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});

function edit(id){
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
  const n=id?D.items.find(x=>x.id===id):{titulo:'',cuerpo:'',publicada_en:today,expira_en:'',roles:null,fijada:false,activo:true};
  const roles=n.roles||[], all=!n.roles, e=$('edit'); e.classList.remove('hide');
  e.innerHTML=`<h2 style="color:var(--navy);font-size:16px">${id?'Edit':'New'} post / ${id?'Editar':'Nueva'} noticia</h2>
   <label>Title / Título</label><input id="f-t" value="${esc(n.titulo)}">
   <label>Text / Texto</label><textarea id="f-b">${esc(n.cuerpo)}</textarea>
   <label>Photo (optional) / Foto (opcional) ${n.imagen_archivo_id?'— current photo kept if empty / se conserva la actual si lo dejas vacío':''}</label><input id="f-f" type="file" accept="image/jpeg,image/png,image/webp">
   ${n.imagen_archivo_id?'<label style="font-weight:400"><input type="checkbox" id="f-rm"> Remove current photo / Quitar la foto actual</label>':''}
   <div class="row"><div><label>Publish on / Publicar el</label><input id="f-s" type="date" value="${esc(n.publicada_en||'')}"></div>
   <div><label>Expires (optional) / Vence (opcional)</label><input id="f-e" type="date" value="${esc(n.expira_en||'')}"></div></div>
   <label>Who sees it / Quién lo ve</label>
   <div class="row"><label style="font-weight:400"><input type="checkbox" id="f-all" ${all?'checked':''}> Everyone / Todos</label>
   ${ROLES.map(x=>`<label style="font-weight:400"><input type="checkbox" class="f-r" value="${x}" ${roles.includes(x)?'checked':''}> ${x}</label>`).join('')}</div>
   <div class="row"><label style="font-weight:400"><input type="checkbox" id="f-p" ${n.fijada?'checked':''}> 📌 Pin to top / Fijar arriba</label>
   <label style="font-weight:400"><input type="checkbox" id="f-a" ${n.activo?'checked':''}> Visible</label></div>
   <div style="margin-top:12px"><button class="btn" id="f-save" onclick="save('${id||''}')">Save / Guardar</button> <button class="btn ghost" onclick="$('edit').classList.add('hide')">Cancel</button></div>`;
  e.scrollIntoView({behavior:'smooth'});
}
async function save(id){
  const btn=$('f-save'), file=$('f-f').files[0], cur=id?D.items.find(x=>x.id===id):null;
  if(!$('f-t').value.trim()){err('Title is required. / Falta el título.');return;}
  const sel=[...document.querySelectorAll('.f-r:checked')].map(x=>x.value);
  const roles=$('f-all').checked||!sel.length?null:sel;
  btn.disabled=true; btn.textContent='Saving… / Guardando…';
  try{
    let img=cur?cur.imagen_archivo_id:null;
    if($('f-rm')&&$('f-rm').checked)img=null;
    if(file)img=await DH.files.upload('noticia',file);
    const r=await DH.rpc('admin_noticia_guardar',{p_id:id||null,p_titulo:$('f-t').value,p_cuerpo:$('f-b').value,p_imagen:img,p_roles:roles,p_fijada:$('f-p').checked,p_publicada:$('f-s').value||null,p_expira:$('f-e').value||null,p_activo:$('f-a').checked});
    if(r.error){err(r.detalle||r.error);btn.disabled=false;btn.textContent='Save / Guardar';return;}
    $('edit').classList.add('hide'); ok('Saved. / Guardado.'); await load();
  }catch(e){err(e.message||'Could not save.');btn.disabled=false;btn.textContent='Save / Guardar';}
}

async function loadPerm(){
  if(!D||!D.puede_permisos)return;
  let P; try{P=await DH.rpc('permiso_publicadores',{p_permiso:'noticias'});}catch(e){return;}
  if(!P||P.error)return;
  const ids=new Set(P.publicadores.map(x=>x.id));
  $('perm').classList.remove('hide');
  $('perm').innerHTML=`<h2 style="color:var(--navy);font-size:15px">Who can post news / Quién puede publicar noticias</h2>
   <p style="font-size:12px;color:var(--gray);margin:6px 0 10px">Super admins and Rey can always post. Everyone else sees news read-only. / Super admins y Rey siempre pueden. El resto solo lee.</p>
   ${P.publicadores.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee"><span>${esc(x.nombre)} <small style="color:var(--gray)">${esc(x.employee_id||'')}</small></span><button class="btn ghost sm" onclick="setPerm('${x.id}',false)">Remove</button></div>`).join('')||'<small>No one added yet. / Nadie agregado todavía.</small>'}
   <div class="row" style="margin-top:12px"><select id="p-sel"><option value="">Add person… / Agregar persona…</option>${P.empleados.filter(x=>!ids.has(x.id)).map(x=>`<option value="${x.id}">${esc(x.nombre)} (${esc(x.employee_id||'')})</option>`).join('')}</select><button class="btn" style="flex:0" onclick="setPerm($('p-sel').value,true)">Add</button></div>`;
}
async function setPerm(id,on){
  if(!id)return;
  try{const r=await DH.rpc('admin_permiso_set',{p_empleado_id:id,p_permiso:'noticias',p_on:on});if(r.error){err(r.error);return;}await loadPerm();}catch(e){err(e.message);}
}
init().then(loadPerm);
</script>
</body>
</html>
