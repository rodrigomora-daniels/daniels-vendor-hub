<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"><script src="dh-phone.js"></script><link rel="stylesheet" href="dh-mobile.css">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B3A6B">
<title>My Workspace — IT tickets / Tickets de TI</title>
<style>
  :root{--navy:#1B3A6B;--gold:#C8922A;--lt:#D6E4F7;--ink:#1E2735;--gray:#6B6B6B;--red:#C0392B;--green:#2E7D32}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F6;color:var(--ink)}
  header{background:var(--navy);border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff}
  header h1{font-size:18px} header a{color:var(--lt);font-size:13px;text-decoration:none}
  main{max-width:900px;margin:0 auto;padding:16px 14px 70px}
  h2{font:700 16px 'Segoe UI',Arial,sans-serif;color:var(--navy);margin:20px 2px 8px}
  .card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 0 #dfe5ee,0 10px 26px -22px rgba(18,40,74,.5);margin-bottom:12px}
  .step{font-weight:700;color:var(--navy);font-size:14px;margin:12px 0 6px}
  .step:first-child{margin-top:0}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .opt{border:2px solid #cfd6e2;background:#fff;border-radius:12px;min-height:64px;padding:8px;font:600 14px 'Segoe UI',Arial,sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
  .opt .i{font-size:22px}
  .opt.on{border-color:var(--navy);background:#E9F0FB;color:var(--navy)}
  .opt.bad.on{border-color:var(--red);background:#FDECEA;color:var(--red)}
  .opts.two{grid-template-columns:1fr 1fr 1fr}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid #cfd6e2;border-radius:10px;min-height:44px;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{border:0;background:var(--navy);color:#fff;border-radius:10px;min-height:48px;padding:0 20px;font:700 16px 'Segoe UI',Arial,sans-serif;cursor:pointer}
  .btn.alt{background:#fff;color:var(--navy);border:1px solid #cfd6e2}
  .btn.ok{background:var(--green)} .btn.warn{background:var(--red)}
  .btn.sm{min-height:44px;font-size:14px;padding:0 14px}
  .btn[disabled]{opacity:.5}
  .err{background:#fdecea;color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.45}
  .okm{background:#e3f4e5;color:var(--green)}
.xc{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:60;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:#12284A;color:#fff;font:700 14px 'Segoe UI',Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}.xc:focus-visible{outline:2px solid #C8922A;outline-offset:2px}
  .hide,.ov.hide{display:none!important}
  .pri{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px}.pri-urgente{background:#fdecea;color:#c0392b}.pri-alta{background:#fff1dc;color:#b86e00}.pri-normal{background:#e8f0fb;color:#1B3A6B}.pri-baja{background:#eee;color:#666}
  .cfgr{display:flex;gap:8px;margin:6px 0;align-items:center}.cfgr input{flex:1}.cfge span{flex:0 0 auto;max-width:42%}.cfge2{display:grid;gap:8px;margin:8px 0}
  .small{font-size:12px;color:var(--gray);margin-top:8px}
  .due{font-size:12px;font-weight:600;color:#1B3A6B}.due.late{color:#c0392b}
  .tk{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:6px solid #5B9BE0;box-shadow:0 1px 0 #dfe5ee;cursor:pointer}
  .tk.abierto{border-left-color:var(--red)} .tk.en_proceso{border-left-color:#E8A317} .tk.resuelto{border-left-color:#2E9E4A} .tk.cerrado{border-left-color:#9aa3b0;opacity:.85}
  .tk .t1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tk .t1 b{font-size:15px}
  .tk .t2{font-size:13.5px;color:#46505f;margin-top:4px;overflow-wrap:anywhere}
  .tk .t3{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .pill{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .p-abierto{background:#fdecea;color:var(--red)}.p-en_proceso{background:#fff1d6;color:#8a5a00}.p-resuelto{background:#e3f4e5;color:var(--green)}.p-cerrado{background:#eceff3;color:#6b7482}
  .dur{font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy);font-size:13px}
  .empty{color:var(--gray);padding:14px 2px;font-size:14px}
  .ov{position:fixed;inset:0;background:rgba(15,25,45,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
  .md{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:16px}
  .md h3{font-size:17px;color:var(--navy);margin-bottom:6px}
  .tl{margin:10px 0;border-left:2px solid #dfe5ee;padding-left:12px}
  .tl div{font-size:13.5px;margin-bottom:8px;overflow-wrap:anywhere}
  .tl small{color:var(--gray);display:block}
  .md.wide{max-width:880px}
  .st h3{font:700 19px Georgia,serif;color:var(--navy)}
  .st .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
  .st .kt{background:#fff;border-left:5px solid var(--gold);border-radius:6px;padding:10px 12px;box-shadow:0 10px 24px -20px rgba(18,40,74,.7);border-top:1px solid #eef1f6;border-right:1px solid #eef1f6;border-bottom:1px solid #eef1f6}
  .st .kt b{display:block;font:700 22px Georgia,serif;color:var(--navy)}
  .st .kt span{font-size:12px;color:var(--gray)}
  .st .sec{background:#fff;border-left:5px solid var(--navy);border-radius:6px;padding:10px 12px;margin:10px 0;border-top:1px solid #eef1f6;border-right:1px solid #eef1f6;border-bottom:1px solid #eef1f6}
  .st .sec h4{font:700 14px Georgia,serif;color:var(--navy);margin:0 0 8px}
  .st .br{display:grid;grid-template-columns:minmax(90px,170px) 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
  .st .br i{display:block;height:12px;border-radius:3px;background:var(--navy)}
  .st .br i.g{background:var(--gold)}
  .st .br em{font-style:normal;color:var(--gray);text-align:right}
  .st .tr7{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:6px}
  .st .tr7 div{flex:1;background:var(--navy);border-radius:2px 2px 0 0;min-height:2px;position:relative}
  .st .tr7 div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap}
  @media print{body>header,body>main{display:none!important}.ov{position:static!important;background:#fff!important;padding:0!important;display:block!important}.xc,.noprint{display:none!important}.md{max-width:none!important;box-shadow:none!important}}

  .ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph .th{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#eef1f6;border:1px solid #dfe5ee;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--gray)}.ph .th img{width:100%;height:100%;object-fit:cover}.ph .th button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}.lb img{max-width:100%;max-height:70vh;display:block;margin:8px auto;border-radius:8px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
  .bar select{width:auto;min-height:40px;font-size:14px}
  .sp{flex:1}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}.opts.two{grid-template-columns:1fr}}
</style>
<meta name="dh-i18n" content="on">
<script src="dh-chrome.js" defer></script>
</head>
<body>
<header><h1>🛠 IT tickets / Tickets de TI</h1><a href="index.html">← Home / Inicio</a></header>
<main>
  <div id="rep" class="card hide"></div>
  <div class="bar"><h2 style="margin:0" id="lh">Tickets</h2><span class="sp"></span>
    <select id="flt" class="hide" onchange="render()" aria-label="Location / Ubicación"></select>
    <button class="btn alt sm hide" id="abtn" onclick="openAv()">📣 IT announcements / Avisos de TI</button>
    <button class="btn alt sm hide" id="cbtn" onclick="openCfg()">⚙ Setup / Configuración</button>
    <button class="btn alt sm hide" id="sbtn" onclick="openStats()">📊 Stats / Estadísticas</button>
    <button class="btn alt sm hide" id="rbtn" onclick="openRep()">⬇ Report / Reporte</button></div>
  <div id="list"></div>
</main>
<div class="ov hide" id="ov"><button type="button" class="xc" onclick="closeM()" aria-label="Close / Cerrar">✕ Close / Cerrar</button><div class="md" id="md" role="dialog" aria-modal="true"></div></div>
<script src="dh-session.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tr=s=>(window.DH&&DH.i18n)?DH.i18n.pick(s):s;
const LA='America/Los_Angeles';
const DEV={tablet:['📱','Tablet'],pos:['🧾','Register (POS) / Caja'],computer:['🖥️','Computer / Computadora'],printer:['🖨️','Printer / Impresora'],phone:['☎️','Phone / Teléfono'],network:['📶','Wi-Fi / Network / Red'],camera:['📷','Camera / Cámara'],infinityx:['♾️','Infinity X'],email:['✉️','Email / Correo'],password:['🔑','Password reset / Restablecer contraseña'],other:['🔧','Other / Otro']};
const PROB={sin_red:'No network / Sin red',no_funciona:'Not working / No funciona',otro:'Other / Otro'};
const EST={abierto:'Open / Abierto',en_proceso:'In progress / En proceso',resuelto:'Waiting confirmation / Esperando confirmación',cerrado:'Closed / Cerrado'};
const LOC=['Euclid / Anaheim','Cerritos','Chino','Warehouse / Almacén','Corporate'];
let CAT={admin:false,ubicaciones:[],equipos:[]};
const locs=()=>CAT.ubicaciones.length?CAT.ubicaciones.map(x=>x.nombre):LOC;
let D={admin:false,items:[]}, F={loc:'',dev:'',prob:'',since:'now',custom:'',fotos:[]}, OPEN=null, HOPEN=null;

function fmtDur(sec){sec=Math.max(0,Math.floor(sec));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);return d?d+'d '+h+'h':(h?h+'h '+m+'m':m+'m');}
function fmtDT(iso){return new Intl.DateTimeFormat('en-US',{timeZone:LA,month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit'}).format(new Date(iso)).replace(',','');}
function dayKey(d){return new Intl.DateTimeFormat('en-CA',{timeZone:LA}).format(d);}
function laToIso(s){const g=new Date(s+':00Z');const p={};new Intl.DateTimeFormat('en-US',{timeZone:LA,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(g).forEach(x=>p[x.type]=x.value);
  const wall=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);return new Date(g.getTime()-(wall-g.getTime())).toISOString();}
function sinceIso(){
  const n=Date.now();
  if(F.since==='now')return new Date(n).toISOString();
  if(F.since==='1h')return new Date(n-3600e3).toISOString();
  if(F.since==='morning')return laToIso(dayKey(new Date())+'T08:00');
  if(F.since==='yesterday')return laToIso(dayKey(new Date(n-864e5))+'T09:00');
  return F.custom?laToIso(F.custom):null;
}
function defLoc(){
  const L=locs(), pk=re=>L.find(x=>re.test(x.toLowerCase()))||L[L.length-1]||'';
  const t=(((window.DH&&DH.emp&&DH.emp())||{}).tienda||'').toLowerCase();
  if(t.includes('euclid')||t.includes('anaheim'))return pk(/euclid|anaheim/); if(t.includes('cerritos'))return pk(/cerritos/); if(t.includes('chino'))return pk(/chino/); if(t==='wh'||t.includes('warehouse'))return pk(/warehouse|almac/); return pk(/corporate/);
}
async function init(){
  if(!DH.token()){location.href='index.html';return;}
  HOPEN=(location.hash||'').slice(1)||null;
  try{CAT=await DH.rpc('tickets_catalogo_ver');}catch(e){}
  F.loc=defLoc(); await load();
  try{const a=await DH.rpc('it_avisos_listar'); if(a&&a.admin)$('abtn').classList.remove('hide');}catch(e){}
}
async function load(){
  try{D=await DH.rpc('tickets_listar');}
  catch(e){ if(e&&/403|PT403|Forbidden/i.test(String(e.status||"")+String(e.code||"")+String(e.message||""))){ $('rep').classList.add('hide'); $('list').innerHTML='<div class="empty">'+esc(tr('This section is for managers and above. / Esta sección es para gerentes en adelante.'))+'</div>'; return; } $('list').innerHTML='<div class="empty">'+esc(tr('Could not load tickets. Check your connection and try again. / No se pudieron cargar los tickets. Revisa tu conexión e intenta de nuevo.'))+'</div>'; return; }
  if(D.puede_reportar)buildRep(); else $('rep').classList.add('hide'); render();
  if(HOPEN){const id=HOPEN;HOPEN=null;if(D.items.some(x=>x.id===id))openTk(id);}
}

/* ---------- report form ---------- */
function buildRep(){
  const b=$('rep'); b.classList.remove('hide');
  const o=(map,key,cur,cls)=>Object.keys(map).map(k=>`<button type="button" class="opt ${cls||''}${cur===k?' on':''}" aria-pressed="${cur===k}" onclick="pick('${key}','${k}')">${Array.isArray(map[k])?`<span class="i">${map[k][0]}</span>${esc(tr(map[k][1]))}`:esc(tr(map[k]))}</button>`).join('');
  const SI={now:'Just now / Ahora',"1h":'1 hour ago / Hace 1 hora',morning:'This morning / Esta mañana',yesterday:'Yesterday / Ayer',custom:'Other time / Otra hora'};
  b.innerHTML=`<h2 style="margin:0 0 10px">${esc(tr('Report a problem / Reportar un problema'))}</h2>
   <div class="step">1. ${esc(tr('Where? / ¿Dónde?'))}</div>
   <select id="r-loc" onchange="F.loc=this.value;F.eq='';buildRep()" aria-label="Location / Ubicación">${locs().map(l=>`<option value="${esc(l)}" data-no-i18n${l===F.loc?' selected':''}>${esc(l)}</option>`).join('')}</select>
   <div class="step">2. ${esc(tr('Which device? / ¿Qué equipo?'))}</div>
   <div class="opts">${o(DEV,'dev',F.dev)}</div>
   ${(()=>{const eq=eqFor();return `<div style="margin-top:8px">${eq.length?`<label for="r-eq">${esc(tr('Which one? / ¿Cuál?'))}</label><select id="r-eq" onchange="eqSel()"><option value="">${esc(tr('Choose… / Elige…'))}</option>${eq.map(x=>`<option value="${esc(x.nombre)}" data-no-i18n${x.nombre===F.eq?' selected':''}>${esc(x.nombre)}</option>`).join('')}<option value="__o"${F.eq==='__o'?' selected':''}>${esc(tr('Other / not listed — type it / Otro / no está en la lista — escríbelo'))}</option></select>`:''}<div id="r-etw"${eq.length&&F.eq!=='__o'?' class="hide"':''}><label for="r-et">${esc(tr('Name or number (optional) / Nombre o número (opcional)'))}</label><input id="r-et" maxlength="60" placeholder="Register 2 / Caja 2"></div></div>`;})()}
   <div class="step">3. ${esc(tr("What's wrong? / ¿Qué pasa?"))}</div>
   <div class="opts two">${o(PROB,'prob',F.prob,'bad')}</div>
   <div class="step">4. ${esc(tr('Since when? / ¿Desde cuándo?'))}</div>
   <div class="opts" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${o(SI,'since',F.since)}</div>
   ${F.since==='custom'?`<div style="margin-top:8px"><input type="datetime-local" id="r-cu" value="${F.custom}" onchange="F.custom=this.value" aria-label="Start time (LA) / Hora de inicio (LA)"></div>`:''}
   <div class="step">5. ${esc(tr('Details (optional) / Detalles (opcional)'))}</div>
   <textarea id="r-det" maxlength="500"></textarea>
   <div class="step">6. ${esc(tr('Photos (optional, up to 3) / Fotos (opcional, hasta 3)'))}</div>
   <div class="ph" id="r-ph">${F.fotos.map((x,i)=>`<div class="th"><span>${esc(tr('Photo / Foto'))} ${i+1}</span><button type="button" aria-label="${esc(tr('Remove photo / Quitar foto'))}" onclick="rmPh(${i})">×</button></div>`).join('')}</div>
   ${F.fotos.length<3?`<div style="margin-top:8px"><input type="file" id="r-file" accept="image/*" multiple onchange="addPh(this)" aria-label="${esc(tr('Add photos / Agregar fotos'))}"></div>`:''}
   <div class="err hide" id="r-err" role="alert"></div>
   <div class="acts"><button class="btn" id="r-go" onclick="sendTk()">${esc(tr('Send to IT / Enviar a TI'))}</button></div>`;
}
const eqFor=()=>CAT.equipos.filter(x=>(!x.ubicacion||x.ubicacion.toLowerCase()===String(F.loc).toLowerCase())&&(!F.dev||x.dispositivo===F.dev)&&F.dev);
async function addPh(inp){
  const files=[...inp.files].slice(0,3-F.fotos.length); inp.value=''; if(!files.length)return;
  const b=$('r-go'); b.disabled=true; rerr(tr('Uploading photo… / Subiendo foto…'),true);
  try{
    for(const f of files){const id=await DH.files.upload('ticket',f);F.fotos.push({id:id,name:f.name});}
    const et=$('r-et')?$('r-et').value:'',dt=$('r-det').value; buildRep(); if($('r-et'))$('r-et').value=et; $('r-det').value=dt; rerr('');
  }catch(e){b.disabled=false;rerr(String(e&&e.message||tr('Could not upload the photo. / No se pudo subir la foto.')));return;}
  $('r-go').disabled=false;
}
function rmPh(i){const et=$('r-et')?$('r-et').value:'',dt=$('r-det').value;F.fotos.splice(i,1);buildRep();if($('r-et'))$('r-et').value=et;$('r-det').value=dt;}
function eqSel(){F.eq=$('r-eq').value;$('r-etw').classList.toggle('hide',F.eq!=='__o');}
function pick(k,v){const et=$('r-et')?$('r-et').value:'',dt=$('r-det')?$('r-det').value:'';F[k]=v;if(k==='dev')F.eq='';buildRep();$('r-et').value=et;$('r-det').value=dt;}
function rerr(t,ok){const e=$('r-err');e.textContent=t;e.className='err'+(ok?' okm':'')+(t?'':' hide');}
async function sendTk(){
  if(!F.dev||!F.prob){rerr(tr('Pick the device and what is wrong. / Elige el equipo y qué pasa.'));return;}
  const ini=sinceIso(); if(!ini){rerr(tr('Pick when it started. / Elige cuándo empezó.'));return;}
  const b=$('r-go'); b.disabled=true; rerr('');
  try{
    const r=await DH.rpc('ticket_crear',{p_datos:{ubicacion:F.loc,dispositivo:F.dev,etiqueta:($('r-eq')&&F.eq&&F.eq!=='__o')?F.eq:$('r-et').value,problema:F.prob,detalle:$('r-det').value,inicio:ini,fotos:F.fotos.map(x=>x.id)}});
    if(r&&r.ok){F.dev='';F.eq='';F.prob='';F.fotos=[];F.since='now';F.custom='';await load();rerr(tr('Sent. IT has been notified. / Enviado. TI ya recibió el aviso.')+' #'+r.numero,true);return;}
    rerr(tr(r&&r.error==='limit'?'You reached today\'s limit of 20 tickets. / Llegaste al límite de 20 tickets de hoy.':'Check the start time and try again. / Revisa la hora de inicio e intenta de nuevo.'));
  }catch(e){rerr(tr('Could not send. Check your connection. / No se pudo enviar. Revisa tu conexión.'));}
  b.disabled=false;
}

/* ---------- list ---------- */
const PRI={urgente:'Urgent / Urgente',alta:'High / Alta',normal:'Normal / Normal',baja:'Low / Baja'};
const priPill=t=>t.prioridad?`<span class="pri pri-${t.prioridad}">${esc(tr(PRI[t.prioridad]))}</span>`:'';
const dueTx=t=>{if(!t.vence_at||!(t.estado==='abierto'||t.estado==='en_proceso'))return '';const late=new Date(t.vence_at)<new Date();return `<span class="due${late?' late':''}">${late?'⚠ ':'🎯 '}${esc(tr(late?'Past due / Vencido':'Due / Meta'))} ${esc(fmtDT(t.vence_at))}</span>`;};
function card(t){
  const live=t.estado==='abierto'||t.estado==='en_proceso';
  const dur=live?(Date.now()-new Date(t.inicio).getTime())/1000:t.dur_seg;
  const d=DEV[t.dispositivo]||DEV.other;
  const can=D.admin||D.csv||t.mio;

function openRep(){
  const t=dayKey(new Date()), f=dayKey(new Date(Date.now()-30*864e5));
  $('md').innerHTML=`<h3>${esc(tr('Download report / Descargar reporte'))}</h3><div class="grid2"><div><label for="r-from">${esc(tr('From / Desde'))}</label><input type="date" id="r-from" value="${f}"></div><div><label for="r-to">${esc(tr('To / Hasta'))}</label><input type="date" id="r-to" value="${t}"></div></div>
   <div class="err hide" id="r-err2" role="alert"></div><div class="acts"><button class="btn" onclick="dlRep()">${esc(tr('Download CSV / Descargar CSV'))}</button><button class="btn alt" onclick="closeM()">${esc(tr('Close / Cerrar'))}</button></div>`;
  $('ov').classList.remove('hide');
}
const cc=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
async function dlRep(){
  const f=$('r-from').value,t=$('r-to').value,e=$('r-err2');
  if(!f||!t||t<f){e.textContent=tr('Pick a valid date range. / Elige un rango de fechas válido.');e.classList.remove('hide');return;}
  try{
    const r=await DH.rpc('tickets_reporte',{p_desde:f,p_hasta:t});
    if(!r||!r.ok){e.textContent=tr('The range is too long. / El rango es muy largo.');e.classList.remove('hide');return;}
    const head=['Ticket','Started (LA)','Location','Device','Name','Problem','Details','Reported by','Status','Resolved (LA)','Closed (LA)','Confirmed by reporter','Reopened','Downtime (minutes)'];
    const rows=r.rows.map(x=>[x.numero,fmtDT(x.inicio),x.ubicacion,DEV[x.dispositivo][1].split(' / ')[0],x.etiqueta,PROB[x.problema].split(' / ')[0],x.detalle,x.reporta,EST[x.estado].split(' / ')[0],x.resuelto_at?fmtDT(x.resuelto_at):'',x.cerrado_at?fmtDT(x.cerrado_at):'',x.confirmado==null?'':(x.confirmado?'Yes':'No'),x.reabierto,x.dur_min]);
    const txt='﻿'+[head.map(cc).join(',')].concat(rows.map(r=>r.map(cc).join(','))).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='it-tickets_'+f+'_'+t+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }catch(x){e.textContent=tr('Could not build the report. / No se pudo generar el reporte.');e.classList.remove('hide');}
}

   <div class="noprint" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px"><label for="st-r" style="margin:0">${esc(tr('Period / Periodo'))}</label>
   <select id="st-r" onchange="loadStats()" style="width:auto"><option value="7">${esc(tr('Last 7 days / Últimos 7 días'))}</option><option value="30" selected>${esc(tr('Last 30 days / Últimos 30 días'))}</option><option value="90">${esc(tr('Last 90 days / Últimos 90 días'))}</option><option value="365">${esc(tr('Last 12 months / Últimos 12 meses'))}</option></select></div>
   <div id="st-b"><p class="small">${esc(tr('Loading… / Cargando…'))}</p></div>
   <div class="acts noprint"><button class="btn sm" onclick="dlStat('sum')">⬇ ${esc(tr('Summary CSV / CSV resumen'))}</button><button class="btn alt sm" onclick="dlStat('det')">⬇ ${esc(tr('Detail CSV / CSV detalle'))}</button><button class="btn alt sm" onclick="window.print()">🖨 ${esc(tr('Print / Save PDF / Imprimir / Guardar PDF'))}</button><button class="btn alt sm" onclick="closeM()">${esc(tr('Close / Cerrar'))}</button></div>`;
  $('ov').classList.remove('hide'); loadStats();
}
const _cm=closeM; closeM=function(){const m=$('md');if(m)m.className='md';_cm();};
async function loadStats(){
  const n=parseInt($('st-r').value,10), t=dayKey(new Date()), f=dayKey(new Date(Date.now()-(n-1)*864e5));
  const b=$('st-b');
  try{
    const r=await DH.rpc('tickets_reporte',{p_desde:f,p_hasta:t});
    if(!r||!r.ok)throw 0;
    STAT={f:f,t:t,n:n,rows:r.rows}; renderStats();
  }catch(e){b.innerHTML='<div class="err">'+esc(tr('Could not build the statistics. / No se pudieron generar las estadísticas.'))+'</div>';}
}
const hrs=m=>m==null?'—':(m<90?Math.round(m)+' min':(m<2880?(m/60).toFixed(1)+' h':(m/1440).toFixed(1)+' d'));
const med=a=>{if(!a.length)return null;a=a.slice().sort((x,y)=>x-y);const k=a.length>>1;return a.length%2?a[k]:(a[k-1]+a[k])/2;};
function statCalc(rows){
  const tot=rows.length, res=rows.filter(x=>x.resuelto_at), rt=res.map(x=>(new Date(x.resuelto_at)-new Date(x.inicio))/60000).filter(x=>x>=0);
  const cl=rows.filter(x=>x.estado==='cerrado'), conf=cl.filter(x=>x.confirmado===true).length;
  const down=rows.reduce((a,x)=>a+(+x.dur_min||0),0), reo=rows.filter(x=>x.reabierto>0).length;
  const by=(fn)=>{const m={};rows.forEach(x=>{const k=fn(x);if(k==null||k==='')return;(m[k]=m[k]||{n:0,d:0});m[k].n++;m[k].d+=(+x.dur_min||0);});return Object.entries(m).sort((a,b)=>b[1].n-a[1].n||b[1].d-a[1].d);};
  return {tot,res:res.length,open:rows.filter(x=>x.estado==='abierto'||x.estado==='en_proceso').length,avg:rt.length?rt.reduce((a,x)=>a+x,0)/rt.length:null,med:med(rt),down,reo,conf,cl:cl.length,
    loc:by(x=>x.ubicacion),dev:by(x=>(DEV[x.dispositivo]||DEV.other)[1].split(' / ')[0]),prob:by(x=>PROB[x.problema]?PROB[x.problema].split(' / ')[0]:x.problema),eq:by(x=>x.etiqueta?((DEV[x.dispositivo]||DEV.other)[1].split(' / ')[0]+' · '+x.etiqueta):null).slice(0,6)};
}
function bars(list,fmtR,cls){const mx=Math.max(1,...list.map(x=>x[1].n));return list.length?list.map(x=>`<div class="br"><span data-no-i18n>${esc(x[0])}</span><i class="${cls||''}" style="width:${Math.max(3,Math.round(x[1].n/mx*100))}%"></i><em>${x[1].n}${fmtR?' · '+esc(hrs(x[1].d/x[1].n)):''}</em></div>`).join(''):`<p class="small">${esc(tr('No data. / Sin datos.'))}</p>`;}
function renderStats(){
  const S=STAT,c=statCalc(S.rows),b=$('st-b');
  if(!c.tot){b.innerHTML='<div class="empty" style="margin-top:12px">'+esc(tr('No tickets in this period. / No hay tickets en este periodo.'))+'</div>';return;}
  const weekly=S.n>45, bucket={};
  S.rows.forEach(x=>{const d=dayKey(new Date(x.inicio));let k=d;if(weekly){const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()-((dt.getDay()+6)%7));k=dayKey(dt);}bucket[k]=(bucket[k]||0)+1;});
  const ks=Object.keys(bucket).sort(), mx=Math.max(1,...ks.map(k=>bucket[k]));
  b.innerHTML=`<p class="small" style="margin:4px 0" data-no-i18n>${esc(S.f)} → ${esc(S.t)} (LA)</p>
   <div class="kp">
    <div class="kt"><b>${c.tot}</b><span>${esc(tr('Tickets reported / Tickets reportados'))}</span></div>
    <div class="kt"><b>${c.open}</b><span>${esc(tr('Still open / Aún abiertos'))}</span></div>
    <div class="kt"><b>${esc(hrs(c.med))}</b><span>${esc(tr('Typical time to fix (median) / Tiempo típico de solución (mediana)'))}</span></div>
    <div class="kt"><b>${esc(hrs(c.avg))}</b><span>${esc(tr('Average time to fix / Tiempo promedio de solución'))}</span></div>
    <div class="kt"><b>${esc(hrs(c.down))}</b><span>${esc(tr('Total downtime / Caída total'))}</span></div>
    <div class="kt"><b>${c.cl?Math.round(c.conf/c.cl*100)+'%':'—'}</b><span>${esc(tr('Confirmed fixed by reporter / Confirmados por quien reportó'))}</span></div>
    <div class="kt"><b>${c.reo}</b><span>${esc(tr('Reopened tickets / Tickets reabiertos'))}</span></div>
   </div>
   <div class="sec"><h4>${esc(tr(weekly?'Tickets per week / Tickets por semana':'Tickets per day / Tickets por día'))}</h4><div class="tr7" role="img" aria-label="${esc(tr('Tickets over time / Tickets en el tiempo'))}">${ks.map(k=>`<div style="height:${Math.round(bucket[k]/mx*100)}%" data-t="${esc(k)}: ${bucket[k]}"></div>`).join('')}</div></div>
   <div class="sec"><h4>${esc(tr('By location (tickets · average downtime) / Por ubicación (tickets · caída promedio)'))}</h4>${bars(c.loc,true)}</div>
   <div class="sec"><h4>${esc(tr('By device / Por equipo'))}</h4>${bars(c.dev,true,'g')}</div>
   <div class="sec"><h4>${esc(tr("What's wrong / Qué pasa"))}</h4>${bars(c.prob,true)}</div>
   <div class="sec"><h4>${esc(tr('Most repeated equipment / Equipos que más se repiten'))}</h4>${bars(c.eq,true,'g')}</div>`;
}
function dlStat(kind){
  if(!STAT)return; const S=STAT,c=statCalc(S.rows), nm='it-stats_'+S.f+'_'+S.t+'.csv';
  if(kind==='det'){
    const head=['Ticket','Started (LA)','Location','Device','Name','Problem','Details','Reported by','Status','Resolved (LA)','Closed (LA)','Confirmed by reporter','Reopened','Downtime (minutes)'];
    csvDownload('it-tickets_'+S.f+'_'+S.t+'.csv',head,S.rows.map(x=>[x.numero,fmtDT(x.inicio),x.ubicacion,DEV[x.dispositivo][1].split(' / ')[0],x.etiqueta,PROB[x.problema].split(' / ')[0],x.detalle,x.reporta,EST[x.estado].split(' / ')[0],x.resuelto_at?fmtDT(x.resuelto_at):'',x.cerrado_at?fmtDT(x.cerrado_at):'',x.confirmado==null?'':(x.confirmado?'Yes':'No'),x.reabierto,x.dur_min]));
    return;
  }
  const r=[['Period (LA)',S.f+' to '+S.t,'',''],['Tickets reported',c.tot,'',''],['Still open',c.open,'',''],['Median time to fix (minutes)',c.med==null?'':Math.round(c.med),'',''],['Average time to fix (minutes)',c.avg==null?'':Math.round(c.avg),'',''],['Total downtime (minutes)',c.down,'',''],['Confirmed fixed by reporter (%)',c.cl?Math.round(c.conf/c.cl*100):'','',''],['Reopened tickets',c.reo,'','']];
  const add=(t,l)=>{r.push(['','','','']);r.push([t,'Tickets','Avg downtime (minutes)','']);l.forEach(x=>r.push([x[0],x[1].n,Math.round(x[1].d/x[1].n),'']));};
  add('By location',c.loc);add('By device',c.dev);add('By problem',c.prob);add('Most repeated equipment',c.eq);
  csvDownload(nm,['Metric','Value','',''],r);
}
window.addEventListener('dh-lang',()=>{if($('ov').classList.contains('hide')){buildRep();render();}});
init();
</script>
