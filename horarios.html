<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="dh-phone.js"></script><link rel="stylesheet" href="dh-mobile.css">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B3A6B">
<title>My Workspace — Schedule / Horarios</title>
<style>
  :root{--navy:#1B3A6B;--rail:#12284A;--gold:#C8922A;--lt:#D6E4F7;--ink:#1E2735;--gray:#6B6B6B;--red:#C0392B;--ok:#2E7D32}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F6;color:var(--ink)}
  header{background:var(--navy);border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff}
  header h1{font-size:18px} header a{color:var(--lt);font-size:13px;text-decoration:none}
  main{max-width:1240px;margin:0 auto;padding:16px 14px 60px}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .hide{display:none!important}
  .btn{border:1px solid #c5ccd8;background:#fff;color:var(--navy);border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;min-height:44px}
  .btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.d{color:var(--red);border-color:#e3b3ad}
  .btn[disabled]{opacity:.5;cursor:wait}
  .stores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .stores button{border:1px solid #c5ccd8;background:#fff;border-radius:22px;padding:10px 18px;font-weight:700;font-size:15px;color:#444;min-height:44px}
  .stores button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .wk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .wk h2{font:700 clamp(22px,3.2vw,32px)/1.1 Georgia,'Times New Roman',serif;color:var(--rail);flex:1 1 260px;min-width:0}
  .wk h2 small{display:block;font:600 14px 'Segoe UI',Arial,sans-serif;color:var(--gray);margin-top:4px}
  .pill{display:inline-block;font:700 12px 'Segoe UI',Arial,sans-serif;border-radius:12px;padding:3px 10px;vertical-align:middle}
  .pill.draft{background:#FFF1D6;color:#8A5A00}.pill.pub{background:#E3F3E5;color:#1E6B24}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .banner{background:#fff;border-left:5px solid var(--gold);border-radius:6px;padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.5}
  .mine{background:var(--rail);color:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .mine h3{font:700 18px Georgia,'Times New Roman',serif;margin-bottom:10px}
  .mine .row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .mine .c{background:rgba(255,255,255,.08);border-radius:6px;padding:8px 6px;text-align:center;font-size:13px;line-height:1.35;min-height:62px}
  .mine .c b{display:block;font-size:12px;color:#E8C878;margin-bottom:3px}
  .mine .c.t{outline:2px solid var(--gold)}
  .mine .c.o{opacity:.55}
  .sc{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:auto;max-height:calc(100vh - 120px)}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;table-layout:fixed}
  th,td{border-bottom:1px solid #e3e7ee;border-right:1px solid #e3e7ee;padding:0;text-align:center;vertical-align:middle}
  th{background:var(--rail);color:#fff;padding:9px 4px;font-size:14px;line-height:1.25;position:sticky;top:0}
  th small{display:block;font-weight:400;color:#cfe0f7;font-size:12px}
  th.t{background:var(--gold);color:#12284A}th.t small{color:#12284A}
  th.nm,td.nm{width:170px;text-align:left;position:sticky;left:0;z-index:2}
  th.nm{z-index:4}
  td.nm{background:#fff;padding:8px 10px;font-weight:700;font-size:14px;color:var(--rail)}
  td.nm small{display:block;color:var(--gray);font-weight:600;font-size:12px}
  td.nm.me{background:#FFF6DD;box-shadow:inset 4px 0 0 var(--gold)}
  button.nm{all:unset;display:block;width:100%;cursor:pointer}
  .fe{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:3px}
  .fe span{font:700 10px 'Segoe UI',Arial,sans-serif;background:#FFE08A;color:#6B4A00;border-radius:8px;padding:1px 6px}
  .fe span.bf{background:#12284A;color:#FFD66B}
  td.c{height:70px}
  .cell{display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;min-height:70px;border:0;background:transparent;font-size:12.5px;line-height:1.4;color:#1E2735;padding:4px 2px;font-weight:600}
  .cell.off{font-weight:800;color:#444;font-size:14px}
  .cell.empty{color:#b3bac6;font-weight:400;font-size:20px}
  .cell.ro{cursor:default}
  td.me .cell{box-shadow:inset 0 0 0 2px var(--gold)}
  td.today .cell.off,td.today .cell.empty{background:#FFF9E8}
  tfoot td{background:#F4F6FA;font:700 16px Georgia,serif;color:var(--rail);padding:9px 4px}
  tfoot td.nm{font:600 13px 'Segoe UI',Arial,sans-serif}
  .addrow{padding:10px 12px;border-top:1px solid #e3e7ee}
  #hol{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:14px 16px;margin-bottom:14px}
  #hol .hh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  #hol h2{font:700 18px 'Segoe UI',Arial,sans-serif;color:var(--navy);margin:0}
    .hc-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
  .hc-d{flex:1 0 140px;border:1px solid #e3e7ee;border-radius:10px;padding:10px 12px;background:#fafbfd}
  .hc-d b{display:block;font-size:14.5px}
  .hc-d small{display:block;color:#6a7484;font-size:12.5px;margin:2px 0 7px}
  .hst{display:inline-block;border-radius:999px;padding:3px 11px;font:700 13px 'Segoe UI',Arial,sans-serif;border:1.5px solid currentColor}
  .hst.ON{color:#1E7B4B;background:#E4F3EA}.hst.OFF{color:#6a7484;background:#F0F2F6}.hst.ONCALL{color:#9A6A00;background:#FFF1CF}.hst.CLOSED{color:#B3402F;background:#FBE5E1}.hst.NA{color:#8a94a4;background:#fff;border-style:dashed}
  .dlg .p.wide{max-width:980px;overflow-x:auto}
  .dlg .p.wide .hn{font-size:13px;color:#5a6575;margin-bottom:12px;line-height:1.4}
  .dlg .p.wide table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
  .dlg .p.wide th,.dlg .p.wide td{padding:8px 10px;border-bottom:1px solid #eef0f4;text-align:center}
  .dlg .p.wide th:first-child,.dlg .p.wide td:first-child{text-align:left;position:sticky;left:0;background:#fff}
  .dlg .p.wide th small{display:block;font-weight:400;color:#6a7484}
  .dlg .p.wide tr.me td{background:#FFF8EC;font-weight:700}
  .dlg .p.wide tr.me td:first-child{box-shadow:inset 4px 0 0 var(--gold)}
  .tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
  .tabs button{border:1px solid #c5ccd8;background:#fff;color:var(--navy);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;min-height:44px;cursor:pointer}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  #holview .hn{font-size:13px;color:#5a6575;margin:4px 0 12px;line-height:1.4}
  #holview .tw{overflow:auto;max-height:calc(100vh - 150px);background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:0}
  #holview table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
  #holview th,#holview td{padding:8px 10px;border-bottom:1px solid #eef0f4;text-align:center}
  #holview th{position:sticky;top:0;z-index:2}
  #holview th:first-child,#holview td:first-child{text-align:left;position:sticky;left:0;background:#fff}
  #holview th:first-child{background:var(--rail);color:#fff;z-index:4}
  #holview td:first-child{z-index:1}
  #holview th small{display:block;font-weight:400;color:#6a7484}
  #holview button.ed{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:2px 4px;border-radius:6px;text-align:inherit}
  #holview button.ed:hover{background:#eef2fa}
  #holview button.cell{padding:2px}
  #holview small.cn{display:block;font-weight:400;font-size:12px;color:#5a6575;margin-top:4px;line-height:1.25;max-width:150px;margin-left:auto;margin-right:auto}
  #holview button.nm2{font-weight:600;text-align:left}
  #holview tr.me td{background:#FFF8EC;font-weight:700}
  #holview tr.me td:first-child{box-shadow:inset 4px 0 0 var(--gold)}
  .dlg{position:fixed;inset:0;background:rgba(10,22,45,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .dlg.show{display:flex}
  .dlg .p{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:20px 20px 22px}
  @media(min-width:700px){.dlg{align-items:center}.dlg .p{border-radius:12px}}
  .dlg h2{font:700 22px/1.2 Georgia,'Times New Roman',serif;color:var(--navy);margin:2px 0 4px}
  .dlg .sub{color:var(--gray);font-size:14px;margin-bottom:12px}
  .dlg label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
  .dlg input,.dlg select{font:inherit;font-size:16px;padding:10px;border:1px solid #c5ccd8;border-radius:8px;width:100%;min-height:46px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid #c5ccd8;background:#fff;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;min-height:44px;text-align:center;line-height:1.35}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .times{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .err{background:#fdecea;color:var(--red);border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
  .empty{background:#fff;border-radius:12px;padding:28px;text-align:center;color:var(--gray);line-height:1.6}
  .gs{border-top:1px solid #e3e7ee;padding:12px 0}.gs h3{font:700 17px Georgia,serif;color:var(--navy);margin-bottom:8px}.gs select{margin-top:8px}
  .who{display:inline-flex;align-items:center;gap:6px;background:#EEF3FB;border:1px solid #c9d7ee;border-radius:20px;padding:6px 6px 6px 12px;font-size:14px;font-weight:600}.who i{font-weight:400;color:var(--gray);font-size:12px}.who button{border:0;background:#fff;border-radius:50%;width:30px;height:30px;font-size:18px;color:var(--red)}
  .lst .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
  @media(max-width:700px){.wk h2{flex-basis:100%}.mine .row{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .hist .hr{padding:9px 0;border-bottom:1px solid #eef0f4}.hist .hw{font-size:12px;color:var(--gray)}.hist .hx{font-size:15px;line-height:1.4;margin-top:2px}
  @media print{header,.stores,.tools,.addrow,.dlg,.banner.noprint{display:none!important}body{background:#fff}.sc{box-shadow:none;overflow:visible}table{min-width:0}th{position:static}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<meta name="dh-i18n" content="on">
<script src="dh-chrome.js" defer></script>

<body>
<header><h1>🗓️ Schedule / Horarios</h1><a href="index.html">← Home / Inicio</a></header>
<main>
  <div class="tabs noprint" id="vtabs" role="tablist"><button class="on" id="tb-s" onclick="tab('s')">🗓️ Store schedule / Horario de tienda</button><button id="tb-h" onclick="tab('h')">🏢 Department schedule / Horario por departamento</button></div>
  <div id="storeview">
  <div class="stores hide" id="stores"></div>
  <div class="wk"><h2 id="wt" data-no-i18n></h2>
    <button class="btn" onclick="nav(-7)" aria-label="Previous week">◀</button>
    <button class="btn" onclick="nav(0)" id="thisb"></button>
    <button class="btn" onclick="nav(7)" aria-label="Next week">▶</button>
    <input type="date" id="jump" class="btn" style="min-height:44px;font:inherit;width:auto" aria-label="Go to date / Ir a fecha" title="Go to date / Ir a fecha" onchange="if(this.value){SEM=this.value;load();this.value='';}">
  </div>
  <div class="tools hide" id="tools"></div>
  <div id="view"><div class="empty" id="ld"></div></div>
  </div>
  <div id="holview" class="hide"></div>
</main>
<div class="dlg" id="dlg" onclick="if(event.target===this)closeDlg()" role="dialog" aria-modal="true"><div class="p" id="dp"></div></div>
<script src="dh-session.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tr=s=>(window.DH&&DH.i18n)?DH.i18n.pick(s):s;
const LA='America/Los_Angeles', L=()=>(DH.i18n&&DH.i18n.lang==='es')?'es-US':'en-US';
const todayS=()=>new Date().toLocaleDateString('en-CA',{timeZone:LA});
const addD=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const fd=(s,o)=>new Date(s+'T12:00:00Z').toLocaleDateString(L(),Object.assign({timeZone:'UTC'},o));
let S=null, TIENDA=null, SEM=null, BUSY=false, EDIT=null;
const PAL=['#DDF0DA','#F6D9EE','#FBE0CC','#D3E5FA','#E6E6E6','#FFE9A8','#CBE8C4','#E9D5F2','#BFE3F0','#F9D4D4'];
function hue(key){let h=0;for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;return PAL[h%PAL.length];}
function ft(t){const [h,m]=t.split(':').map(Number);const ap=h>=12?'p':'a';const h12=h%12===0?12:h%12;return m?h12+':'+String(m).padStart(2,'0')+ap:h12+ap;}
function shiftLines(t){return t.length===4?[ft(t[0])+'–'+ft(t[1]),ft(t[2])+'–'+ft(t[3])]:[ft(t[0])+'–'+ft(t[1])];}
const DAYN=()=>L()==='es-US'?['Mié','Jue','Vie','Sáb','Dom','Lun','Mar']:['Wed','Thu','Fri','Sat','Sun','Mon','Tue'];
function holidayBadge(f){return `<span class="${/black friday/i.test(f)?'bf':''}" data-no-i18n>${esc(/black friday/i.test(f)?'🔥 '+f:f)}</span>`;}

async function load(){
  try{S=await DH.rpc('horarios_ver',{p_tienda:TIENDA,p_semana:SEM});}
  catch(e){$('view').innerHTML='<div class="empty">'+esc(tr('Could not load the schedule. / No se pudo cargar el horario.'))+'</div>';return;}
  if(S&&S.tienda){TIENDA=S.tienda;SEM=S.semana;}
  render();
}
function nav(n){
  if(!S||!S.semana)return;
  if(n===0){SEM=null;}else{SEM=addD(S.semana,n);}
  load();
}
function render(){
  $('thisb').textContent=tr('This week / Esta semana');
  if(!S||!(S.tiendas||[]).length){
    $('stores').classList.add('hide');$('tools').classList.add('hide');$('wt').textContent='';
    $('view').innerHTML='<div class="empty">'+esc(tr('No schedule available for your location yet. / Aún no hay horario para tu ubicación.'))+'</div>';return;}
  const st=$('stores');
  if(S.tiendas.length>1){st.classList.remove('hide');st.innerHTML=S.tiendas.map(t=>`<button class="${t===S.tienda?'on':''}" data-no-i18n data-t="${esc(t)}" onclick="pickStore(this.dataset.t)">${esc(t)}</button>`).join('');}else st.classList.add('hide');
  const end=addD(S.semana,6);
  $('wt').innerHTML=`${esc(fd(S.semana,{month:'short',day:'numeric'}))} – ${esc(fd(end,{month:'short',day:'numeric',year:'numeric'}))} ${S.puede_editar?`<span class="pill ${S.publicado?'pub':'draft'}">${esc(tr(S.publicado?'Published / Publicado':'Draft / Borrador'))}</span>`:''}<small>${esc(S.tienda)}</small>`;
  // tools
  const tl=$('tools');
  if(S.puede_editar||S.puede_gestores){
    tl.classList.remove('hide');
    tl.innerHTML=(S.puede_editar?`<button class="btn ${S.publicado?'':'g'}" onclick="publish(${!S.publicado})">${esc(tr(S.publicado?'Unpublish / Despublicar':'Publish for the team / Publicar para el equipo'))}</button>
      <button class="btn" onclick="copyPrev()">${esc(tr('Copy previous week / Copiar semana anterior'))}</button>
      <button class="btn" onclick="openImport()">${esc(tr('Upload Excel / Subir Excel'))}</button>
      <button class="btn" onclick="openHist()">${esc(tr('Change log / Historial de cambios'))}</button>`:'')
      +`<button class="btn" onclick="window.print()">${esc(tr('Print / Imprimir'))}</button>`
      +(S.puede_gestores?`<button class="btn" onclick="openGest()">${esc(tr('Who can edit / Quién puede editar'))}</button>`:'');
  }else{tl.classList.remove('hide');tl.innerHTML=`<button class="btn" onclick="window.print()">${esc(tr('Print / Imprimir'))}</button>`;}
  const rows=S.filas||[];
  if(!rows.length&&!S.puede_editar){
    $('view').innerHTML='<div class="empty">'+esc(tr(S.publicado?'Nothing scheduled this week. / No hay nada programado esta semana.':'This week’s schedule is not published yet. Ask your manager. / El horario de esta semana aún no está publicado. Pregunta a tu gerente.'))+'</div>';return;}
  const T=todayS(), dn=DAYN(), days=S.dias;
  const mine=rows.find(r=>S.mi_roster_id&&r.roster_id===S.mi_roster_id);
  let h='';
  if(S.puede_editar&&!S.publicado)h+=`<div class="banner noprint"><b>${esc(tr('Draft. / Borrador.'))}</b> ${esc(tr('Only managers see it until you publish. Tap any cell to edit. / Solo los gerentes lo ven hasta que lo publiques. Toca cualquier celda para editar.'))}</div>`;
  if(mine){
    h+=`<div class="mine"><h3>${esc(tr('My week / Mi semana'))}</h3><div class="row">${days.map((d,i)=>{const c=(mine.celdas||{})[d.d];
      const body=!c?'—':c.libre?esc(tr('OFF / LIBRE')):shiftLines(c.t).map(esc).join('<br>');
      return `<div class="c ${d.d===T?'t':''} ${c&&c.libre?'o':''}"><b data-no-i18n>${esc(dn[i])} ${esc(fd(d.d,{day:'numeric'}))}</b>${body}</div>`;}).join('')}</div></div>`;
  }
  h+=`<div class="sc"><table><thead><tr><th class="nm">${esc(tr('Name / Nombre'))}</th>${days.map((d,i)=>`<th class="${d.d===T?'t':''}" data-no-i18n>${esc(dn[i])}<small>${esc(fd(d.d,{month:'short',day:'numeric'}))}</small>${(d.fiestas||[]).length?`<div class="fe">${d.fiestas.map(holidayBadge).join('')}</div>`:''}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{
    const me=mine&&mine.id===r.id;
    h+=`<tr><td class="nm ${me?'me':''}"><button class="nm" onclick="openPerson('${r.id}')" data-no-i18n>${esc(r.nombre)}${r.abrev?`<small>${esc(r.abrev)}</small>`:''}</button></td>`;
    days.forEach(d=>{
      const c=(r.celdas||{})[d.d], cls=(d.d===T?'today ':'')+(me?'me':'');
      let inner,sty='',cc='cell';
      if(!c){inner=S.puede_editar?'+':'';cc+=' empty';}
      else if(c.libre){inner=esc(tr('OFF / LIBRE'));cc+=' off';}
      else{inner=shiftLines(c.t).map(esc).join('<br>');sty=`background:${hue(c.t.join())}`;}
      h+=`<td class="c ${cls}">${S.puede_editar?`<button class="${cc}" style="${sty}" onclick="openCell('${r.id}','${d.d}')" data-no-i18n aria-label="${esc(r.nombre+' '+d.d)}">${inner}</button>`:`<div class="${cc} ro" style="${sty}" data-no-i18n>${inner}</div>`}</td>`;
    });
    h+='</tr>';
  });
  h+=`</tbody><tfoot><tr><td class="nm">${esc(tr('Working / Trabajando'))}</td>${days.map(d=>`<td data-no-i18n>${rows.filter(r=>{const c=(r.celdas||{})[d.d];return c&&!c.libre;}).length}</td>`).join('')}</tr></tfoot></table>`;
  if(S.puede_editar)h+=`<div class="addrow"><button class="btn" onclick="openRow(null)">${esc(tr('+ Add person / + Agregar persona'))}</button></div>`;
  h+='</div>';
  $('view').innerHTML=h;
}
function pickStore(t){TIENDA=t;SEM=S.semana;load();}

/* ---- dialogs ---- */

async function openHist(){
  showDlg(`<h2>${esc(tr('Change log / Historial de cambios'))}</h2><div class="sub">…</div>`);
  let r; try{r=await DH.rpc('horarios_historial',{p_tienda:TIENDA});}catch(e){r=null;}
  if(!r||r.error){showDlg(`<h2>${esc(tr('Change log / Historial de cambios'))}</h2><div class="sub">${esc(tr('Could not load. / No se pudo cargar.'))}</div><button class="btn" onclick="closeDlg()">${esc(tr('Close / Cerrar'))}</button>`);return;}
  const dt=t=>new Date(t).toLocaleString(DH.i18n&&DH.i18n.lang==='es'?'es-US':'en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

const pad=n=>String(n).padStart(2,'0');
function pdate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){const o=XLSX.SSF.parse_date_code(v);return o?o.y+'-'+pad(o.m)+'-'+pad(o.d):null;}
  const t=String(v).trim(); let m;
  if(m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/)){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(m[1])+'-'+pad(m[2]);}
  return null;
}
function ptime(v){
  if(v==null||String(v).trim()==='')return undefined;
  if(typeof v==='number'){const mins=Math.round((v%1)*1440);return pad(Math.floor(mins/60)%24)+':'+pad(mins%60);}
  const t=String(v).trim(); let m;
  if(m=t.match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m?\.?$/i)){let h=+m[1];const mi=+(m[2]||0);if(h<1||h>12||mi>59)return null;if(/p/i.test(m[3])&&h<12)h+=12;if(/a/i.test(m[3])&&h===12)h=0;return pad(h)+':'+pad(mi);}
  if(m=t.match(/^(\d{1,2}):(\d{2})$/)){const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return pad(h)+':'+pad(mi);}
  return null;
}

async function readImport(file){
  if(!file)return;
  const pre=$('imp-pre'), go=$('imp-go'); go.disabled=true; pre.innerHTML=''; $('f-e').classList.add('hide');
  try{await loadXL();}catch(e){errBox(tr('Could not load the Excel tool. Check your connection. / No se pudo cargar la herramienta de Excel. Revisa tu conexión.'));return;}
  let data;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];data=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});}
  catch(e){errBox(tr('That file could not be read. Use .xlsx, .xls or .csv. / No se pudo leer ese archivo. Usa .xlsx, .xls o .csv.'));return;}
  const rows=[], errs=[]; let start=0;
  if(data.length&&pdate(data[0][0])==null)start=1;
  for(let i=start;i<data.length;i++){
    const r=data[i], rn=i+1; if(!r||r.every(x=>x==null||String(x).trim()===''))continue;
    const d=pdate(r[0]), nm=r[1]==null?'':String(r[1]).trim();
    const ct=r.slice(2,6);
    if(ct.every(x=>x==null||String(x).trim==='' || String(x).trim()===''))continue; // empty shift = leave as is
    if(!d){errs.push([rn,tr('Date not understood / No se entiende la fecha')]);continue;}
    if(!nm){errs.push([rn,tr('Missing employee name / Falta el nombre del empleado')]);continue;}
    if(typeof r[2]==='string'&&/^(off|libre|day off)$/i.test(r[2].trim())){rows.push({dia:d,nombre:nm,libre:true,t:null});continue;}
    const p=ct.map(ptime);
    if(p.some(x=>x===null)){errs.push([rn,tr('A time is not understood / No se entiende una hora')]);continue;}
    const [a,b2,c2,f2]=p;
    if(a&&f2&&!b2&&!c2)rows.push({dia:d,nombre:nm,libre:false,t:[a,f2]});
    else if(a&&b2&&c2&&f2)rows.push({dia:d,nombre:nm,libre:false,t:[a,b2,c2,f2]});
    else errs.push([rn,tr('Fill In and Out, or all four times / Llena Entrada y Salida, o las cuatro horas')]);
  }
  IMP={rows,errs,ready:false,unk:[]};
  if(!rows.length&&!errs.length){errBox(tr('No shifts found in the file. / No se encontraron turnos en el archivo.'));return;}
  if(errs.length){pre.innerHTML=impErrs(errs);return;}
  let r;
  try{r=await DH.rpc('horarios_importar',{p_tienda:S.tienda,p_filas:rows,p_crear:false,p_publicar:false,p_aplicar:false});}
  catch(e){errBox(tr('Could not check the file. Try again. / No se pudo revisar el archivo. Intenta de nuevo.'));return;}
  if(r&&r.error){errBox(tr(r.error));return;}
  const bad=(r.errores||[]).map(e=>[e.fila,tr(e.msg)]);
  if(bad.length){pre.innerHTML=impErrs(bad);return;}
  IMP.unk=r.desconocidos||[]; IMP.ready=true;
  const ws=r.semanas||[], people=new Set(rows.map(x=>x.nombre.toLowerCase())).size;
  pre.innerHTML=`<div class="banner" style="margin-top:12px"><b>✓ ${rows.length} ${esc(tr('shifts ready / turnos listos'))}</b><br><span data-no-i18n>${esc(fd(ws[0],{month:'short',day:'numeric'}))} – ${esc(fd(addD(ws[ws.length-1],6),{month:'short',day:'numeric',year:'numeric'}))}</span> · ${ws.length} ${esc(tr('week(s) / semana(s)'))} · ${people} ${esc(tr('people / personas'))}</div>
  ${IMP.unk.length?`<label style="display:flex;gap:10px;align-items:flex-start;font-weight:600"><input type="checkbox" id="imp-new" style="width:auto;min-height:0;margin-top:3px" checked><span>${esc(tr('Add these names as new people in the schedule: / Agregar estos nombres como personas nuevas en el horario:'))} <b data-no-i18n>${esc(IMP.unk.join(', '))}</b></span></label>`:''}
  <label style="display:flex;gap:10px;align-items:flex-start;font-weight:600"><input type="checkbox" id="imp-pub" style="width:auto;min-height:0;margin-top:3px" checked><span>${esc(tr('Publish the uploaded weeks right away (the team sees them). / Publicar de inmediato las semanas subidas (el equipo las ve).'))}</span></label>`;
  go.disabled=false;
}

  if(!IMP||!IMP.ready||BUSY)return; const go=$('imp-go'); go.disabled=true; BUSY=true;
  let r;
  try{r=await DH.rpc('horarios_importar',{p_tienda:S.tienda,p_filas:IMP.rows,p_crear:!!($('imp-new')&&$('imp-new').checked),p_publicar:!!($('imp-pub')&&$('imp-pub').checked),p_aplicar:true});}
  catch(e){BUSY=false;go.disabled=false;errBox(tr('Could not upload. Try again. / No se pudo subir. Intenta de nuevo.'));return;}
  BUSY=false;
  if(!r||r.error){go.disabled=false;errBox(tr((r&&r.error)||'Could not upload. / No se pudo subir.'));return;}
  const first=(r.semanas||[])[0]; closeDlg(); if(first)SEM=first; await load();
}

async function openGest(){
  let G;try{G=await DH.rpc('horarios_gestores');}catch(e){return;}
  if(!G||G.error)return;
  const sec=S.tiendas.map(t=>{
    const cur=G.gestores.filter(g=>g.tienda===t), ids=new Set(cur.map(g=>g.roster_id));
    return `<div class="gs"><h3 data-no-i18n>${esc(t)}</h3>
    <div class="chips">${cur.map(g=>`<span class="who" data-no-i18n>${esc(g.nombre)}${g.cuenta?'':' <i>'+esc(tr('(no account yet) / (sin cuenta aún)'))+'</i>'}<button aria-label="Remove" data-r="${g.roster_id}" data-t="${esc(t)}" onclick="gSet(this.dataset.r,this.dataset.t,false)">×</button></span>`).join('')||`<span class="sub">${esc(tr('No one yet. / Nadie todavía.'))}</span>`}</div>
    <select data-t="${esc(t)}" onchange="if(this.value)gSet(this.value,this.dataset.t,true)"><option value="">${esc(tr('+ Add a person / + Agregar persona'))}</option>${G.personas.filter(x=>!ids.has(x.id)).map(x=>`<option value="${x.id}">${esc(x.nombre)} — ${esc(x.puesto||'')}${x.cuenta?'':' ('+esc(tr('no account yet / sin cuenta aún'))+')'}</option>`).join('')}</select></div>`;}).join('');
  showDlg(`<h2>${esc(tr('Who can edit each schedule / Quién puede editar cada horario'))}</h2><div class="sub">${esc(tr('Pick a person under the store. They can build, edit and publish that store’s schedule. Tap × to remove. / Elige una persona bajo la tienda. Puede armar, editar y publicar el horario de esa tienda. Toca × para quitar.'))}</div>${sec}
  <div class="err hide" id="f-e"></div><div class="acts"><button class="btn pri" onclick="closeDlg()">${esc(tr('Done / Listo'))}</button></div>`);
}
async function gSet(r,t,on){if(!r)return;const x=await call('horarios_gestor_set',{p_roster:r,p_tienda:t,p_on:on});if(x)openGest();}

window.addEventListener('dh-lang',()=>{if(S)render();if(!$('holview').classList.contains('hide'))$('holview').innerHTML=holTable();});
/* ---- Holiday schedule (read-only; master table, your own row highlighted) ---- */
let HOL=null;
function holSt(x){const k=x==null||x===''?'NA':String(x).replace(/\s+/g,'');return `<span class="hst ${esc(k)}" data-no-i18n>${esc(x==null||x===''?'—':x)}</span>`;}
const holEs=()=>L()==='es-US';
const holName=f=>holEs()?f.es:f.en;
const holDate=d=>fd(d,{weekday:'short',month:'short',day:'numeric'});
async function loadHol(){try{HOL=await DH.rpc('feriados_ver');}catch(e){HOL=null;}}
function holTable(){
  const es=holEs();
  if(!HOL)return `<div class="empty">${esc(tr('Could not load. / No se pudo cargar.'))}</div>`;
  const ed=!!HOL.puede_editar;
  const head=`<tr><th>${es?'Departamento':'Department'}</th>${(HOL.fechas||[]).map(f=>{
    const hrs=f.horario?(f.horario==='CLOSED'?(es?'Cerrado':'Closed'):(es?'Horario ':'Hours ')+f.horario):(ed?(es?'+ horario':'+ hours'):'');
    return `<th data-no-i18n>${esc(holName(f))}<small>${esc(holDate(f.fecha))}</small>${ed?`<small><button class="ed" onclick="editHours(${f.orden})">${esc(hrs)} ✎</button></small>`:`<small>${esc(hrs)}</small>`}</th>`;}).join('')}</tr>`;
  const body=(HOL.filas||[]).map(f=>`<tr class="${f.id===HOL.mia?'me':''}"><td data-no-i18n>${ed?`<button class="ed nm2" onclick="editDept(${f.id})">${esc(f.depto)}${f.id===HOL.mia?' ★':''} ✎</button>`:esc(f.depto)+(f.id===HOL.mia?' ★':'')}${f.nota?`<br><small style="font-weight:400;color:#6a7484">${esc(f.nota)}</small>`:''}</td>${f.estados.map((x,i)=>{const nt=(f.notas||[])[i];const nh=nt?`<small class="cn" data-no-i18n>${esc(nt)}</small>`:'';return `<td>${ed?`<button class="ed cell" onclick="editCell(${f.id},${i})" aria-label="${esc(f.depto)}">${holSt(x)}${nh}</button>`:holSt(x)+nh}</td>`;}).join('')}</tr>`).join('');
  const note=ed?(es?'Puedes editarlo: toca un estado, un horario o el nombre de un departamento. Los cambios los ve todo el equipo al instante.':'You can edit it: tap a status, an hours line or a department name. Everyone sees changes right away.'):(es?'Solo informativo; no se edita aquí.':'For information only; not edited here.');
  return `<div class="hn">${esc(es?'2026 DHC — horario de feriados por departamento. ':'2026 DHC holiday schedule by department. ')}${esc(note)} ${esc(es?'ON = trabaja, OFF = libre, “—” = no especificado. Tu departamento está resaltado (★).':'ON = working, OFF = day off, “—” = not specified. Your department is highlighted (★).')}${HOL.todas?'':esc(es?' Solo ves tu departamento.':' You only see your own department.')}</div><div class="tw"><table>${head}${body}</table></div>${ed?`<div style="margin-top:12px"><button class="btn" onclick="editDept(null)">+ ${esc(tr('Add department / Agregar departamento'))}</button></div>`:''}`;
}
async function holSave(name,args){
  const r=await call(name,args); if(!r)return false;
  closeDlg(); await loadHol(); if(!$('holview').classList.contains('hide'))$('holview').innerHTML=holTable(); return true;
}
function editCell(fid,i){
  const f=(HOL.filas||[]).find(x=>x.id===fid), fe=(HOL.fechas||[])[i]; if(!f||!fe)return;
  const opts=[['ON',tr('ON — working / trabaja')],['OFF',tr('OFF — day off / libre')],['ON CALL',tr('ON CALL — on call / de guardia')],['CLOSED',tr('CLOSED — store closed / CERRADO — tienda cerrada')],['',tr('Not specified / No especificado')]];
  showDlg(`<h2 data-no-i18n>${esc(f.depto)}</h2><div class="sub" data-no-i18n>${esc(holName(fe))} · ${esc(holDate(fe.fecha))}</div><div id="f-e" class="err hide"></div>
    <label for="f-nc">${esc(tr('Note for this cell (optional) / Nota para esta celda (opcional)'))}</label><input id="f-nc" maxlength="140" value="${esc((f.notas||[])[i]||'')}" placeholder="${esc(tr('e.g. Rosie: vacation / ej. Rosie: vacaciones'))}">
    <div class="sub">${esc(tr('Pick a status to save it with the note. / Elige un estado para guardarlo con la nota.'))}</div>
    <div style="display:grid;gap:8px;margin:10px 0">${opts.map(o=>`<button class="btn ${f.estados[i]===(o[0]||null)?'pri':''}" data-v="${esc(o[0])}" onclick="holSave('feriados_celda_set',{p_fila:${fid},p_idx:${i},p_valor:this.dataset.v,p_nota:$('f-nc').value})">${esc(o[1])}</button>`).join('')}</div>
    <div class="acts"><button class="btn" onclick="closeDlg()">${esc(tr('Cancel / Cancelar'))}</button></div>`);
}
function editHours(orden){
  const fe=(HOL.fechas||[]).find(x=>x.orden===orden); if(!fe)return;
  showDlg(`<h2 data-no-i18n>${esc(holName(fe))}</h2><div class="sub" data-no-i18n>${esc(holDate(fe.fecha))}</div><div id="f-e" class="err hide"></div>
    <label for="f-h">${esc(tr('Store hours / Horario de tiendas'))}</label><input id="f-h" maxlength="20" value="${esc(fe.horario||'')}" placeholder="10-4  /  CLOSED">
    <div class="sub">${esc(tr('Leave empty if not specified. / Déjalo vacío si no está especificado.'))}</div>
    <div class="acts"><button class="btn pri" onclick="holSave('feriados_horario_set',{p_orden:${orden},p_horario:$('f-h').value})">${esc(tr('Save / Guardar'))}</button><button class="btn" onclick="closeDlg()">${esc(tr('Cancel / Cancelar'))}</button></div>`);
}
function editDept(fid){
  const f=fid?(HOL.filas||[]).find(x=>x.id===fid):null;
  showDlg(`<h2>${esc(tr(f?'Edit department / Editar departamento':'Add department / Agregar departamento'))}</h2><div id="f-e" class="err hide"></div>
    <label for="f-d">${esc(tr('Name / Nombre'))}</label><input id="f-d" maxlength="80" value="${esc(f?f.depto:'')}">
    <label for="f-n">${esc(tr('Note (optional) / Nota (opcional)'))}</label><input id="f-n" maxlength="200" value="${esc(f&&f.nota||'')}">
    ${f?'':`<div class="sub">${esc(tr('A new department appears in the table for managers. To show it on someone’s own schedule, ask Claude to link it to the right people. / Un departamento nuevo aparece en la tabla para los gerentes. Para que salga en el horario personal de alguien, pídele a Claude que lo ligue a las personas.'))}</div>`}
    <div class="acts"><button class="btn pri" onclick="holSave('feriados_fila_set',{p_fila:${f?f.id:'null'},p_depto:$('f-d').value,p_nota:$('f-n').value})">${esc(tr('Save / Guardar'))}</button>${f?`<button class="btn d" onclick="if(confirm(tr('Delete this department row? / ¿Borrar esta fila?')))holSave('feriados_fila_borrar',{p_fila:${f.id}})">${esc(tr('Delete / Borrar'))}</button>`:''}<button class="btn" onclick="closeDlg()">${esc(tr('Cancel / Cancelar'))}</button></div>`);
}
function tab(k){
  const hol=k==='h';
  $('storeview').classList.toggle('hide',hol); $('holview').classList.toggle('hide',!hol);
  $('tb-s').classList.toggle('on',!hol); $('tb-h').classList.toggle('on',hol);
  if(hol){$('holview').innerHTML=holTable();}
  try{history.replaceState(null,'',hol?'#feriados':location.pathname+location.search);}catch(e){}
}
async function openPerson(rid){
  const r=(S.filas||[]).find(x=>x.id===rid); if(!r)return;
  const T=todayS(), dn=DAYN(), es=holEs();
  const week=`<div class="mine" style="margin:8px 0 12px"><div class="row">${S.dias.map((d,i)=>{const c=(r.celdas||{})[d.d];
    const body=!c?'—':c.libre?esc(tr('OFF / LIBRE')):shiftLines(c.t).map(esc).join('<br>');
    return `<div class="c ${d.d===T?'t':''} ${c&&c.libre?'o':''}"><b data-no-i18n>${esc(dn[i])} ${esc(fd(d.d,{day:'numeric'}))}</b>${body}</div>`;}).join('')}</div></div>`;
  const edit=`<button class="btn" onclick="closeDlg();tab('h')">🏢 ${esc(tr('Department schedule / Horario por departamento'))}</button>`+(S.puede_editar?`<button class="btn" onclick="openRow('${r.id}')">${esc(tr('Edit person / Editar persona'))}</button>`:'');
  showDlg(`<h2 data-no-i18n>${esc(r.nombre)}</h2><div class="sub">${esc(tr('This week / Esta semana'))} · ${esc(S.tienda)}</div>${week}<div id="pp-h"></div><div class="acts">${edit}<button class="btn" onclick="closeDlg()">${esc(tr('Close / Cerrar'))}</button></div>`);
  if(!r.roster_id)return;
  let p=null; try{p=await DH.rpc('feriados_persona',{p_roster:r.roster_id});}catch(e){}
  if(!p||!p.permitido||!p.fila||!$('pp-h'))return;
  const up=(p.fechas||[]).map((f,i)=>({f,i})).filter(x=>x.f.fecha>=T);
  if(!up.length)return;
  $('pp-h').innerHTML=`<h3 style="font:700 15px 'Segoe UI',Arial,sans-serif;margin:6px 0">🎄 ${esc(tr('Holidays / Feriados'))}</h3><div class="hc-row">${up.map(x=>`<div class="hc-d"><b data-no-i18n>${esc(holName(x.f))}</b><small data-no-i18n>${esc(holDate(x.f.fecha))}${x.f.horario&&x.f.horario!=='CLOSED'?' · '+esc(x.f.horario):''}</small>${holSt(p.fila.estados[x.i])}${(p.fila.notas||[])[x.i]?`<small data-no-i18n style="margin:6px 0 0">${esc(p.fila.notas[x.i])}</small>`:''}</div>`).join('')}</div>${p.fila.nota?`<div class="sub" data-no-i18n>${esc(p.fila.nota)}</div>`:''}`;
}

(async function init(){
  if(!DH.token()){location.href='index.html';return;}
  $('ld').textContent=tr('Loading… / Cargando…');
  await Promise.all([load(),loadHol()]);
  if(location.hash==='#feriados')tab('h');
})();
</script>
</body>
