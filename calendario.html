<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B3A6B">
<title>My Workspace — Promo Calendar / Calendario de promos</title>
<style>
  :root{--navy:#1B3A6B;--rail:#12284A;--gold:#C8922A;--lt:#D6E4F7;--ink:#1E2735;--gray:#6B6B6B;--red:#C0392B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F6;color:var(--ink)}
  header{background:var(--navy);border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff}
  header h1{font-size:18px} header a{color:var(--lt);font-size:13px;text-decoration:none}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  /* This week */
  .now{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);background:var(--rail);color:#fff;border-radius:8px;overflow:hidden;margin-bottom:18px;box-shadow:0 14px 34px -22px rgba(18,40,74,.7)}
  .now .l{padding:22px 26px;border-left:6px solid var(--gold)}
  .now .k{font:600 13px 'Segoe UI',Arial,sans-serif;color:#E8C878}
  .now h2{font:700 clamp(26px,4vw,40px)/1.1 Georgia,'Times New Roman',serif;margin:6px 0 6px;letter-spacing:-.4px}
  .now .d{font-size:16px;color:#cfe0f7}
  .now .nx{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:#cfe0f7}
  .now .nx b{color:#fff;display:block;font-size:15px}
  .now .r{background:rgba(255,255,255,.06);padding:16px;display:flex;gap:10px;align-items:center;justify-content:center;overflow:hidden}
  .now .r a{flex:0 1 128px;text-decoration:none;color:#fff;font-size:12px;min-width:0}
  .now .r img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;display:block;box-shadow:0 8px 18px -8px rgba(0,0,0,.6)}
  .now .r span{display:block;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .r .none{color:#9fb6d6;font-size:14px;text-align:center;padding:10px;line-height:1.5}
  .now.alone{grid-template-columns:1fr}
  /* Controls */
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .bar h3{font:600 24px 'Segoe UI',Arial,sans-serif;flex:1;min-width:150px;color:var(--ink)}
  .btn{border:1px solid #cfd6e2;background:#fff;border-radius:8px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
  .btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #cfd6e2;background:#fff;border-radius:18px;min-height:36px;padding:0 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
  .chip i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chip.off{opacity:.45;text-decoration:line-through}
  /* Month grid */
  .cal{background:#fff;border-radius:8px;padding:12px 12px 6px;box-shadow:0 1px 0 #dfe5ee}
  .dow,.days{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow div{font:700 12px 'Segoe UI',Arial,sans-serif;color:#677;padding:4px 6px;border-bottom:2px solid var(--navy)}
  .wk{position:relative;border-bottom:1px solid #e5e8ee;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/7 - 1px),#e5e8ee calc(100%/7 - 1px),#e5e8ee calc(100%/7))}
  .days div{padding:4px 7px;font:600 12px Arial,sans-serif;color:#555;min-height:26px}
  .days div.o{color:#bbb} .days div.t span{background:var(--navy);color:#fff;border-radius:10px;padding:1px 7px}
  .bars{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:26px;gap:3px 0;padding:0 2px 8px;min-height:20px}
  .ev{margin:0 2px;border:0;border-radius:5px;color:#fff;font:600 12px/26px 'Segoe UI',Arial,sans-serif;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;display:flex;align-items:center;gap:6px}
  .ev.pr{background:#fff!important;color:var(--ink);border:2px solid var(--gold);padding:0 6px 0 2px}
  .ev.pr img{height:20px;width:15px;object-fit:cover;border-radius:2px;flex:none}
  /* Agenda */
  .ag{background:#fff;border-radius:8px;padding:6px 16px 14px;box-shadow:0 1px 0 #dfe5ee}
  .ag h4{font:700 15px 'Segoe UI',Arial,sans-serif;color:var(--navy);margin:16px 0 6px}
  .ag .it{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 4px;border-top:1px solid #eef0f4;cursor:pointer;font-size:15px;min-height:44px}
  .ag .it i{width:6px;align-self:stretch;border-radius:3px;flex:none}
  .ag .it small{color:var(--gray);display:block;font-size:12px}
  .ag .it img{height:44px;width:33px;object-fit:cover;border-radius:3px;margin-left:auto}
  .empty{color:var(--gray);padding:16px 4px}
  /* Dialog */
  .dlg{position:fixed;inset:0;background:rgba(10,22,45,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .dlg.show{display:flex}
  .dlg>.p{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:20px 20px 22px}
  @media(min-width:700px){.dlg{align-items:center}.dlg>.p{border-radius:12px}}
  .dlg h2{font:700 24px/1.2 Georgia,'Times New Roman',serif;color:var(--navy);margin:6px 0}
  .tag{display:inline-block;color:#fff;border-radius:10px;padding:2px 10px;font:700 12px 'Segoe UI',Arial,sans-serif}
  .dlg .when{color:var(--gray);margin:2px 0 12px;font-size:15px}
  .dlg .note{white-space:pre-wrap;line-height:1.55;font-size:15px;margin-bottom:12px;overflow-wrap:anywhere}
  .dlg img.big{width:100%;border-radius:6px;margin-bottom:12px;display:block}
  .dlg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:10px 0 3px}
  input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid #cfd6e2;border-radius:8px;min-height:42px}
  textarea{min-height:90px;resize:vertical} .two{display:flex;gap:10px}.two>div{flex:1}
  .roles{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;margin-top:4px} .roles label{display:flex;gap:6px;align-items:center;margin:0;font-weight:600;color:var(--ink)} .roles input{width:auto;min-height:0}
  .err{background:#fdecea;color:var(--red);border-radius:8px;padding:9px 12px;font-size:14px;margin-top:10px}

  /* Big days */
  .big{position:relative;display:flex;align-items:center;gap:22px;border-radius:10px;padding:22px 28px;margin-bottom:16px;color:var(--fg);background:var(--bg);overflow:hidden;cursor:pointer;border:0;width:100%;text-align:left;box-shadow:0 18px 40px -24px rgba(0,0,0,.7);font-family:inherit}
  .big:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px);pointer-events:none}
  .big .em{font-size:clamp(54px,9vw,96px);line-height:1;transform:rotate(-8deg);flex:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
  .big .tx{position:relative;min-width:0;flex:1}
  .big .k{font:700 14px 'Segoe UI',Arial,sans-serif;color:var(--ac)}
  .big h2{font:900 clamp(36px,7vw,76px)/.95 'Arial Black','Segoe UI',Arial,sans-serif;letter-spacing:-1.5px;margin:4px 0 6px;color:var(--fg);text-shadow:4px 4px 0 var(--ac)}
  .big .d{font-size:16px;opacity:.92;max-width:60ch}
  .big .cd{position:relative;text-align:center;flex:none;background:var(--ac);color:var(--bg);border-radius:12px;padding:12px 22px;transform:rotate(3deg);box-shadow:5px 5px 0 rgba(0,0,0,.35)}
  .big .cd b{display:block;font:900 clamp(44px,7vw,72px)/1 'Arial Black',Arial,sans-serif}
  .big .cd span{font:700 14px 'Segoe UI',Arial,sans-serif}
  @media(max-width:760px){.big{flex-wrap:wrap;padding:18px}.big .cd{transform:none}}
  .wk.hw .days div{min-height:60px}
  .pop{position:absolute;z-index:4;top:-12px;left:calc(var(--c)*100%/7 - 4px);width:calc(100%/7 + 8px);height:70px;border:0;cursor:pointer;transform:rotate(-3deg);background:var(--bg);color:var(--fg);border-radius:10px 10px 10px 3px;box-shadow:4px 4px 0 var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-family:inherit;transition:transform .15s}
  .pop:nth-of-type(even){transform:rotate(3deg)}.pop.bf{z-index:6;transform:rotate(-4deg) scale(1.12)}.pop:hover{transform:rotate(-1deg) scale(1.06)}
  .pop b{font:900 clamp(11px,1.35vw,17px)/1 'Arial Black',Arial,sans-serif;text-align:center;overflow-wrap:anywhere}
  .pop i{position:absolute;right:-8px;top:-16px;font-style:normal;font-size:28px;transform:rotate(14deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .pop small{font:700 11px 'Segoe UI',Arial,sans-serif;color:var(--ac)}
  .ag .it.hero{background:var(--bg);color:var(--fg);border-radius:8px;margin:8px 0;padding:12px 14px;border-top:0;box-shadow:4px 4px 0 var(--ac)}
  .ag .it.hero small{color:var(--ac)} .ag .it.hero i{background:var(--ac)}
  .ag .it.hero b{font:900 20px 'Arial Black',Arial,sans-serif}
  .tag.hero{background:var(--bg)!important;color:var(--ac)}
  @media(prefers-reduced-motion:reduce){.pop{transition:none}}
  .hide{display:none!important}
  @media(max-width:760px){.now{grid-template-columns:1fr}.now .r{justify-content:flex-start;padding:12px 16px}.now .r a{flex:0 1 84px}.ev{font-size:11px}}
</style>
<meta name="dh-i18n" content="on">
<script src="dh-chrome.js" defer></script>
</head>
<body>
<header><h1>📅 Promo Calendar / Calendario de promos <small style="display:block;font:400 13px 'Segoe UI',Arial,sans-serif;color:#D6E4F7;margin-top:2px">What's coming / Lo que viene</small></h1><a href="index.html">← Home / Inicio</a></header>
<main>
  <section id="big"></section>
  <section class="now hide" id="now"></section>
  <div class="bar">
    <button class="btn" onclick="go(-1)" aria-label="Previous">‹</button>
    <h3 id="mt" data-no-i18n></h3>
    <button class="btn" onclick="go(0)">Today / Hoy</button>
    <button class="btn" onclick="go(1)" aria-label="Next">›</button>
    <button class="btn" id="vm" onclick="setView('month')">Month / Mes</button>
    <button class="btn" id="va" onclick="setView('agenda')">List / Lista</button>
    <button class="btn p hide" id="addb" onclick="openForm(null)">+ New event / Nuevo evento</button>
    <button class="btn hide" id="impb" onclick="openImport()">Upload Excel / Subir Excel</button>
    <button class="btn hide" id="edb" onclick="openEd()">Who can edit / Quién puede editar</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>
<div class="dlg" id="dlg" onclick="if(event.target===this)closeDlg()"><div class="p" id="dp" role="dialog" aria-modal="true"></div></div>
<script src="dh-session.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tr=s=>(window.DH&&DH.i18n)?DH.i18n.pick(s):s;
const LA='America/Los_Angeles', L=()=>(DH.i18n&&DH.i18n.lang==='es')?'es-US':'en-US';
const TYPES={campana:['Campaign / Campaña','#1B3A6B'],arte:['Artwork due / Entrega de arte','#7B4FA0'],compras:['Product list due / Lista de productos','#2E7D32'],tienda:['Store hours / Horario de tiendas','#0E7C86'],holiday:['Holiday / Feriado','#B8821F'],otro:['Other / Otro','#566573'],promo:['Flyers / Flyers','#C8922A']};
const ORDER=['campana','arte','compras','tienda','holiday','otro','promo'];
let D={items:[],puede_editar:false}, PR=[], URLS={}, OFF=new Set(), VIEW=window.matchMedia('(max-width:760px)').matches?'agenda':'month', EDIT=null, ASK=false;
const dI=s=>{const[y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5);};
const iso=i=>new Date(i*864e5).toISOString().slice(0,10);
const todayS=()=>new Date().toLocaleDateString('en-CA',{timeZone:LA});
const _t=todayS().split('-').map(Number); let CAL={y:_t[0],m:_t[1]-1};
const fmt=s=>new Date(s+'T12:00:00Z').toLocaleDateString(L(),{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
const fmtY=s=>new Date(s+'T12:00:00Z').toLocaleDateString(L(),{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
const span=e=>e.hasta&&e.hasta!==e.desde?fmt(e.desde)+' – '+fmt(e.hasta):fmt(e.desde);

async function init(){
  if(!DH.token()){location.href='index.html';return;}
  try{D=await DH.rpc('calendario_listar');}catch(e){$('view').innerHTML='<div class="empty">'+esc(tr('Could not load the calendar. / No se pudo cargar el calendario.'))+'</div>';return;}
  try{const r=await DH.rpc('promos_listar');PR=(r.items||[]).filter(p=>p.estado!=='oculta'&&p.vigente_desde);
      URLS=await DH.files.sign(PR.map(p=>p.archivo_id));}catch(e){PR=PR||[];}
  $('addb').classList.toggle('hide',!D.puede_editar); $('impb').classList.toggle('hide',!D.puede_editar);
  if(D.puede_editar){try{const g=await DH.rpc('calendario_editores');if(g&&!g.error)$('edb').classList.remove('hide');}catch(e){}}
  render();
}
// unify events + flyers
function all(){
  const ev=(D.items||[]).map(e=>({id:e.id,k:'e',tipo:e.tipo,titulo:e.titulo,desde:e.desde,hasta:e.hasta||e.desde,nota:e.nota,roles:e.roles}));
  const pr=PR.map(p=>({id:p.id,k:'p',tipo:'promo',titulo:p.titulo,desde:p.vigente_desde,hasta:p.vigente_hasta||p.vigente_desde,nota:p.descripcion,seccion:p.seccion,archivo:p.archivo_id,mime:p.mime}));
  return ev.concat(pr).filter(x=>!OFF.has(x.tipo));
}

const THEMES=[[/black friday/i,'#0B0B0B','#FFFFFF','#F2C14E','🛍️'],[/cyber monday/i,'#0F2A5C','#FFFFFF','#27D3F5','💻'],[/thanksgiving/i,'#7A3E0E','#FFF1DC','#F2A93B','🦃'],[/christmas eve/i,'#14532D','#FFFFFF','#E8B04B','🎁'],[/christmas/i,'#8E1B1B','#FFFFFF','#8FD19E','🎄'],[/new year/i,'#12284A','#FFFFFF','#E8C878','🎆'],[/big game/i,'#1D3B2A','#FFFFFF','#F5C542','🏈'],[/valentine/i,'#9B1B4B','#FFFFFF','#FFC2D6','💝'],[/presidents|memorial|labor|4th|july|martin/i,'#1B3A6B','#FFFFFF','#E5484D','🇺🇸'],[/easter/i,'#4B3B8F','#FFFFFF','#FFD6A5','🐣'],[/mother|father/i,'#7A2E5A','#FFFFFF','#FFD27A','💐'],[/halloween/i,'#2B1245','#FFFFFF','#FF8A1F','🎃']];
const theme=t=>{const m=THEMES.find(x=>x[0].test(t))||[0,'#1B3A6B','#FFFFFF','#C8922A','⭐'];return{bg:m[1],fg:m[2],ac:m[3],em:m[4]};};
const tv=th=>`--bg:${th.bg};--fg:${th.fg};--ac:${th.ac}`;
function bigDay(){
  const T=todayS(), ti=dI(T);
  const h=(D.items||[]).filter(e=>e.tipo==='holiday'&&e.desde>=T&&dI(e.desde)-ti<=75&&/black friday|cyber monday|christmas day|new year|presidents|memorial|4th|labor|mother|father|valentine|easter|big game|halloween/i.test(e.titulo)).sort((a,b)=>a.desde>b.desde?1:-1)[0];
  if(!h)return '';
  const n=dI(h.desde)-ti, th=theme(h.titulo);
  return `<button class="big" style="${tv(th)}" onclick="show('e','${h.id}')"><span class="em">${th.em}</span><span class="tx"><div class="k" data-no-i18n>${esc(fmt(h.desde))}</div><h2 data-no-i18n>${esc(h.titulo)}</h2>${h.nota?`<div class="d" data-no-i18n>${esc(h.nota)}</div>`:''}</span><span class="cd"><b data-no-i18n>${n===0?'🎉':n}</b><span>${esc(tr(n===0?'Today! / ¡Hoy!':n===1?'day to go / día para el gran día':'days to go / días para el gran día'))}</span></span></button>`;
}
function setView(v){VIEW=v;render();}
function go(n){if(n===0){CAL={y:_t[0],m:_t[1]-1};}else{CAL.m+=n;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}}render();}
function render(){
  $('vm').classList.toggle('on',VIEW==='month');$('va').classList.toggle('on',VIEW==='agenda');
  $('mt').textContent=new Date(Date.UTC(CAL.y,CAL.m,1)).toLocaleDateString(L(),{month:'long',year:'numeric',timeZone:'UTC'});
  $('chips').innerHTML=ORDER.map(t=>`<button class="chip ${OFF.has(t)?'off':''}" onclick="tg('${t}')" aria-pressed="${!OFF.has(t)}"><i style="background:${TYPES[t][1]}"></i>${esc(tr(TYPES[t][0]))}</button>`).join('');
  hero(); $('big').innerHTML=bigDay(); $('view').innerHTML=VIEW==='month'?month():agenda();
}
function tg(t){if(OFF.has(t))OFF.delete(t);else OFF.add(t);render();}
function hero(){
  const T=todayS(), ti=dI(T), ev=(D.items||[]), el=$('now');
  const act=ev.filter(e=>e.tipo==='campana'&&e.desde<=T&&(e.hasta||e.desde)>=T)[0];
  const nxA=ev.filter(e=>e.tipo==='arte'&&e.desde>=T).sort((a,b)=>a.desde>b.desde?1:-1)[0];
  const nxP=ev.filter(e=>e.tipo==='compras'&&e.desde>=T).sort((a,b)=>a.desde>b.desde?1:-1)[0];
  if(!act&&!nxA&&!nxP){el.classList.add('hide');return;}
  const fl=PR.filter(p=>p.estado==='vigente'&&URLS[p.archivo_id]&&p.mime&&p.mime.indexOf('image/')===0).slice(0,3);
  const days=e=>{const n=dI(e.desde)-ti;return n===0?tr('today / hoy'):n===1?tr('tomorrow / mañana'):tr('in / en')+' '+n+' '+tr('days / días');};
  el.className='now'+(fl.length?'':' alone');
  el.innerHTML=`<div class="l"><div class="k">${esc(tr(act?'In homes this week / En casas esta semana':'Coming up / Lo que sigue'))}</div>
    <h2 data-no-i18n>${esc(act?act.titulo:(nxA||nxP).titulo)}</h2>${act?`<div class="d" data-no-i18n>${esc(span(act))}</div>`:''}
    <div class="nx">${nxA?`<div>${esc(tr('Next artwork due / Próxima entrega de arte'))}<b data-no-i18n>${esc(nxA.titulo.replace(/^Art due · /,''))}</b><span data-no-i18n>${esc(fmt(nxA.desde))} · ${esc(days(nxA))}</span></div>`:''}
    ${nxP?`<div>${esc(tr('Next product list due / Próxima lista de productos'))}<b data-no-i18n>${esc(nxP.titulo.replace(/^Product list due · /,''))}</b><span data-no-i18n>${esc(fmt(nxP.desde))} · ${esc(days(nxP))}</span></div>`:''}</div></div>
    ${fl.length?`<div class="r">${fl.map(p=>`<a href="promociones.html"><img alt="" src="${esc(URLS[p.archivo_id].url)}"><span data-no-i18n>${esc(p.titulo)}</span></a>`).join('')}</div>`:''}`;
}
function month(){
  const first=new Date(Date.UTC(CAL.y,CAL.m,1)), dim=new Date(Date.UTC(CAL.y,CAL.m+1,0)).getUTCDate();
  const s0=Math.floor(first/864e5)-first.getUTCDay(), weeks=Math.ceil((first.getUTCDay()+dim)/7), ti=dI(todayS());
  const allx=all().map(e=>({e,a:dI(e.desde),b:dI(e.hasta)})), heroes=allx.filter(x=>x.e.tipo==='holiday'), its=allx.filter(x=>x.e.tipo!=='holiday').sort((x,y)=>x.a-y.a||(y.b-y.a)-(x.b-x.a)||(x.e.tipo>y.e.tipo?1:-1));
  const dow=[0,1,2,3,4,5,6].map(k=>new Date(Date.UTC(2023,0,1+k)).toLocaleDateString(L(),{weekday:'short',timeZone:'UTC'}));
  let h=`<div class="cal"><div class="dow" data-no-i18n>${dow.map(d=>`<div>${d}</div>`).join('')}</div>`;
  for(let w=0;w<weeks;w++){
    const ws=s0+7*w, we=ws+6, lanes=[];
    const bars=its.filter(x=>x.a<=we&&x.b>=ws).map(x=>{
      const c1=Math.max(x.a,ws)-ws+1,c2=Math.min(x.b,we)-ws+2;let l=lanes.findIndex(v=>v<c1);if(l<0){l=lanes.length;lanes.push(0);}lanes[l]=c2-1;
      const pr=x.e.k==='p', u=pr&&URLS[x.e.archivo], im=u&&x.e.mime&&x.e.mime.indexOf('image/')===0;
      return `<button class="ev ${pr?'pr':''}" style="grid-column:${c1}/${c2};grid-row:${l+1};background:${TYPES[x.e.tipo][1]}" title="${esc(x.e.titulo)}" onclick="show('${x.e.k}','${x.e.id}')" data-no-i18n>${im?`<img alt="" src="${esc(u.url)}">`:''}${esc(x.e.titulo)}</button>`;}).join('');
    const hs=heroes.filter(x=>x.a>=ws&&x.a<=we);
    const pops=hs.map(x=>{const th=theme(x.e.titulo);return `<button class="pop ${/black friday/i.test(x.e.titulo)?'bf':''}" style="--c:${x.a-ws};${tv(th)}" onclick="show('e','${x.e.id}')" title="${esc(x.e.titulo)}" data-no-i18n><i>${th.em}</i><b>${esc(x.e.titulo)}</b></button>`;}).join('');
    h+=`<div class="wk ${hs.length?'hw':''}">${pops}<div class="days" data-no-i18n>${[0,1,2,3,4,5,6].map(k=>{const dd=new Date((ws+k)*864e5);return `<div class="${dd.getUTCMonth()!==CAL.m?'o':''} ${ws+k===ti?'t':''}"><span>${dd.getUTCDate()}</span></div>`;}).join('')}</div><div class="bars">${bars}</div></div>`;
  }
  return h+'</div>';
}
function agenda(){
  const a=iso(Math.floor(Date.UTC(CAL.y,CAL.m,1)/864e5)), b=iso(Math.floor(Date.UTC(CAL.y,CAL.m+1,0)/864e5));
  const its=all().filter(e=>e.desde<=b&&e.hasta>=a).sort((x,y)=>x.desde>y.desde?1:x.desde<y.desde?-1:(x.tipo>y.tipo?1:-1));
  if(!its.length)return '<div class="ag"><div class="empty">'+esc(tr('Nothing scheduled this month. / No hay nada programado este mes.'))+'</div></div>';
  let h='<div class="ag">',last='';
  its.forEach(e=>{const key=e.desde<a?a:e.desde;
    if(key!==last){h+=`<h4 data-no-i18n>${esc(fmtY(key))}</h4>`;last=key;}
    const u=e.k==='p'&&URLS[e.archivo], im=u&&e.mime&&e.mime.indexOf('image/')===0;
    const hth=e.tipo==='holiday'?theme(e.titulo):null;

  return h+'</div>';
}

let IMP=null, BUSY=false;
function loadXL(){return new Promise((res,rej)=>{if(window.XLSX)return res();const x=document.createElement('script');x.src='vendor/xlsx.mini.min.js';x.onload=res;x.onerror=rej;document.head.appendChild(x);});}
const pad=n=>String(n).padStart(2,'0');
function pdate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){const o=XLSX.SSF.parse_date_code(v);return o?o.y+'-'+pad(o.m)+'-'+pad(o.d):null;}
  const t=String(v).trim(); let m;
  if(m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/)){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(m[1])+'-'+pad(m[2]);}
  return null;
}
const errBox=m=>{const e=$('f-e');if(e){e.textContent=m;e.classList.remove('hide');}};
function openImport(){
  IMP={rows:[],ready:false};
  const cols=[['A','Title / Título','Black Friday Sale','Required / Obligatorio'],['B','Type / Tipo','Campaign','Campaign, Artwork due, Product list due, Store hours, Holiday, Other / Campaña, Entrega de arte, Lista de productos, Horario de tiendas, Feriado, Otro'],['C','From / Desde','2026-11-27','YYYY-MM-DD or MM/DD/YYYY / AAAA-MM-DD o MM/DD/AAAA'],['D','To / Hasta','2026-11-30','Optional. Leave empty for one day. / Opcional. Vacío si es un solo día.'],['E','Note / Nota','Doorbusters on sectionals','Optional / Opcional'],['F','Who sees it / Quién lo ve','Everyone','Optional: Everyone, or Sales, Staff, Manager, Director separated by commas. / Opcional: Todos, o Vendedor, Staff, Manager, Director separados por comas.']];
  $('dp').innerHTML=`<h2>${esc(tr('Upload calendar events from Excel / Subir eventos al calendario desde Excel'))}</h2>
  <div class="note" style="white-space:normal;background:#FFF8E6;border:1px solid #F0E2B8;border-radius:8px;padding:12px;font-size:14px"><b>${esc(tr('Your file needs these 6 columns, in this order, one row per event. / Tu archivo necesita estas 6 columnas, en este orden, una fila por evento.'))}</b>
  <div style="overflow-x:auto"><table style="border-collapse:collapse;margin:8px 0;font-size:13px;width:100%"><thead><tr style="text-align:left"><th style="padding:5px 6px"> </th><th style="padding:5px 6px;white-space:nowrap">${esc(tr('Column / Columna'))}</th><th style="padding:5px 6px">${esc(tr('Example / Ejemplo'))}</th><th style="padding:5px 6px">${esc(tr('Notes / Notas'))}</th></tr></thead><tbody>
  ${cols.map(c=>`<tr style="border-top:1px solid #eadfba"><td style="padding:5px 6px"><b>${c[0]}</b></td><td style="padding:5px 6px;white-space:nowrap">${esc(tr(c[1]))}</td><td style="padding:5px 6px" data-no-i18n>${esc(c[2])}</td><td style="padding:5px 6px">${esc(tr(c[3]))}</td></tr>`).join('')}</tbody></table></div>
  <ul style="padding-left:18px;line-height:1.6">
  <li>${esc(tr('The first row is the header (titles). / La primera fila es el encabezado (títulos).'))}</li>
  <li>${esc(tr('If an event with the same title, type and start date already exists, it is updated instead of duplicated. / Si ya existe un evento con el mismo título, tipo y fecha de inicio, se actualiza en vez de duplicarse.'))}</li>
  <li>${esc(tr('Up to 500 rows per file. Nothing is deleted. / Hasta 500 filas por archivo. No se borra nada.'))}</li></ul></div>
  <div class="acts" style="margin-top:10px"><button class="btn" id="tplb" onclick="downloadTpl(false)">${esc(tr('Download template / Descargar plantilla'))}</button><button class="btn" onclick="downloadTpl(true)">${esc(tr('Download upcoming events / Descargar eventos próximos'))}</button></div>
  <label for="f-x" style="display:block;font-weight:700;font-size:14px;margin:14px 0 4px">${esc(tr('Choose your Excel file / Elige tu archivo de Excel'))}</label><input type="file" id="f-x" accept=".xlsx,.xls,.csv" onchange="readImport(this.files[0])" style="font:inherit;width:100%">
  <div id="imp-pre"></div><div class="err hide" id="f-e"></div>
  <div class="acts"><button class="btn p" id="imp-go" disabled onclick="doImport()">${esc(tr('Upload / Subir'))}</button><button class="btn" onclick="closeDlg()">${esc(tr('Cancel / Cancelar'))}</button></div>`;
  $('dlg').classList.add('show');
}
async function downloadTpl(current){
  try{await loadXL();}catch(e){errBox(tr('Could not load the Excel tool. Check your connection. / No se pudo cargar la herramienta de Excel. Revisa tu conexión.'));return;}
  const H=['Title','Type','From','To','Note','Who sees it'], rows=[H];
  const tn={campana:'Campaign',arte:'Artwork due',compras:'Product list due',tienda:'Store hours',holiday:'Holiday',otro:'Other'};
  if(current){const t0=new Date().toLocaleDateString('en-CA',{timeZone:LA});(D.items||[]).filter(e=>(e.hasta||e.desde)>=t0).forEach(e=>rows.push([e.titulo,tn[e.tipo]||e.tipo,e.desde,e.hasta||'',e.nota||'',e.roles?e.roles.join(', '):'Everyone']));}
  else{rows.push(['Black Friday Sale','Campaign','2026-11-27','2026-11-30','Doorbusters on sectionals','Everyone']);rows.push(['Black Friday artwork','Artwork due','2026-11-20','','','Everyone']);rows.push(['Thanksgiving','Holiday','2026-11-26','','Stores closed','Everyone']);}
  const ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:34},{wch:18},{wch:12},{wch:12},{wch:40},{wch:22}];
  const ins=[['How to fill this file / Cómo llenar este archivo'],[''],['One row per event. Keep the header in row 1. / Una fila por evento. Deja el encabezado en la fila 1.'],['Title (A): required, up to 120 characters. / Título (A): obligatorio, hasta 120 caracteres.'],['Type (B): Campaign, Artwork due, Product list due, Store hours, Holiday or Other (Spanish names work too). / Tipo (B): Campaña, Entrega de arte, Lista de productos, Horario de tiendas, Feriado u Otro (también en inglés).'],['From (C): YYYY-MM-DD or MM/DD/YYYY. To (D): optional, same format. / Desde (C): AAAA-MM-DD o MM/DD/AAAA. Hasta (D): opcional, mismo formato.'],['Note (E): optional. Who sees it (F): Everyone, or Sales, Staff, Manager, Director separated by commas. / Nota (E): opcional. Quién lo ve (F): Todos, o Vendedor, Staff, Manager, Director separados por comas.'],['Same title + type + start date = the event is updated, not duplicated. / Mismo título + tipo + fecha de inicio = se actualiza el evento, no se duplica.']];
  const wi=XLSX.utils.aoa_to_sheet(ins); wi['!cols']=[{wch:120}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Events'); XLSX.utils.book_append_sheet(wb,wi,'Instructions');
  XLSX.writeFile(wb,current?'calendar-upcoming.xlsx':'calendar-template.xlsx');
}
function impErrs(errs){return `<div class="err" style="margin-top:12px"><b>${esc(tr('Fix these rows in your file and upload it again: / Corrige estas filas en tu archivo y vuelve a subirlo:'))}</b><ul style="padding-left:18px;margin-top:6px">${errs.slice(0,12).map(e=>`<li>${esc(tr('Row / Fila'))} ${e[0]}: ${esc(e[1])}</li>`).join('')}${errs.length>12?`<li>… +${errs.length-12}</li>`:''}</ul></div>`;}
async function readImport(file){
  if(!file)return;
  const pre=$('imp-pre'), go=$('imp-go'); go.disabled=true; pre.innerHTML=''; $('f-e').classList.add('hide');
  try{await loadXL();}catch(e){errBox(tr('Could not load the Excel tool. Check your connection. / No se pudo cargar la herramienta de Excel. Revisa tu conexión.'));return;}
  let data;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];data=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});}
  catch(e){errBox(tr('That file could not be read. Use .xlsx, .xls or .csv. / No se pudo leer ese archivo. Usa .xlsx, .xls o .csv.'));return;}
  const rows=[], errs=[]; let start=0;
  if(data.length&&pdate(data[0][2])==null)start=1;
  const S=v=>v==null?'':String(v).trim();
  for(let i=start;i<data.length;i++){
    const r=data[i], rn=i+1; if(!r||r.every(x=>S(x)===''))continue;
    const d=pdate(r[2]); const h=S(r[3])===''?'':pdate(r[3]);
    if(S(r[2])!==''&&!d){errs.push([rn,tr('Start date not understood / No se entiende la fecha de inicio')]);continue;}
    if(S(r[3])!==''&&!h){errs.push([rn,tr('End date not understood / No se entiende la fecha final')]);continue;}
    rows.push({titulo:S(r[0]),tipo:S(r[1]),desde:d||'',hasta:h||'',nota:S(r[4]),roles:S(r[5])});
  }
  if(!rows.length&&!errs.length){errBox(tr('No events found in the file. / No se encontraron eventos en el archivo.'));return;}
  if(errs.length){pre.innerHTML=impErrs(errs);return;}
  let r;
  try{r=await DH.rpc('calendario_importar',{p_filas:rows,p_aplicar:false});}catch(e){errBox(tr('Could not check the file. Try again. / No se pudo revisar el archivo. Intenta de nuevo.'));return;}
  if(r&&r.error){errBox(tr(r.error));return;}
  const bad=(r.errores||[]).map(e=>[e.fila,tr(e.msg)]);
  if(bad.length){pre.innerHTML=impErrs(bad);return;}
  IMP={rows,ready:true};
  pre.innerHTML=`<div class="note" style="white-space:normal;margin-top:12px;background:#EAF6EC;border:1px solid #bfe0c5;border-radius:8px;padding:12px"><b>✓ ${r.nuevos} ${esc(tr('new events / eventos nuevos'))}</b>${r.actualizados?` · ${r.actualizados} ${esc(tr('will be updated / se actualizarán'))}`:''}</div>`;
  go.disabled=false;
}
async function doImport(){
  if(!IMP||!IMP.ready||BUSY)return; const go=$('imp-go'); go.disabled=true; BUSY=true;
  let r; try{r=await DH.rpc('calendario_importar',{p_filas:IMP.rows,p_aplicar:true});}catch(e){BUSY=false;go.disabled=false;errBox(tr('Could not upload. Try again. / No se pudo subir. Intenta de nuevo.'));return;}
  BUSY=false;
  if(!r||r.error){go.disabled=false;errBox(tr((r&&r.error)||'Could not upload. / No se pudo subir.'));return;}
  closeDlg(); D=await DH.rpc('calendario_listar'); render();
}
