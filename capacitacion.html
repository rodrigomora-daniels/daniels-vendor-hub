<style>
  :root{--navy:#1B3A6B;--rail:#12284A;--gold:#C8922A;--lt:#D6E4F7;--ink:#1E2735;--gray:#5F6B7A;--paper:#FBF7EE;--ok:#2E7D32}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F6;color:var(--ink)}

  button{font-family:inherit} :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .hero{background:var(--rail);color:#fff;border-radius:10px;padding:26px 28px;border-left:6px solid var(--gold);display:grid;grid-template-columns:1fr auto;gap:18px 30px;align-items:end;box-shadow:0 16px 36px -24px rgba(18,40,74,.8)}

  .rules div{background:#fff;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.35;border-top:3px solid var(--gold);font-weight:600}
  .seg{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
  .seg button{border:1px solid #cfd6e2;background:#fff;border-radius:22px;min-height:44px;padding:0 20px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}

  .tags:before{content:"";position:absolute;left:0;right:0;top:14px;border-top:2px dashed #9fb0c8}
  .tag{position:relative;flex:0 0 138px;scroll-snap-align:start;background:var(--paper);border:1px solid #d9cfb8;border-radius:6px 6px 10px 10px;padding:26px 12px 12px;text-align:left;cursor:pointer;color:var(--ink);min-height:112px;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%,0 14px);transition:transform .15s}
  .tag:before{content:"";position:absolute;top:8px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#EEF1F6;border:2px solid #b9a98a}

  .day{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:6px}
  .card{background:#fff;border-radius:10px;padding:22px 24px;box-shadow:0 1px 0 #dfe5ee}
  .day h3{font:700 clamp(24px,3.4vw,34px)/1.15 Georgia,serif;color:var(--navy);margin-bottom:8px}
  .obj{font-size:17px;line-height:1.5;color:#33404f;margin-bottom:16px}
  .blk{border-top:1px solid #e6e9ef;padding:14px 0 4px}
  .blk h4{font-size:15px;color:var(--navy);margin-bottom:8px}
  .blk h5{font-size:14px;margin:10px 0 4px}
  .blk ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
  .blk li{font-size:15px;line-height:1.4;padding-left:18px;position:relative}
  .blk li:before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--gold)}

  .note{background:#F4F6FA;border-radius:8px;padding:10px 12px;font-size:14px;color:var(--gray);margin:10px 0;line-height:1.45}
  .out{background:#EAF5EC;border-left:5px solid var(--ok);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:15px;font-weight:600;line-height:1.4}
  .out small{display:block;color:var(--ok);font-weight:700;margin-bottom:2px}
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{border:1px solid #cfd6e2;background:#fff;border-radius:10px;min-height:46px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:8px;text-decoration:none}

  .side h4{font-size:15px;color:var(--navy);margin-bottom:10px}
  .vid{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 0;border-top:1px solid #eef0f4;cursor:pointer;align-items:center;min-height:68px}
  .vid:first-of-type{border-top:0}
  .vid .th{position:relative;flex:0 0 112px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#222}
  .vid img{width:100%;height:100%;object-fit:cover;display:block}
  .vid .th:after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;background:rgba(0,0,0,.28)}
  .vid b{font-size:14px;line-height:1.3;color:var(--ink)} .vid small{display:block;color:var(--gray);font-size:12px;margin-top:2px}
  .lib{display:flex;gap:10px;align-items:center;width:100%;border:0;background:#F4F6FA;border-radius:8px;padding:10px 12px;margin-bottom:8px;text-align:left;cursor:pointer;min-height:48px;font-size:14px;font-weight:600;color:var(--ink)}
  .lib span:first-child{font-size:20px}.lib span:last-child{font-size:14px}
  .sp{margin-bottom:16px}
  .stages{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stage{background:#fff;border-radius:10px;padding:22px;border-top:5px solid var(--navy)}
  .stage .w{font:700 34px/1 Georgia,serif;color:var(--navy)} .stage h4{margin:8px 0 10px;font-size:16px}
  .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  .kp div{background:var(--rail);color:#fff;border-radius:10px;padding:18px;font:700 17px/1.25 Georgia,serif;border-bottom:4px solid var(--gold)}
  .grp{margin:16px 0 6px;font-size:15px;font-weight:700;color:var(--navy)}
  .rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .rl .lib{margin:0;background:#fff}
  .modal{position:fixed;inset:0;background:rgba(8,18,38,.88);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px}

  .modal .bar button{background:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
  .modal .fr{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}.modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .modal small{color:#b9c8df;display:block;margin-top:8px;font-size:13px}

  .cks{display:grid;gap:8px;margin-top:4px}
  .ck2{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid #d9dfe9;background:#fff;border-radius:10px;padding:10px 12px;min-height:50px;cursor:pointer;font-size:15px;line-height:1.35;color:var(--ink)}
  .ck2 i{flex:0 0 26px;height:26px;border-radius:7px;border:2px solid #aab6c8;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#fff}
  .ck2.on{background:#EAF5EC;border-color:#b6d9bb}.ck2.on i{background:var(--ok);border-color:var(--ok)}
  .say{display:grid;gap:8px}
  .say p{background:#F4F6FA;border-left:4px solid var(--gold);border-radius:4px 10px 10px 4px;padding:10px 14px;font-size:15px;line-height:1.45}

  ol.four li:before{content:counter(s);position:absolute;left:12px;top:10px;font:700 26px Georgia,serif;color:#E8C878}
  .obj2{border-top:1px solid #e6e9ef;padding:10px 0}.obj2 b{color:var(--navy);font-size:15px}.obj2 p{margin-top:4px;font-size:15px;line-height:1.45;color:#33404f}
  .kp small{display:block;margin-top:8px;font:400 13px/1.4 'Segoe UI',Arial,sans-serif;color:#cfe0f7}
  @media(max-width:860px){ol.four{grid-template-columns:1fr}}
  .hide{display:none!important}
  @media(max-width:860px){.hero{grid-template-columns:1fr}.prog{text-align:left}.rules{grid-template-columns:1fr 1fr}.day{grid-template-columns:1fr}.stages{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}.blk ul{grid-template-columns:1fr}.card{padding:18px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function openRes(id){
  const it=RES.find(x=>x.id===id); if(!it)return;
  if(!it.archivo_id&&it.url){window.open(it.url,'_blank','noopener');return;}
  const w=window.open('','_blank');

}

function manuals(){
  let h='';
  MAN_CATS.forEach(([k,lab])=>{const its=RES.filter(r=>(r.categoria||'').startsWith(k)); if(!its.length)return; h+=`<div class="grp">${esc(T(lab))}</div><div class="rl">${its.map(libBtn).join('')}</div>`;});
  return (h||`<div class="note">${esc(T(UI.notFound))}</div>`)+`<div class="acts"><a class="btn" href="recursos.html">${esc(T(UI.all))}</a></div>`;
}
function glossary(){return `<div class="rl" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:6px">${GLOS.map(g=>`<div class="card" style="padding:16px 18px"><b style="color:var(--navy);font-size:16px">${esc(T(g[0]))}</b><p style="margin-top:6px;font-size:15px;line-height:1.45">${esc(T(g[1]))}</p></div>`).join('')}</div>`;}
function tick(k){DONE[k]=!DONE[k];saveDone();render();}
function toggleDone(){DONE[SEL]=!DONE[SEL];saveDone();render();}
function playV(id){
  $('vt').textContent=T(VID[id]); $('vc').textContent=T(UI.close); $('vs').textContent=SRC[id]||'';
  $('vf').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1" title="${esc(T(VID[id]))}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  $('vm').classList.add('show'); document.body.style.overflow='hidden';
}
function closeV(){$('vm').classList.remove('show');$('vf').innerHTML='';document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeV();});
window.addEventListener('dh-lang',()=>render());
(async function init(){
  if(!DH.token()){location.href='index.html';return;}
  loadDone(); render();
  try{const r=await DH.rpc('recursos_listar');RES=(r&&r.items)||[];}catch(e){RES=[];}
  render();
})();
</script>
